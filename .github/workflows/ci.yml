name: CI
on:
  pull_request:
  push:
    branches: [main]
# Least privilege: this job only reads the code.
permissions:
  contents: read
# A new push to the same PR cancels the run that's now out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: recipe_app
          POSTGRES_PASSWORD: recipe_app
          POSTGRES_DB: recipe_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_app -d recipe_app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://recipe_app:recipe_app@localhost:5432/recipe_app
    steps:
      # Actions are pinned to a full commit SHA, because a tag can be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install dependencies exactly as locked
        run: uv sync --locked
      - name: Pre-commit hooks
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
      - name: Type check
        run: uv run --frozen mypy
      - name: Tests
        run: uv run --frozen pytest
  latency:
    name: search latency on 50,000 recipes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: recipe_app
          POSTGRES_PASSWORD: recipe_app
          POSTGRES_DB: recipe_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_app -d recipe_app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://recipe_app:recipe_app@localhost:5432/recipe_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install dependencies exactly as locked
        run: uv sync --locked
      - name: Migrate and load the 50,000-recipe gate seed
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen python -m tests.gate load
      # ADR-0007 rule 7: prints p50/p95/p99 per search, and fails only when a
      # search is above twice the budget, so runner noise doesn't fail a PR.
      - name: Time every gate search
        run: uv run --frozen python -m tests.gate bench --check
  web:
    name: web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # uv runs `recipe-app openapi`, which the API types are generated from
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install dependencies exactly as locked
        run: |
          uv sync --locked
          npm ci
      - name: API types match the API
        run: npm run api:check
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: recipe_app
          POSTGRES_PASSWORD: recipe_app
          POSTGRES_DB: recipe_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_app -d recipe_app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://recipe_app:recipe_app@localhost:5432/recipe_app
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install dependencies exactly as locked
        run: |
          uv sync --locked
          npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Migrate and load the catalog
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen recipe-app db sync
        working-directory: .
      - name: End-to-end, accessibility and motion tests
        run: npm run e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
