name: CI
on:
  pull_request:
  push:
    branches: [main]
# Least privilege: this job only reads the code.
permissions:
  contents: read
# A new push to the same PR cancels the run that's now out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: recipe_app
          POSTGRES_PASSWORD: recipe_app
          POSTGRES_DB: recipe_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_app -d recipe_app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://recipe_app:recipe_app@localhost:5432/recipe_app
    steps:
      # Actions are pinned to a full commit SHA, because a tag can be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install dependencies exactly as locked
        run: uv sync --locked
      - name: Pre-commit hooks
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
      - name: Type check
        run: uv run --frozen mypy
      - name: Tests
        run: uv run --frozen pytest
