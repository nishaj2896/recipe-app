[[recipe]]
id = "01a15175-3c0c-7410-9068-956c67818f62"
name = "Sambar"
serves = 4
prep_minutes = 15
cook_minutes = 35
ingredients = [
  { id = "toor-dal", amount = 150, unit = "g" },
  { id = "drumsticks", amount = 2, unit = "piece" },
  { id = "brinjal", amount = 1, unit = "small" },
  { id = "tamarind", amount = 15, unit = "g" },
  { id = "sambar-powder", amount = 2, unit = "tbsp" },
  { id = "tomato", amount = 1, unit = "medium" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "mustard-seeds", amount = 1, unit = "tsp" },
  { id = "curry-leaves", amount = 10, unit = "leaf" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "l" },
]
steps = [
  "Rinse the toor dal in several changes of water. Cook it with half the water and the turmeric for 25 minutes, or 3 whistles in a pressure cooker, until very soft. Mash it smooth.",
  "Soak the tamarind in a little of the rest of the water, warm, for 10 minutes. Squeeze it, then strain the pulp and discard the fibres.",
  "Cut the drumsticks into finger-length pieces and the brinjal into cubes. Chop the onion and tomato.",
  "Put the vegetables in a pan with the tamarind pulp and salt. Simmer for 12 minutes, until the drumsticks are tender.",
  "Stir in the sambar powder and the dal and add the rest of the water to make a pourable sambar. Simmer for 8 minutes.",
  "Heat the oil in a small pan. Add the mustard seeds and, when they pop, the curry leaves.",
  "Pour this over the sambar, taste for salt and serve hot.",
]

[[recipe]]
id = "01a15175-3c1d-7c1d-b8aa-d85e1a2b9630"
name = "Kerala fish curry"
serves = 4
prep_minutes = 15
cook_minutes = 25
ingredients = [
  { id = "kingfish", amount = 500, unit = "g" },
  { id = "coconut-milk", amount = 400, unit = "ml" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "tomato", amount = 1, unit = "medium" },
  { id = "ginger", amount = 10, unit = "g" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "curry-leaves", amount = 12, unit = "leaf" },
  { id = "tamarind", amount = 10, unit = "g" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "red-chilli-powder", amount = 2, unit = "tsp" },
  { id = "coconut-oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Cut the kingfish into thick steaks and rub them with a little of the turmeric and salt.",
  "Soak the tamarind in the water for 10 minutes, then squeeze it and strain the pulp.",
  "Thinly slice the onion, ginger and garlic, and chop the tomato.",
  "Heat the coconut oil in a clay pot or heavy pan over medium heat. Add half the curry leaves, then the onion, ginger and garlic. Cook for 5 minutes, until soft.",
  "Lower the heat, add the rest of the turmeric and the red chilli powder and stir for 10 seconds.",
  "Add the tomato and cook for 4 minutes, until it breaks down.",
  "Pour in the tamarind pulp and coconut milk and add salt. Bring to a gentle simmer; don't let it boil hard, or the coconut milk will split.",
  "Slide in the kingfish and simmer for 10 to 12 minutes, shaking the pan rather than stirring so the fish stays whole, until it flakes easily.",
  "Scatter the rest of the curry leaves over and serve.",
]

[[recipe]]
id = "01a15175-3c1e-730e-b9ba-d7d3a63e5dac"
name = "Prawn masala"
serves = 4
prep_minutes = 15
cook_minutes = 20
ingredients = [
  { id = "prawns", amount = 500, unit = "g" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "ginger-garlic-paste", amount = 1, unit = "tbsp" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "red-chilli-powder", amount = 1.5, unit = "tsp" },
  { id = "garam-masala", amount = 0.5, unit = "tsp" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Peel and devein the prawns. Toss them with a little of the turmeric and salt.",
  "Finely chop the onions and tomatoes.",
  "Heat the oil in a pan over medium heat. Add the onions and cook for 8 minutes, until golden.",
  "Add the ginger garlic paste and stir for 1 minute, until the raw smell goes.",
  "Lower the heat, add the rest of the turmeric and the red chilli powder, then the tomatoes. Cook for 6 minutes, until thick and the oil separates.",
  "Add the prawns and cook for 4 to 5 minutes, just until they curl and turn pink. Overcooked prawns turn rubbery.",
  "Stir in the garam masala, taste for salt and serve with roti.",
]
