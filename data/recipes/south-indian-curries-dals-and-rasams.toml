  { id = "ginger-garlic-paste", amount = 1, unit = "tbsp" },
  { id = "red-chilli-powder", amount = 1.5, unit = "tsp" },
  { id = "turmeric", amount = 0.25, unit = "tsp" },
  { id = "tamarind", amount = 1, unit = "tbsp" },
