  { id = "oil", amount = 0.25, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Soak the tamarind in a little of the water, warmed, for 15 minutes. Squeeze it and strain the pulp.",
  "Dry roast the peanuts in a pan over medium heat for 4 minutes, until they crackle and smell nutty. Add the sesame seeds, dried coconut, coriander seeds and cumin seeds and roast for 2 minutes more, until the sesame seeds turn golden.",
  "Chop one of the onions roughly and grind it with the roasted mixture, the red chilli powder, turmeric, jaggery and salt into a thick paste.",
  "Wash the small brinjals and cut each into four from the bottom, leaving the stalk end joined. Fill the cuts with the paste and keep the leftover paste.",
  "Heat the oil in a wide pan over medium heat. Lay the small brinjals in one layer, cover and cook for 10 minutes, turning gently every few minutes, until they soften and brown in patches.",
  "Lift the small brinjals out. Finely chop the other onion and cook it in the same oil with the curry leaves for 5 minutes, until golden. Add the ginger garlic paste and stir for 1 minute.",
  "Add the leftover paste and fry for 3 minutes, until the oil starts to separate.",
  "Pour in the tamarind pulp and the rest of the water. Return the small brinjals, cover and simmer on low heat for 10 to 12 minutes, until they are very soft and the gravy is thick and glossy.",
  "Taste and add salt if needed. Serve with roti or chapati.",
]

