[[recipe]]
id = "01a18c16-b1f2-74a5-b7e7-d9ff01095978"
name = "Churros"
serves = 4
prep_minutes = 15
cook_minutes = 20
ingredients = [
  { id = "all-purpose-flour", amount = 1, unit = "cup" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "sugar", amount = 0.5, unit = "cup" },
  { id = "egg", amount = 1, unit = "large" },
  { id = "ground-cinnamon", amount = 1, unit = "tsp" },
  { id = "dark-chocolate", amount = 100, unit = "g" },
