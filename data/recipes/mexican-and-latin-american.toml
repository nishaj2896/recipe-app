[[recipe]]
id = "01a18c16-b1e3-7190-97eb-a925b88fbe38"
name = "Tortilla soup"
serves = 4
prep_minutes = 15
cook_minutes = 35
ingredients = [
  { id = "chicken", amount = 400, unit = "g" },
  { id = "chicken-stock", amount = 5, unit = "cup" },
  { id = "canned-tomatoes", amount = 1, unit = "can" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "jalapeno", amount = 1, unit = "piece" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "corn-tortillas", amount = 6, unit = "piece" },
  { id = "oil", amount = 0.33, unit = "cup" },
  { id = "avocado", amount = 1, unit = "large" },
  { id = "lime", amount = 1, unit = "medium" },
  { id = "coriander-leaves", amount = 0.25, unit = "cup" },
  { id = "sour-cream", amount = 0.33, unit = "cup" },
  { id = "salt", to_taste = true },
]
steps = [
  "Cut the corn tortillas into thin strips. Fry them in most of the oil over medium-high heat for 2 minutes, until crisp. Drain and salt lightly.",
  "Chop the onion, garlic and jalapeno. Heat the rest of the oil in a pot over medium heat and fry them for 6 minutes, until soft. Add the cumin powder for 30 seconds.",
  "Add the canned tomatoes and cook for 5 minutes. Blend with a little of the chicken stock until smooth and return to the pot.",
  "Add the rest of the chicken stock and the chicken. Simmer for 15 to 18 minutes, until the chicken is cooked through. Lift it out and shred it.",
  "Return the chicken, stir in the lime juice and season with salt.",
  "Dice the avocado. Taste the soup and adjust.",
  "Ladle into bowls and top with the tortilla strips, avocado, sour cream and coriander leaves. Serve hot.",
]

[[recipe]]
id = "01a18c16-b1e5-70a7-884d-0d74f1dec8e1"
name = "Pozole"
serves = 6
prep_minutes = 20
cook_minutes = 120
ingredients = [
  { id = "pork", amount = 1, unit = "kg" },
  { id = "hominy", amount = 2, unit = "can" },
  { id = "dried-red-chillies", amount = 6, unit = "piece" },
  { id = "onion", amount = 1, unit = "large" },
  { id = "garlic", amount = 5, unit = "clove" },
  { id = "dried-oregano", amount = 1, unit = "tsp" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "cabbage", amount = 2, unit = "cup" },
  { id = "radish", amount = 150, unit = "g" },
  { id = "lime", amount = 2, unit = "medium" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 10, unit = "cup" },
]
steps = [
  "Use pork shoulder and cut it into chunks about 5 cm across. Put it in a pot with half the onion, half the garlic left whole, salt and most of the water.",
  "Bring to a boil, skim, then simmer on low heat for 1 and a half hours, until the pork is tender.",
  "Meanwhile, toast the dried red chillies in a dry pan for 1 minute. Soak them in the rest of the water, hot, for 15 minutes, then blend with the rest of the garlic, the dried oregano and cumin powder until smooth.",
  "Strain the chilli paste into the pot and add the drained hominy. Simmer for 25 to 30 minutes, until the broth is red and flavourful.",
  "Lift out the pork, shred it into large pieces and return it. Season with salt.",
  "Shred the cabbage finely, slice the radish thinly and finely chop the rest of the onion.",
  "Taste and adjust. Serve in deep bowls with the cabbage, radish, onion and lime wedges at the table.",
]

[[recipe]]
id = "01a18c16-b1e7-7713-875c-4155c7f744eb"
name = "Arroz con pollo"
serves = 4
prep_minutes = 15
cook_minutes = 50
ingredients = [
  { id = "chicken", amount = 1, unit = "kg" },
  { id = "rice", amount = 1.5, unit = "cup" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "bell-pepper", amount = 1, unit = "medium" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "passata", amount = 0.5, unit = "cup" },
  { id = "chicken-stock", amount = 3, unit = "cup" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "paprika", amount = 1, unit = "tsp" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
