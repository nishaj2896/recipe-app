  "Spread a thin layer of mayonnaise over each cob.",
  "Roll the cobs in the finely crumbled feta and dust with the red chilli powder.",
  "Taste and add a squeeze of lime. Scatter the chopped coriander leaves over and serve hot with the rest of the lime cut into wedges.",
