  "Poach the chicken in the chicken stock in a covered pan over low heat for 15 to 18 minutes, until cooked through. Lift it out, shred it with forks and keep the stock.",
  "Chop the onion and garlic. Heat half the oil in a pan over medium heat and fry the onion for 6 minutes, until soft, then the garlic for 1 minute.",
