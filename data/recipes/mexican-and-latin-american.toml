  "Use very fresh, skinless cod. Cut it into cubes about 1.5 cm across and keep it cold.",
  "Slice the onion paper-thin, rinse under the cold tap and drain. Finely chop the jalapeno.",
  "Toss the cod with salt, then pour over enough lime juice to cover. Add the onion and jalapeno.",
