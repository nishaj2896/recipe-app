steps = [
  "Bring the water, butter, a spoonful of the sugar and a little salt to a boil in a pan.",
  "Take it off the heat, add the all-purpose flour all at once and beat with a wooden spoon for 1 minute, until a smooth ball forms. Cool for 5 minutes, then beat in the egg until glossy.",
  "Spoon the dough into a piping bag fitted with a large star nozzle.",
