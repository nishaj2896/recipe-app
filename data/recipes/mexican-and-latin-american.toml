[[recipe]]
id = "01a18c16-b1bc-7bbc-91a7-36928f0fe539"
name = "Chicken tacos"
serves = 4
prep_minutes = 20
cook_minutes = 15
ingredients = [
  { id = "chicken", amount = 600, unit = "g" },
  { id = "corn-tortillas", amount = 12, unit = "piece" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "smoked-paprika", amount = 1, unit = "tsp" },
  { id = "red-chilli-powder", amount = 0.5, unit = "tsp" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "lime", amount = 2, unit = "medium" },
  { id = "olive-oil", amount = 2, unit = "tbsp" },
  { id = "onion", amount = 0.5, unit = "medium" },
  { id = "coriander-leaves", amount = 0.5, unit = "cup" },
  { id = "avocado", amount = 2, unit = "medium" },
  { id = "sour-cream", amount = 0.5, unit = "cup" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use boneless chicken thighs. Grate the garlic and mix it with the cumin powder, smoked paprika, red chilli powder, the juice of one of the limes, half the olive oil and salt. Toss the chicken in it and leave for 20 minutes.",
