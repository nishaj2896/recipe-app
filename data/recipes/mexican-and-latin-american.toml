steps = [
  "Rinse the rice and drain well. Blend the tomatoes, onion and garlic until smooth. Dice the carrot small.",
  "Heat the oil in a wide pan over medium heat. Fry the rice for 5 to 6 minutes, stirring, until the grains turn opaque and golden in places.",
  "Pour in the tomato mixture and cumin powder and stir for 2 minutes, until most of the liquid is absorbed.",
  "Add the chicken stock, carrot and salt. Bring to a boil, then cover and cook on the lowest heat for 15 minutes.",
