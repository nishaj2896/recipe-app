[[recipe]]
id = "01a18c16-b1ec-76ee-b4de-eb918ca0f587"
name = "Empanadas"
serves = 6
prep_minutes = 40
cook_minutes = 45
ingredients = [
  { id = "all-purpose-flour", amount = 2.5, unit = "cup" },
  { id = "butter", amount = 0.5, unit = "cup" },
  { id = "beef-mince", amount = 400, unit = "g" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "bell-pepper", amount = 1, unit = "small" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "paprika", amount = 1, unit = "tsp" },
  { id = "olives", amount = 0.25, unit = "cup" },
  { id = "raisins", amount = 2, unit = "tbsp" },
  { id = "egg", amount = 1, unit = "large" },
  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Rub the cold diced butter into the all-purpose flour and a little salt until it looks like coarse sand. Stir in the cold water and press into a dough. Wrap and chill for 30 minutes.",
  "Finely chop the onion, bell pepper and garlic and chop the olives. Heat the oil in a pan over medium heat and fry the onion and bell pepper for 6 minutes, until soft.",
  "Add the beef mince and garlic and cook for 6 to 8 minutes, breaking it up, until browned. Stir in the cumin powder and paprika for 1 minute.",
  "Stir in the olives and raisins and season with salt. Taste the filling, adjust, and leave to cool.",
  "Heat the oven to 200°C. Roll the dough out about 3 mm thick and cut rounds about 12 cm across.",
  "Put a spoonful of filling on each round, wet the edges, fold over and press to seal. Crimp the edges with a fork.",
  "Lay them on a lined tray, brush with the beaten egg and bake for 20 to 25 minutes, until deep golden. Serve warm.",
]

[[recipe]]
id = "01a18c16-b1ee-7a20-bdbe-2d2099505519"
name = "Arepas"
serves = 4
prep_minutes = 15
cook_minutes = 20
ingredients = [
  { id = "precooked-cornmeal", amount = 2, unit = "cup" },
  { id = "black-beans", amount = 1, unit = "can" },
  { id = "mozzarella", amount = 1, unit = "cup" },
  { id = "avocado", amount = 1, unit = "large" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 2.5, unit = "cup" },
]
steps = [
  "Stir a little salt into the warm water. Gradually mix in the precooked cornmeal and knead for 2 minutes into a soft dough that doesn't crack at the edges. Rest for 5 minutes.",
  "Divide the dough into balls about 6 cm across and flatten each into a disc about 1.5 cm thick, smoothing any cracks with wet hands.",
  "Heat a little of the oil in a heavy frying pan over medium heat. Cook the arepas for 5 to 6 minutes a side, until a crust forms and they sound hollow when tapped.",
  "Meanwhile, warm the drained black beans in a small pan with the rest of the oil and a little salt, mashing a few. Grate the mozzarella and slice the avocado.",
  "Split each arepa open with a knife while hot, leaving a hinge.",
  "Fill with the beans, mozzarella and avocado. Taste a little filling for salt and serve hot.",
]

[[recipe]]
id = "01a18c16-b1f0-7193-a3c6-cca15f0397f5"
