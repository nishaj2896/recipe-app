[[recipe]]
id = "01a18c16-b1f5-73bb-948e-00616bf14b39"
name = "Tres leches cake"
serves = 10
prep_minutes = 20
cook_minutes = 35
plan_ahead = { wait_minutes = 240, note = "chill for 4 hours" }
ingredients = [
  { id = "all-purpose-flour", amount = 1, unit = "cup" },
  { id = "baking-powder", amount = 1.5, unit = "tsp" },
  { id = "egg", amount = 5, unit = "large" },
  { id = "sugar", amount = 0.75, unit = "cup" },
  { id = "milk", amount = 1, unit = "cup" },
  { id = "vanilla-extract", amount = 2, unit = "tsp" },
  { id = "condensed-milk", amount = 1, unit = "can" },
  { id = "evaporated-milk", amount = 1, unit = "can" },
  { id = "whipping-cream", amount = 1.5, unit = "cup" },
  { id = "ground-cinnamon", amount = 0.25, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Heat the oven to 180°C and grease a baking dish about 23 by 33 cm.",
  "Whisk the all-purpose flour, baking powder and a little salt together.",
  "Whisk the eggs with the sugar for 5 to 6 minutes, until pale and thick. Fold in a quarter of the milk and half the vanilla extract, then fold in the flour gently.",
  "Pour into the dish and bake for 25 to 30 minutes, until golden and a skewer comes out clean. Cool for 15 minutes, then prick all over with a fork.",
  "Whisk the condensed milk, evaporated milk, the rest of the milk and a third of the whipping cream. Pour slowly over the cake until it is all absorbed. Chill for at least 4 hours.",
  "Whip the rest of the whipping cream with the rest of the vanilla extract to soft peaks and spread it over the cake.",
  "Taste and dust with the ground cinnamon. Serve cold, cut into squares.",
]
