steps = [
  "Use bone-in chicken thighs. Season them with the cumin powder, paprika and salt.",
  "Heat the olive oil in a wide heavy pan over medium-high heat. Brown the chicken skin side down for 6 to 8 minutes, then turn for 2 minutes. Lift it out.",
