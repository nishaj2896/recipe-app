  "Mix the potatoes, paneer, cornflour and salt into a smooth dough. Chop half the cashews with the raisins.",
  "Divide the dough into 12 balls. Flatten each, put a little of the cashew and raisin mix in the centre, close it up and roll it into a smooth ball with no cracks.",
  "Heat the oil for deep frying over medium heat. Fry a test kofta first; if it breaks, mix a little more cornflour into the dough.",
  "Fry the koftas a few at a time for 3 to 4 minutes, turning gently, until golden brown all over. Drain on paper.",
  "Roughly chop the onions and tomatoes. Simmer them with the rest of the cashews and the water for 10 minutes, then blend to a smooth sauce.",
  "Melt the butter in a pan over medium heat. Add the ginger garlic paste and stir for 1 minute, until the raw smell goes.",
  "Lower the heat, add the Kashmiri chilli powder and coriander powder, then the sauce, sugar and salt. Simmer for 8 minutes, until thick and butter glistens on top.",
  "Stir in the cream and garam masala and simmer for 1 minute. Taste for salt.",
  "Put the koftas in a serving dish and pour the sauce over while it is piping hot, just before serving, so they stay soft but don't fall apart.",
]

