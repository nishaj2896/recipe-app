[[recipe]]
id = "01a15175-3c00-74aa-990d-9f9791e9d729"
name = "Aloo matar"
serves = 4
prep_minutes = 15
cook_minutes = 25
ingredients = [
  { id = "potato", amount = 3, unit = "medium" },
  { id = "peas", amount = 1, unit = "cup" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "salt", to_taste = true },
  { id = "ghee", amount = 2, unit = "tbsp" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "water", amount = 1.5, unit = "cup" },
]
steps = [
  "Peel the potato and cut it into 2 cm cubes. Finely chop the onion, tomato and green chillies.",
  "Heat the ghee in a heavy pan over medium heat and add the cumin seeds. When they sizzle, add the onion and cook for 6 to 8 minutes until golden.",
  "Add the green chillies, tomato, turmeric and salt. Cook for 5 minutes, pressing the tomato down, until it turns soft and the ghee shines at the edges.",
  "Stir in the potato and the peas so they are coated in the masala, then pour in the water.",
  "Cover and simmer for 15 minutes, until the potato is tender and the gravy has thickened slightly. Taste for salt.",
  "Finish with the coriander leaves and serve hot with roti.",
]

[[recipe]]
