[[recipe]]
id = "01a15175-3c07-7f8f-85c3-388e5af7e04a"
name = "Dal tadka"
serves = 4
prep_minutes = 10
cook_minutes = 30
ingredients = [
  { id = "toor-dal", amount = 200, unit = "g" },
  { id = "tomato", amount = 1, unit = "medium" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
