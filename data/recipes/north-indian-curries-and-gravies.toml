  "Finely chop the green chillies and grate the ginger. Mix them with the bottle gourd, gram flour and salt into a thick mixture that holds its shape.",
  "Heat the oil for deep frying over medium heat. Shape the mixture into small balls with wet hands.",
  "Fry the koftas a few at a time for 4 to 5 minutes, turning, until deep golden and firm. Drain on paper.",
  "Finely chop the onions and purée the tomatoes.",
  "Heat a little of the frying oil in a pan over medium heat. Add the cumin seeds and let them sizzle for 20 seconds.",
