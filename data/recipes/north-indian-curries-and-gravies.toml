[[recipe]]
id = "01a15175-3c00-74aa-990d-9f9791e9d729"
name = "Aloo matar"
serves = 4
prep_minutes = 15
cook_minutes = 25
ingredients = [
  { id = "potato", amount = 3, unit = "medium" },
  { id = "peas", amount = 1, unit = "cup" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "salt", to_taste = true },
  { id = "ghee", amount = 2, unit = "tbsp" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "water", amount = 1.5, unit = "cup" },
]
steps = [
  "Peel the potatoes and cut them into 2 cm cubes. Keep them in a bowl of the water so they don't brown.",
  "Finely chop the onion and tomato, and slit the green chillies lengthways.",
  "Heat the ghee in a heavy pan over medium heat. Add the cumin seeds and wait until they sizzle and turn a shade darker, about 30 seconds.",
  "Add the onion and cook for 6 to 8 minutes, stirring now and then, until it turns golden.",
  "Add the green chillies, tomato, turmeric and salt. Cook for 5 minutes, pressing the tomato with the spoon, until it is soft and the ghee shines at the edges of the masala.",
  "Drain the potatoes, reserving their water. Add the potatoes and peas and stir for 2 minutes so they are coated in the masala.",
  "Pour in the reserved water and bring to a boil. Cover, lower the heat and simmer for 15 minutes, until a knife slides easily through a potato cube.",
  "Mash a few potato cubes against the side of the pan to thicken the gravy. Taste and adjust the salt.",
  "Turn off the heat, scatter the coriander leaves over and serve hot with roti.",
]

[[recipe]]
id = "01a15175-3c02-76b4-b315-57189e41c2d0"
name = "Aloo gobi"
serves = 4
prep_minutes = 15
cook_minutes = 25
ingredients = [
  { id = "potato", amount = 2, unit = "medium" },
  { id = "cauliflower", amount = 1, unit = "small-head" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "ginger", amount = 10, unit = "g" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "coriander-powder", amount = 1, unit = "tsp" },
  { id = "garam-masala", amount = 0.5, unit = "tsp" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
]
steps = [
  "Cut the cauliflower into small florets and the potatoes into 2 cm cubes. Rinse both and drain them well.",
  "Finely chop the onion and tomato, and grate the ginger.",
  "Heat the oil in a wide pan over medium heat. Add the onion and cook for 5 minutes, until soft and lightly golden.",
  "Add the ginger and stir for 1 minute, until its raw smell is gone.",
  "Add the turmeric and coriander powder and stir for 30 seconds, then add the tomato and salt. Cook for 4 minutes, until the tomato turns soft and mushy.",
  "Add the potatoes and cauliflower and toss until every piece is coated in the masala.",
  "Cover and cook on low heat for 15 to 18 minutes, stirring gently every 5 minutes, until a knife goes easily through both. Keep the lid on and the pan dry so the vegetables roast rather than steam.",
  "Sprinkle over the garam masala and cook uncovered for 2 minutes, until the edges of the florets turn golden.",
  "Taste and adjust the salt, scatter the coriander leaves over and serve hot.",
]

[[recipe]]
id = "01a15175-3c03-7619-8dad-e95a1c70ce7c"
name = "Bhindi masala"
serves = 4
prep_minutes = 15
cook_minutes = 20
ingredients = [
  { id = "okra", amount = 400, unit = "g" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "tomato", amount = 1, unit = "medium" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "red-chilli-powder", amount = 1, unit = "tsp" },
  { id = "coriander-powder", amount = 1, unit = "tsp" },
  { id = "dry-mango-powder", amount = 0.5, unit = "tsp" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Wash the okra and dry every piece completely with a cloth. Any moisture makes it slimy.",
  "Trim off the tops and tips and cut the okra into 2 cm lengths. Thinly slice the onions and chop the tomato.",
  "Heat the oil in a wide pan over medium-high heat. Add the okra in a single layer and fry for 8 to 10 minutes, turning gently, until it is no longer sticky and its edges brown. Lift it out with a slotted spoon.",
  "In the same pan, cook the onions over medium heat for 5 to 6 minutes, until golden.",
  "Add the turmeric, red chilli powder, coriander powder and salt and stir for 30 seconds, until fragrant.",
  "Add the tomato and cook for 3 to 4 minutes, until it breaks down and the oil glistens at the edges of the masala.",
  "Return the okra to the pan and toss gently for 3 minutes, until it is coated and heated through.",
  "Sprinkle over the dry mango powder, toss once more, taste for salt and serve hot with roti.",
]

[[recipe]]
id = "01a15175-3c04-77e6-a1ae-16fb9ffe2211"
name = "Palak paneer"
serves = 4
prep_minutes = 15
cook_minutes = 25
ingredients = [
  { id = "paneer", amount = 250, unit = "g" },
  { id = "spinach", amount = 1, unit = "bunch" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "tomato", amount = 1, unit = "medium" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "ginger", amount = 10, unit = "g" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "cream", amount = 2, unit = "tbsp" },
  { id = "garam-masala", amount = 0.5, unit = "tsp" },
  { id = "ghee", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "l" },
]
steps = [
  "Pick the spinach leaves off the thick stems and wash them well in several changes of the water to remove any grit.",
  "Bring the rest of the water to a boil, add the spinach and blanch it for 2 minutes, until it wilts and turns bright green.",
  "Drain the spinach and plunge it straight into cold water to keep its colour. Squeeze lightly and blend it with the green chillies to a smooth purée.",
  "Cut the paneer into 2 cm cubes. Finely chop the onion, tomato and garlic, and grate the ginger.",
  "Heat the ghee in a pan over medium heat. Add the onion and cook for 5 minutes, until soft and light golden.",
  "Add the garlic and ginger and stir for 1 minute, until the raw smell is gone.",
  "Add the tomato and salt and cook for 4 minutes, until the tomato is soft and mushy.",
  "Stir in the spinach purée and simmer for 5 minutes, stirring now and then. Don't cook it longer, or it turns dull green.",
  "Add the paneer and garam masala and simmer for 2 to 3 minutes, until the paneer is warmed through.",
  "Take the pan off the heat, swirl in the cream, taste for salt and serve hot.",
]

