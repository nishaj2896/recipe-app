  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "water", amount = 750, unit = "ml" },
]
steps = [
  "Rinse the toor dal in several changes of the water until it runs clear. Chop the tomato.",
  "Put the dal in a pressure cooker with the rest of the water, the turmeric and the tomato. Cook for 3 whistles, then let the pressure drop on its own.",
  "Open the cooker and whisk the dal until smooth. Add salt and simmer for 5 minutes on low heat, stirring; add a splash of hot water if it is thicker than you like.",
  "Thinly slice the garlic and finely chop the onion.",
