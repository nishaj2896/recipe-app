[[recipe]]
id = "01a188a8-fe9b-7064-9d21-396b09a70f61"
name = "Kadhi pakora"
serves = 4
prep_minutes = 15
cook_minutes = 45
ingredients = [
  { id = "curd", amount = 2, unit = "cup" },
  { id = "gram-flour", amount = 0.75, unit = "cup" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "red-chilli-powder", amount = 1, unit = "tsp" },
  { id = "carom-seeds", amount = 0.25, unit = "tsp" },
  { id = "baking-soda", amount = 1, unit = "pinch" },
  { id = "fenugreek-seeds", amount = 0.5, unit = "tsp" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "mustard-seeds", amount = 0.5, unit = "tsp" },
  { id = "dried-red-chillies", amount = 2, unit = "piece" },
  { id = "asafoetida", amount = 1, unit = "pinch" },
  { id = "curry-leaves", amount = 10, unit = "leaf" },
  { id = "ginger", amount = 10, unit = "g" },
  { id = "ghee", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 2, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 4, unit = "cup" },
]
steps = [
  "Whisk the sour curd with a third of the gram flour, the turmeric, half the red chilli powder, salt and most of the water until completely smooth, with no lumps.",
  "Pour it into a deep pan and bring it to a boil over medium heat, stirring constantly so it doesn't split.",
  "Lower the heat and simmer for 30 minutes, stirring every few minutes, until the kadhi thickens enough to coat the back of a spoon.",
  "Meanwhile, thinly slice the onion. Mix it with the rest of the gram flour, the carom seeds, baking soda, salt and the rest of the water into a thick batter.",
  "Heat the oil for deep frying over medium heat. Drop in spoonfuls of the batter and fry for 4 minutes, turning, until golden and cooked inside. Drain on paper.",
  "Add the pakoras to the kadhi and simmer for 5 minutes, so they soak it up.",
  "For the tadka, heat the ghee in a small pan. Add the fenugreek seeds, cumin seeds and mustard seeds and let them crackle for 20 seconds.",
  "Add the dried red chillies, asafoetida, curry leaves, grated ginger and the rest of the red chilli powder, stir for 10 seconds and pour over the kadhi.",
  "Taste for salt and serve hot.",
]

[[recipe]]
