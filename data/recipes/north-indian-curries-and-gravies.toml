  "Add the onions and cook for 8 minutes, until golden. Add the ginger garlic paste and green chillies and stir for 1 minute.",
  "Add the tomatoes, the rest of the turmeric, the red chilli powder, coriander powder and salt. Cook for 6 minutes, until the masala thickens and the fat separates.",
  "Pour in the water, bring to a boil and simmer for 8 minutes.",
