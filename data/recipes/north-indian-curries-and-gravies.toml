[[recipe]]
id = "01a15175-3c0d-724d-8163-07a8da4afdd6"
name = "Baingan bharta"
serves = 4
prep_minutes = 10
cook_minutes = 35
ingredients = [
  { id = "brinjal", amount = 1, unit = "large" },
