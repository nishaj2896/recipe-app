steps = [
  "Rub the brinjal with a few drops of the oil and prick it in a few places with a fork.",
  "Roast it directly over a gas flame or under a very hot grill for 12 to 15 minutes, turning every few minutes, until the skin is charred all over and the brinjal collapses when pressed.",
  "Put it in a bowl, cover and let it cool for 10 minutes. Peel off the charred skin and mash the flesh roughly with a fork.",
  "Finely chop the onion, garlic, green chillies and tomatoes.",
  "Heat the rest of the oil in a pan over medium heat. Add the onion, garlic and green chillies and cook for 5 minutes, until soft and light golden.",
  "Add the tomatoes and salt and cook for 4 minutes, until soft and mushy.",
