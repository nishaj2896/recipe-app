  "Grind everything with as much of the water as needed to a smooth, thick batter. Stir in salt and leave in a warm place overnight, until risen and bubbly.",
  "Boil the potatoes in their skins for 15 to 20 minutes, until tender. Peel and crumble them. Thinly slice the onions and slit the green chillies.",
  "Heat the oil in a pan over medium heat. Fry the mustard seeds until they pop, then the curry leaves, green chillies and onions for 5 minutes, until soft. Add the turmeric, potatoes, salt and a splash of the water and mix well.",
