  "Heat a griddle over medium-high heat. Pour a ladle of batter in the middle and spread it in circles into a thin round about 22 cm across. Drizzle ghee round the edge.",
  "When the underside is golden, after 2 to 3 minutes, spread a thin layer of the red paste over and put a spoonful of potato filling in the middle.",
  "Fold the dosa over and serve hot with chutney. Repeat with the rest of the batter.",
]

