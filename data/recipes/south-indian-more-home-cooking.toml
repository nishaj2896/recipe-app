[[recipe]]
id = "01a18bb1-05ba-7a1d-a500-a643e4a781db"
name = "Kozhi varutha curry"
serves = 4
prep_minutes = 15
cook_minutes = 45
ingredients = [
  { id = "chicken", amount = 750, unit = "g" },
  { id = "coconut", amount = 1, unit = "cup" },
  { id = "shallot", amount = 10, unit = "piece" },
  { id = "tomato", amount = 1, unit = "medium" },
  { id = "ginger-garlic-paste", amount = 1, unit = "tbsp" },
  { id = "coriander-seeds", amount = 2, unit = "tbsp" },
  { id = "dried-red-chillies", amount = 6, unit = "piece" },
  { id = "fennel-seeds", amount = 1, unit = "tsp" },
  { id = "black-pepper", amount = 1, unit = "tsp" },
  { id = "cinnamon-sticks", amount = 1, unit = "piece" },
  { id = "cloves", amount = 3, unit = "piece" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "curry-leaves", amount = 2, unit = "sprig" },
  { id = "coconut-oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1.5, unit = "cup" },
]
steps = [
  "Cut the chicken into pieces. Slice the shallots and chop the tomato.",
  "Dry-roast the coconut in a heavy pan over medium-low heat for 8 to 10 minutes, stirring constantly, until deep brown and fragrant.",
  "Add the coriander seeds, dried red chillies, fennel seeds, black pepper, cinnamon and cloves and roast for 2 minutes. Cool, then grind to a smooth paste with a little of the water.",
  "Heat the coconut oil in a heavy pan over medium heat. Fry half the curry leaves for a few seconds, then the shallots for 6 minutes, until golden.",
  "Add the ginger garlic paste and fry for 1 minute, then the tomato and turmeric and cook for 3 minutes, until soft.",
  "Add the chicken and salt and fry for 5 minutes. Add the coconut paste and the rest of the water, cover and simmer for 18 to 20 minutes, until the chicken is cooked through and the gravy is thick and dark.",
  "Scatter the rest of the curry leaves over, taste for salt and serve hot with appam.",
]

[[recipe]]
id = "01a18bb1-05bc-726c-a26b-6de1ffd7076c"
name = "Kerala beef fry"
serves = 4
prep_minutes = 15
cook_minutes = 85
ingredients = [
  { id = "beef", amount = 750, unit = "g" },
  { id = "coconut", amount = 0.5, unit = "cup" },
  { id = "shallot", amount = 12, unit = "piece" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "garlic", amount = 8, unit = "clove" },
  { id = "green-chillies", amount = 3, unit = "piece" },
  { id = "curry-leaves", amount = 3, unit = "sprig" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "kashmiri-chilli-powder", amount = 2, unit = "tsp" },
  { id = "coriander-powder", amount = 2, unit = "tbsp" },
  { id = "black-pepper", amount = 1.5, unit = "tsp" },
  { id = "fennel-seeds", amount = 1, unit = "tsp" },
  { id = "garam-masala", amount = 1, unit = "tsp" },
  { id = "coconut-oil", amount = 0.25, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1.5, unit = "cup" },
]
steps = [
  "Cut the beef into cubes about 2 cm across. Thinly slice the shallots, ginger and garlic, slit the green chillies and cut the coconut into thin slivers about 1 cm long.",
  "Toss the beef with the turmeric, Kashmiri chilli powder, half the coriander powder, half the black pepper and salt.",
  "Simmer the beef with half the ginger and garlic and the water in a covered heavy pan over low heat for 50 to 60 minutes, until tender and nearly dry.",
  "Heat the coconut oil in a wide heavy pan over medium heat. Fry the coconut slivers for 3 minutes, until golden brown.",
  "Add the shallots, the rest of the ginger and garlic, the green chillies and most of the curry leaves and fry for 6 minutes, until the shallots are golden.",
  "Add the beef with any juices and the fennel seeds, the rest of the coriander powder and black pepper, and the garam masala. Fry on medium heat for 12 to 15 minutes, stirring often, until the beef is dark brown, dry and crisp at the edges.",
  "Scatter the rest of the curry leaves over, taste for salt and serve hot with parotta.",
]

