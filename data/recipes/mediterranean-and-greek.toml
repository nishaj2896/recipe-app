[[recipe]]
id = "01a18c1a-e235-71c2-b9fb-57ad32eb3d58"
name = "Briam"
serves = 6
prep_minutes = 25
cook_minutes = 75
ingredients = [
  { id = "potato", amount = 3, unit = "medium" },
  { id = "zucchini", amount = 2, unit = "medium" },
  { id = "brinjal", amount = 1, unit = "large" },
  { id = "bell-pepper", amount = 2, unit = "medium" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "tomato", amount = 4, unit = "medium" },
  { id = "dried-oregano", amount = 1, unit = "tsp" },
  { id = "parsley", amount = 0.33, unit = "cup" },
