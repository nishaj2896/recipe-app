[[recipe]]
id = "01a18c1a-e245-7f15-8b1f-0aedd856d372"
name = "Ratatouille"
serves = 6
prep_minutes = 25
cook_minutes = 60
ingredients = [
  { id = "brinjal", amount = 1, unit = "large" },
  { id = "zucchini", amount = 2, unit = "medium" },
  { id = "bell-pepper", amount = 2, unit = "medium" },
  { id = "onion", amount = 1, unit = "large" },
  { id = "tomato", amount = 5, unit = "medium" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "thyme", amount = 4, unit = "sprig" },
  { id = "basil", amount = 0.33, unit = "cup" },
  { id = "olive-oil", amount = 0.33, unit = "cup" },
  { id = "salt", to_taste = true },
]
steps = [
  "Cut the aubergine, zucchini and bell peppers into cubes about 2 cm across. Chop the onion, slice the garlic and chop the tomatoes.",
  "Heat a little of the olive oil in a large heavy pan over medium-high heat. Fry the aubergine for 6 to 8 minutes, until golden. Lift it out. Do the same with the zucchini for 4 to 5 minutes, then the bell peppers for 5 minutes.",
  "Lower the heat to medium. Add the rest of the olive oil and fry the onion for 8 minutes, until soft, then the garlic for 1 minute.",
  "Add the tomatoes and thyme and simmer for 10 minutes, until saucy.",
  "Return all the vegetables, season with salt, cover and simmer on low heat for 25 to 30 minutes, stirring gently now and then, until everything is soft but holding its shape.",
  "Taste and adjust. Pick out the thyme stalks, tear the basil over and serve warm or at room temperature.",
]

[[recipe]]
id = "01a18c1a-e247-73ff-8449-dbce5a6efaca"
name = "Pan bagnat"
serves = 4
prep_minutes = 25
cook_minutes = 10
plan_ahead = { wait_minutes = 60, note = "press for 1 hour" }
ingredients = [
  { id = "baguette", amount = 1, unit = "large" },
  { id = "canned-tuna", amount = 2, unit = "can" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "onion", amount = 0.5, unit = "small" },
  { id = "roasted-red-peppers", amount = 0.5, unit = "cup" },
  { id = "olives", amount = 0.25, unit = "cup" },
  { id = "anchovies", amount = 6, unit = "piece" },
  { id = "basil", amount = 0.25, unit = "cup" },
  { id = "extra-virgin-olive-oil", amount = 0.25, unit = "cup" },
  { id = "red-wine-vinegar", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1.5, unit = "l" },
]
steps = [
  "Hard-boil the eggs in the water, boiling, for 9 minutes, cool and slice.",
  "Slice the tomatoes and onion thinly, cut the roasted red peppers into strips and chop the olives. Drain the canned tuna.",
  "Split the baguette lengthwise and pull out some of the soft crumb.",
