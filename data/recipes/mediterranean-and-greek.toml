  "Turn the heat up for the last 1 to 2 minutes until you hear crackling and smell toasting, so a crust forms on the base.",
  "Rest off the heat, covered with a cloth, for 5 minutes. Taste, scatter the chopped parsley over and serve with the lemon cut into wedges.",
]

