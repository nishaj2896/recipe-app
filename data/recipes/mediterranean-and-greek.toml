[[recipe]]
id = "01a18c1a-e237-7e9e-8a9e-8419d18ce300"
name = "Spanish tortilla"
serves = 4
prep_minutes = 15
cook_minutes = 40
ingredients = [
  { id = "potato", amount = 750, unit = "g" },
  { id = "onion", amount = 1, unit = "large" },
  { id = "egg", amount = 6, unit = "large" },
  { id = "olive-oil", amount = 1, unit = "cup" },
  { id = "salt", to_taste = true },
]
steps = [
  "Peel the potatoes and slice them thinly, about 3 mm. Slice the onion thinly.",
  "Heat the olive oil in a deep frying pan about 24 cm across over medium-low heat. Add the potatoes and onion and cook gently for 20 to 25 minutes, turning now and then, until soft but not browned.",
  "Drain them in a sieve over a bowl, keeping the olive oil.",
  "Beat the eggs with salt in a large bowl. Stir in the warm potatoes and onion and leave for 10 minutes.",
  "Heat a spoonful of the kept olive oil in the pan over medium heat. Pour in the mixture and cook for 5 to 6 minutes, shaking the pan, until the base is set and golden.",
  "Put a large plate over the pan and flip the tortilla onto it. Slide it back in and cook for 3 to 4 minutes, until just set in the middle.",
  "Taste for salt. Slide onto a plate, rest for 10 minutes and serve warm or at room temperature.",
]

[[recipe]]
id = "01a18c1a-e23a-7163-812e-7d217736420a"
name = "Paella"
serves = 6
prep_minutes = 20
cook_minutes = 45
ingredients = [
  { id = "bomba-rice", amount = 2, unit = "cup" },
  { id = "chicken", amount = 500, unit = "g" },
  { id = "prawns", amount = 300, unit = "g" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "bell-pepper", amount = 1, unit = "medium" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "smoked-paprika", amount = 1, unit = "tsp" },
  { id = "saffron", amount = 1, unit = "pinch" },
  { id = "chicken-stock", amount = 5, unit = "cup" },
  { id = "peas", amount = 0.5, unit = "cup" },
  { id = "lemon", amount = 1, unit = "medium" },
  { id = "olive-oil", amount = 0.25, unit = "cup" },
  { id = "parsley", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use boneless chicken thighs and cut them into pieces about 4 cm across. Season with salt. Peel and devein the prawns, leaving the tails on.",
  "Chop the onion, bell pepper and garlic. Grate the tomatoes and discard the skins. Warm the chicken stock with the saffron.",
  "Heat the olive oil in a paella pan or wide frying pan over medium-high heat. Brown the chicken for 6 to 8 minutes. Add the prawns for 2 minutes, until pink, then lift them out.",
  "Add the onion and bell pepper for 6 minutes, then the garlic for 1 minute. Stir in the grated tomatoes and smoked paprika and cook for 5 minutes, until jammy.",
  "Stir in the bomba rice for 1 minute, then pour in the hot stock and season with salt. Spread it evenly and do not stir again.",
