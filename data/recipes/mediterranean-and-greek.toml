[[recipe]]
id = "01a18c1a-e231-7ea1-ac8a-52453ef1bdf0"
name = "Avgolemono soup"
serves = 4
prep_minutes = 10
cook_minutes = 35
ingredients = [
  { id = "chicken-stock", amount = 6, unit = "cup" },
  { id = "chicken", amount = 300, unit = "g" },
  { id = "orzo", amount = 0.5, unit = "cup" },
  { id = "egg", amount = 3, unit = "large" },
  { id = "lemon", amount = 2, unit = "medium" },
  { id = "dill", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Bring the chicken stock to a simmer and poach the chicken in it for 15 to 18 minutes, until cooked through. Lift it out and shred it.",
  "Add the orzo to the stock and simmer for 8 to 10 minutes, until tender. Lower the heat so it stops simmering.",
  "Whisk the eggs in a bowl for 1 minute, until frothy, then whisk in the lemon juice.",
  "Slowly whisk 2 ladlefuls of the hot stock into the eggs, a little at a time, to warm them without scrambling.",
  "Pour the egg mixture back into the pot, stirring, and heat gently for 2 to 3 minutes, until it thickens slightly. Do not let it boil.",
  "Return the chicken and season with salt.",
  "Taste and add more lemon juice if needed. Scatter the chopped dill over and serve hot.",
]

