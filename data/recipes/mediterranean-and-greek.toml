  "Heat the oven to 220°C. Peel the potatoes and cut them into rough cubes about 3 cm across. Boil them in the water, salted, for 5 minutes and drain well, shaking to rough up the edges.",
  "Toss with most of the olive oil and salt on a tray. Roast for 30 to 35 minutes, turning once, until deep golden and crisp.",
  "For the bravas sauce, finely chop the onion and grate the garlic. Fry the onion in the rest of the olive oil over medium heat for 5 minutes, until soft. Add half the garlic for 1 minute.",
  "Stir in the smoked paprika, cayenne and all-purpose flour for 30 seconds. Add the tomato passata and simmer for 8 minutes, until thick. Blend smooth and season with salt.",
  "Stir the rest of the garlic into the mayonnaise for a quick aioli.",
  "Taste both sauces and adjust. Pile the potatoes on a plate, spoon the bravas sauce over and dot with the aioli. Serve hot.",
]

[[recipe]]
