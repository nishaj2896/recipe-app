[[recipe]]
id = "01a18c1a-e21f-7a45-9042-2fc871e11814"
name = "Greek salad"
serves = 4
prep_minutes = 15
cook_minutes = 0
image = { file = "01a18c1a-e21f-7a45-9042-2fc871e11814.webp", sha256 = "ca32efdd0aee3aae2e1c7fa16ba5c35ad65ce22611ebd3f520e09d9bce1e61a7", alt = "Greek salad with tomato, cucumber, olives and a slab of feta" }
ingredients = [
  { id = "tomato", amount = 4, unit = "medium" },
  { id = "cucumber", amount = 1, unit = "medium" },
  { id = "onion", amount = 0.5, unit = "medium" },
  { id = "bell-pepper", amount = 1, unit = "small" },
  { id = "olives", amount = 0.5, unit = "cup" },
  { id = "feta", amount = 200, unit = "g" },
  { id = "dried-oregano", amount = 1, unit = "tsp" },
  { id = "extra-virgin-olive-oil", amount = 0.25, unit = "cup" },
  { id = "red-wine-vinegar", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use ripe tomatoes and cut them into large wedges. Halve the cucumber lengthwise and cut it into thick half-moons.",
  "Slice the onion into thin rings and the green bell pepper into thin rounds.",
  "Put the tomatoes, cucumber, onion, bell pepper and olives in a wide bowl. Season with salt and toss gently.",
  "Drizzle the red wine vinegar and most of the extra-virgin olive oil over.",
  "Lay the feta on top in a single slab, sprinkle the dried oregano over and drizzle with the rest of the extra-virgin olive oil.",
  "Taste a tomato for salt and serve straight away.",
]

[[recipe]]
id = "01a18c1a-e223-7646-ba6f-355a95a97ae1"
name = "Moussaka"
serves = 8
prep_minutes = 45
cook_minutes = 90
ingredients = [
  { id = "brinjal", amount = 3, unit = "large" },
  { id = "lamb-mince", amount = 750, unit = "g" },
  { id = "onion", amount = 1, unit = "large" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "canned-tomatoes", amount = 1, unit = "can" },
  { id = "tomato-paste", amount = 2, unit = "tbsp" },
  { id = "red-wine", amount = 0.5, unit = "cup" },
  { id = "ground-cinnamon", amount = 0.5, unit = "tsp" },
  { id = "allspice", amount = 0.25, unit = "tsp" },
  { id = "dried-oregano", amount = 1, unit = "tsp" },
  { id = "olive-oil", amount = 0.5, unit = "cup" },
  { id = "butter", amount = 0.33, unit = "cup" },
  { id = "all-purpose-flour", amount = 0.33, unit = "cup" },
  { id = "milk", amount = 3, unit = "cup" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "nutmeg", amount = 0.25, unit = "tsp" },
  { id = "parmesan", amount = 0.75, unit = "cup" },
  { id = "salt", to_taste = true },
]
steps = [
  "Heat the oven to 220°C. Slice the aubergines into rounds about 1 cm thick, brush both sides with most of the olive oil and season with salt. Roast on trays for 20 to 25 minutes, turning once, until soft and golden.",
  "Chop the onion and garlic. Heat the rest of the olive oil in a pan over medium-high heat and brown the lamb mince for 6 to 8 minutes. Add the onion and garlic and cook for 5 minutes.",
  "Stir in the tomato paste, ground cinnamon, allspice and dried oregano for 1 minute. Add the red wine and let it bubble for 2 minutes.",
  "Add the canned tomatoes, season with salt and simmer on low heat for 25 to 30 minutes, until thick.",
  "For the sauce, melt the butter over medium heat, stir in the all-purpose flour for 2 minutes, then whisk in the milk gradually. Simmer for 5 minutes, stirring, until thick. Off the heat, whisk in the beaten eggs, the nutmeg, half the parmesan and salt.",
  "Lower the oven to 180°C. Layer half the aubergine in a deep baking dish, spread the lamb mince over, then the rest of the aubergine. Pour the sauce over and scatter the rest of the parmesan on top.",
  "Bake for 45 minutes, until deep golden. Rest for at least 20 minutes so it slices cleanly.",
  "Taste a corner and serve warm in squares.",
]

[[recipe]]
id = "01a18c1a-e225-7218-89eb-d75b3423a537"
name = "Spanakopita"
serves = 8
prep_minutes = 30
cook_minutes = 45
ingredients = [
  { id = "spinach", amount = 750, unit = "g" },
  { id = "feta", amount = 300, unit = "g" },
  { id = "ricotta", amount = 0.5, unit = "cup" },
  { id = "spring-onions", amount = 6, unit = "piece" },
  { id = "dill", amount = 0.5, unit = "cup" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "nutmeg", amount = 0.25, unit = "tsp" },
  { id = "filo-pastry", amount = 250, unit = "g" },
  { id = "olive-oil", amount = 0.33, unit = "cup" },
  { id = "butter", amount = 0.25, unit = "cup" },
  { id = "salt", to_taste = true },
]
steps = [
  "Wilt the spinach in batches in a dry pan over medium heat for 2 to 3 minutes. Cool, squeeze out every drop of liquid and chop it.",
  "Slice the spring onions and chop the dill. Mix them with the spinach, crumbled feta, ricotta, beaten eggs, nutmeg and a little salt.",
  "Heat the oven to 180°C. Melt the butter with the olive oil.",
  "Brush a baking dish about 23 by 33 cm with the butter mixture. Lay in half the filo pastry sheets, brushing each with the butter mixture.",
  "Spread the filling evenly, then cover with the rest of the filo, brushing each sheet. Tuck in the edges and brush the top well.",
  "Score the top into squares with a sharp knife. Bake for 40 to 45 minutes, until deep golden and crisp.",
  "Rest for 10 minutes, taste and serve warm or at room temperature.",
]

