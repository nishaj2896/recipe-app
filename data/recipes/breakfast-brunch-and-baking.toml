[[recipe]]
id = "01a18c20-05e6-7f6d-aac1-e2781a623997"
name = "Shortbread"
serves = 12
prep_minutes = 15
cook_minutes = 25
ingredients = [
  { id = "butter", amount = 1, unit = "cup" },
  { id = "sugar", amount = 0.5, unit = "cup" },
  { id = "all-purpose-flour", amount = 2, unit = "cup" },
  { id = "cornflour", amount = 0.25, unit = "cup" },
  { id = "salt", to_taste = true },
]
steps = [
  "Heat the oven to 160°C. Line a square tin about 20 cm across with baking paper.",
  "Beat the soft butter with most of the sugar for 2 minutes, until smooth.",
  "Sift in the all-purpose flour, cornflour and a little salt and mix until it just comes together into a soft dough.",
  "Press evenly into the tin and prick all over with a fork. Score into fingers.",
  "Bake for 22 to 25 minutes, until pale golden. Sprinkle with the rest of the sugar while hot.",
  "Cool in the tin for 10 minutes, cut along the scores and cool completely. Taste and serve.",
]

[[recipe]]
id = "01a18c20-05e8-76f5-9e83-2ff6f7cb10ea"
name = "Dinner rolls"
serves = 12
prep_minutes = 25
cook_minutes = 20
plan_ahead = { wait_minutes = 60, note = "let the dough rise for 1 hour" }
ingredients = [
  { id = "bread-flour", amount = 3.5, unit = "cup" },
  { id = "active-dry-yeast", amount = 2, unit = "tsp" },
  { id = "sugar", amount = 2, unit = "tbsp" },
  { id = "milk", amount = 1, unit = "cup" },
  { id = "butter", amount = 0.25, unit = "cup" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "salt", to_taste = true },
]
steps = [
  "Warm the milk to lukewarm and stir in the dry yeast and sugar. Leave for 5 minutes, until foamy.",
  "Melt most of the butter. Mix the bread flour and salt, add the yeast mixture, melted butter and one of the eggs, and knead for 10 minutes into a smooth, soft dough.",
  "Cover and leave for 1 hour, until doubled.",
  "Divide into 12 and roll each into a tight ball. Arrange them in a greased tin about 23 by 33 cm. Cover and leave for 40 minutes, until puffy. Heat the oven to 190°C.",
  "Brush with the other egg, beaten, and bake for 18 to 20 minutes, until deep golden and they sound hollow underneath.",
  "Brush with the rest of the butter, melted. Taste one and serve warm.",
]
