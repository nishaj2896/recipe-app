[[recipe]]
id = "01a15175-3c19-76f2-97d3-b9a4d1936e13"
name = "Pancakes"
serves = 4
prep_minutes = 10
cook_minutes = 15
image = { file = "01a15175-3c19-76f2-97d3-b9a4d1936e13.webp", sha256 = "c49571eee16d8cd867c51ac33f99292fd49c620e4ed26fa26363a0faf85caf89", alt = "Stack of pancakes with butter, maple syrup and berries" }
ingredients = [
  { id = "egg", amount = 1, unit = "piece" },
  { id = "all-purpose-flour", amount = 150, unit = "g" },
  { id = "milk", amount = 250, unit = "ml" },
  { id = "baking-powder", amount = 2, unit = "tsp" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "sugar", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Whisk the all-purpose flour, baking powder, sugar and salt together in a large bowl.",
  "Melt the butter and let it cool slightly.",
  "Beat the egg with the milk, then whisk in most of the melted butter, keeping the rest for the pan.",
  "Pour the wet mixture into the dry and whisk briefly, just until no dry flour shows. A few lumps are fine; overmixing makes tough pancakes. Rest the batter for 5 minutes.",
  "Heat a non-stick pan over medium heat and brush it lightly with the rest of the melted butter.",
  "Pour in a ladleful of batter. Cook for 2 minutes, until bubbles appear on top and the edges look set.",
  "Flip and cook for 1 more minute, until golden underneath. Repeat with the rest of the batter.",
  "Serve warm, stacked, with fruit or syrup.",
]

