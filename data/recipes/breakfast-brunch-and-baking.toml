  { id = "all-purpose-flour", amount = 1, unit = "cup" },
  { id = "butter", amount = 0.5, unit = "cup" },
  { id = "brown-sugar", amount = 0.75, unit = "cup" },
  { id = "egg", amount = 1, unit = "large" },
  { id = "baking-soda", amount = 0.5, unit = "tsp" },
  { id = "ground-cinnamon", amount = 1, unit = "tsp" },
