  { id = "cocoa-powder", amount = 0.75, unit = "cup" },
  { id = "sugar", amount = 1.5, unit = "cup" },
  { id = "baking-powder", amount = 1.5, unit = "tsp" },
  { id = "baking-soda", amount = 1.5, unit = "tsp" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "milk", amount = 1, unit = "cup" },
  { id = "oil", amount = 0.5, unit = "cup" },
  { id = "vanilla-extract", amount = 2, unit = "tsp" },
  { id = "instant-coffee", amount = 1, unit = "tsp" },
  { id = "dark-chocolate", amount = 200, unit = "g" },
  { id = "whipping-cream", amount = 1, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Heat the oven to 180°C. Grease and line 2 round tins about 20 cm across.",
  "Whisk the all-purpose flour, cocoa powder, sugar, baking powder, baking soda and a little salt.",
  "Whisk in the eggs, milk, oil and half the vanilla extract.",
  "Dissolve the instant coffee in the water, boiling, and whisk it in. The batter will be thin.",
  "Divide between the tins and bake for 30 to 35 minutes, until a skewer comes out clean. Cool completely.",
  "For the ganache, heat the double cream until steaming, pour it over the chopped dark chocolate with the rest of the vanilla extract and stir until smooth. Cool until spreadable.",
  "Sandwich the cakes with some of the ganache and spread the rest over the top and sides. Taste and serve.",
]

[[recipe]]
id = "01a18c20-05db-750e-be80-930048e7874c"
name = "Vanilla sponge cake"
serves = 10
prep_minutes = 20
cook_minutes = 25
ingredients = [
  { id = "butter", amount = 1, unit = "cup" },
  { id = "sugar", amount = 1, unit = "cup" },
  { id = "egg", amount = 4, unit = "large" },
  { id = "self-raising-flour", amount = 1.75, unit = "cup" },
  { id = "baking-powder", amount = 1, unit = "tsp" },
  { id = "vanilla-extract", amount = 2, unit = "tsp" },
  { id = "milk", amount = 2, unit = "tbsp" },
  { id = "jam", amount = 0.33, unit = "cup" },
  { id = "whipping-cream", amount = 1, unit = "cup" },
  { id = "icing-sugar", amount = 2, unit = "tbsp" },
]
steps = [
  "Heat the oven to 180°C. Grease and line 2 round tins about 20 cm across.",
  "Beat the soft butter and sugar for 4 to 5 minutes, until pale and fluffy.",
  "Beat in the eggs one at a time with half the vanilla extract.",
  "Fold in the self-raising flour and baking powder, then the milk, until smooth and dropping easily off a spoon.",
  "Divide between the tins and bake for 20 to 25 minutes, until golden and springy. Cool completely.",
  "Whip the double cream with the rest of the vanilla extract and half the icing sugar to soft peaks.",
  "Spread one cake with the jam and then the whipped double cream. Top with the other cake and dust with the rest of the icing sugar. Taste and serve.",
]

[[recipe]]
id = "01a18c20-05dd-7890-ba64-c4ec791c115f"
name = "Lemon drizzle cake"
serves = 10
prep_minutes = 15
cook_minutes = 45
ingredients = [
  { id = "butter", amount = 0.75, unit = "cup" },
  { id = "sugar", amount = 1.25, unit = "cup" },
  { id = "egg", amount = 3, unit = "large" },
  { id = "self-raising-flour", amount = 1.5, unit = "cup" },
  { id = "milk", amount = 3, unit = "tbsp" },
  { id = "lemon", amount = 2, unit = "large" },
  { id = "salt", to_taste = true },
]
steps = [
  "Heat the oven to 180°C and line a loaf tin about 23 by 13 cm with baking paper.",
  "Beat the soft butter with most of the sugar for 4 minutes, until pale and fluffy. Grate in the lemon zest.",
  "Beat in the eggs one at a time.",
  "Fold in the self-raising flour, a little salt and the milk.",
  "Spoon into the tin and bake for 40 to 45 minutes, until golden and a skewer comes out clean.",
  "Stir the lemon juice with the rest of the sugar. Prick the hot cake all over and spoon the drizzle over so it soaks in and leaves a crisp crust.",
  "Cool completely in the tin. Taste and serve in slices.",
]

[[recipe]]
id = "01a18c20-05df-76aa-a0a5-be146776e75a"
name = "Cheesecake"
serves = 12
prep_minutes = 25
cook_minutes = 60
plan_ahead = { wait_minutes = 420, note = "chill for 6 hours" }
image = { file = "01a18c20-05df-76aa-a0a5-be146776e75a.webp", sha256 = "1ef9517579ef449117a9d898d4725b59a56392052bb3e995fa3368ce43079467", alt = "Slice of baked cheesecake on a biscuit base" }
ingredients = [
  { id = "digestive-biscuits", amount = 250, unit = "g" },
  { id = "butter", amount = 0.5, unit = "cup" },
  { id = "cream-cheese", amount = 900, unit = "g" },
  { id = "sugar", amount = 1, unit = "cup" },
  { id = "egg", amount = 3, unit = "large" },
  { id = "sour-cream", amount = 1, unit = "cup" },
  { id = "lemon", amount = 1, unit = "small" },
  { id = "vanilla-extract", amount = 2, unit = "tsp" },
  { id = "all-purpose-flour", amount = 2, unit = "tbsp" },
]
steps = [
  "Heat the oven to 160°C. Grease a springform tin about 23 cm across.",
  "Crush the digestive biscuits to fine crumbs, mix with the melted butter and press firmly into the base. Bake for 10 minutes.",
  "Beat the soft cream cheese with the sugar until smooth, without whipping in air.",
  "Beat in the eggs one at a time, then the sour cream, lemon zest and juice, vanilla extract and all-purpose flour.",
  "Pour over the base. Bake for 50 to 60 minutes, until set at the edges with a wobble in the centre.",
  "Turn off the oven and leave the cheesecake inside with the door ajar for 1 hour, so it doesn't crack. Chill for at least 6 hours.",
  "Taste and serve cold in slices.",
]

[[recipe]]
id = "01a18c20-05e1-75f7-8402-eff7d0361150"
name = "Banana muffins"
serves = 12
prep_minutes = 15
cook_minutes = 22
ingredients = [
  { id = "banana", amount = 3, unit = "large" },
  { id = "all-purpose-flour", amount = 1.75, unit = "cup" },
  { id = "brown-sugar", amount = 0.5, unit = "cup" },
  { id = "baking-powder", amount = 1, unit = "tsp" },
  { id = "baking-soda", amount = 1, unit = "tsp" },
  { id = "egg", amount = 1, unit = "large" },
  { id = "butter", amount = 0.33, unit = "cup" },
  { id = "milk", amount = 0.25, unit = "cup" },
  { id = "ground-cinnamon", amount = 0.5, unit = "tsp" },
  { id = "vanilla-extract", amount = 1, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Heat the oven to 190°C and line a 12-cup muffin tin with paper cases.",
  "Mash the very ripe bananas well.",
  "Melt the butter and whisk it with the banana, brown sugar, egg, milk and vanilla extract.",
  "Whisk the all-purpose flour, baking powder, baking soda, ground cinnamon and a little salt, and fold it into the banana mixture until just combined.",
  "Fill the cases and bake for 18 to 22 minutes, until risen and a skewer comes out clean.",
  "Cool for 5 minutes in the tin, then on a rack. Taste one and serve.",
]

[[recipe]]
