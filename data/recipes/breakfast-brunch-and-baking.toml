  "Heat the oven to 180°C and line 2 trays with baking paper.",
  "Beat the soft butter with the brown sugar for 2 minutes, until creamy. Beat in the egg and vanilla extract.",
  "Stir in the all-purpose flour, baking soda, ground cinnamon and a little salt, then the rolled oats and raisins.",
  "Roll into balls about 4 cm across and space them well apart on the trays. Flatten slightly.",
  "Bake for 10 to 12 minutes, until golden at the edges but still soft in the middle.",
