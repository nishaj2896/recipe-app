[[recipe]]
id = "01a18c20-05d2-7d4d-bae0-43afae128a22"
name = "Cinnamon rolls"
serves = 12
prep_minutes = 30
cook_minutes = 25
plan_ahead = { wait_minutes = 60, note = "let the dough rise for 1 hour" }
ingredients = [
  { id = "all-purpose-flour", amount = 3.5, unit = "cup" },
  { id = "active-dry-yeast", amount = 2, unit = "tsp" },
  { id = "sugar", amount = 0.25, unit = "cup" },
  { id = "milk", amount = 1, unit = "cup" },
  { id = "butter", amount = 0.75, unit = "cup" },
  { id = "egg", amount = 1, unit = "large" },
  { id = "brown-sugar", amount = 0.75, unit = "cup" },
