[[recipe]]
id = "01a15175-3c24-7cf4-9ec4-2e239c353e9f"
name = "Tofu and broccoli stir-fry"
serves = 4
prep_minutes = 15
cook_minutes = 15
ingredients = [
  { id = "tofu", amount = 300, unit = "g" },
  { id = "broccoli", amount = 1, unit = "medium" },
  { id = "bell-pepper", amount = 1, unit = "medium" },
  { id = "soy-sauce", amount = 2, unit = "tbsp" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "ginger", amount = 10, unit = "g" },
  { id = "sesame-oil", amount = 2, unit = "tbsp" },
  { id = "cornflour", amount = 1, unit = "tbsp" },
  { id = "water", amount = 0.25, unit = "cup" },
]
steps = [
  "Wrap the tofu in a clean cloth and press it under a heavy pan for 10 minutes to squeeze out the liquid.",
  "Cut the tofu into 2 cm cubes and toss with the cornflour.",
  "Cut the broccoli into small florets and the bell pepper into strips. Finely chop the garlic and ginger.",
  "Heat the sesame oil in a wok over medium-high heat. Fry the tofu for 6 to 8 minutes, turning, until golden on all sides. Lift it out.",
  "Add the garlic and ginger and stir-fry for 30 seconds.",
  "Add the broccoli and the water, cover and cook for 3 minutes, until bright green and just tender.",
  "Add the bell pepper, tofu and soy sauce and toss for 2 minutes, until glossy. Serve hot.",
]

