[[recipe]]
id = "01a18c22-48dd-7b2f-9eb2-5fb9c0306f0a"
name = "Strawberry milkshake"
serves = 2
prep_minutes = 5
cook_minutes = 0
ingredients = [
  { id = "strawberries", amount = 1.5, unit = "cup" },
  { id = "milk", amount = 1, unit = "cup" },
  { id = "vanilla-ice-cream", amount = 1.5, unit = "cup" },
  { id = "sugar", amount = 1, unit = "tbsp" },
  { id = "vanilla-extract", amount = 0.25, unit = "tsp" },
]
steps = [
  "Hull the strawberries, keeping a couple aside for the top.",
  "Put the rest of the strawberries, the milk, vanilla ice cream, sugar and vanilla extract in a blender.",
  "Blend for 30 to 45 seconds, until smooth and thick.",
  "Taste and add more sugar if the strawberries are tart.",
  "Pour into tall glasses, top with the set-aside strawberries and serve straight away.",
]
