name = "Roast chicken with vegetables"
serves = 4
prep_minutes = 20
cook_minutes = 90
ingredients = [
  { id = "chicken", amount = 1.6, unit = "kg" },
  { id = "potato", amount = 750, unit = "g" },
  { id = "carrot", amount = 3, unit = "medium" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "garlic", amount = 1, unit = "piece" },
  { id = "lemon", amount = 1, unit = "medium" },
  { id = "thyme", amount = 6, unit = "sprig" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "olive-oil", amount = 3, unit = "tbsp" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Take a whole chicken out of the fridge 30 minutes ahead. Heat the oven to 200°C.",
  "Peel the potatoes and carrots and cut them into chunks. Cut the onions into wedges. Halve the head of garlic across.",
  "Toss the vegetables with the olive oil and salt in a large roasting tin.",
  "Pat the chicken dry. Rub it with the soft butter and season well with salt and the black pepper. Stuff the halved lemon, garlic and half the thyme inside.",
  "Set the chicken on the vegetables and scatter the rest of the thyme over. Roast for 75 to 90 minutes, turning the vegetables once, until the juices at the thigh run clear.",
  "Rest the chicken for 15 minutes. Squeeze the roasted garlic over the vegetables.",
  "Taste the vegetables and adjust. Carve the chicken and serve with the vegetables and the pan juices.",
]

[[recipe]]
id = "01a18c22-48cb-7c4a-a884-4d880921c8cd"
name = "Lemon herb grilled chicken"
serves = 4
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "chicken", amount = 750, unit = "g" },
  { id = "lemon", amount = 2, unit = "medium" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "rosemary", amount = 2, unit = "sprig" },
  { id = "thyme", amount = 4, unit = "sprig" },
  { id = "parsley", amount = 2, unit = "tbsp" },
  { id = "olive-oil", amount = 3, unit = "tbsp" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use boneless chicken breasts. Pound them between sheets of baking paper to an even 2 cm thick.",
  "Grate the garlic and finely chop the rosemary and thyme leaves. Mix them with the zest and juice of one of the lemons, the olive oil, the black pepper and salt.",
  "Toss the chicken in the marinade and leave for at least 30 minutes.",
  "Heat a griddle pan over medium-high heat. Grill the chicken for 5 to 7 minutes a side, until charred and cooked through.",
  "Rest for 5 minutes, then slice.",
  "Taste and adjust. Scatter the chopped parsley over and serve with the other lemon cut into wedges.",
]

[[recipe]]
id = "01a18c22-48cd-7934-b769-cdb5e04cb99d"
name = "Baked salmon with herbs"
serves = 4
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "salmon", amount = 4, unit = "piece" },
  { id = "dill", amount = 2, unit = "tbsp" },
  { id = "parsley", amount = 2, unit = "tbsp" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "lemon", amount = 1, unit = "large" },
  { id = "olive-oil", amount = 2, unit = "tbsp" },
  { id = "butter", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Heat the oven to 200°C. Line a tray with baking paper.",
  "Pat the salmon dry and lay it on the tray skin side down. Season with salt.",
  "Finely chop the dill, parsley and garlic and mix with the olive oil, lemon zest and half the lemon juice.",
  "Spread the herb mixture over the salmon and dot with the butter.",
  "Bake for 12 to 15 minutes, until the salmon flakes easily but is still slightly glossy in the centre.",
  "Taste and adjust. Squeeze the rest of the lemon juice over and serve hot.",
]

[[recipe]]
id = "01a18c22-48cf-7d5b-9142-9176d2eaf297"
name = "Garlic butter prawns"
serves = 4
prep_minutes = 10
cook_minutes = 6
ingredients = [
  { id = "prawns", amount = 500, unit = "g" },
  { id = "butter", amount = 3, unit = "tbsp" },
  { id = "garlic", amount = 5, unit = "clove" },
  { id = "chilli-flakes", amount = 0.25, unit = "tsp" },
  { id = "lemon", amount = 0.5, unit = "medium" },
  { id = "parsley", amount = 2, unit = "tbsp" },
  { id = "olive-oil", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Peel and devein the prawns, leaving the tails on. Pat dry and season with salt.",
  "Chop the garlic and parsley.",
  "Heat the olive oil and half the butter in a large frying pan over medium-high heat. Add the prawns in a single layer and cook for 1 to 2 minutes, until pink underneath.",
  "Turn them, add the rest of the butter, the garlic and chilli flakes and cook for 1 to 2 minutes, until the prawns are just cooked and the garlic is fragrant.",
  "Squeeze the lemon juice over and toss with the parsley.",
  "Taste and adjust the salt. Serve hot with the garlic butter spooned over.",
]

[[recipe]]
id = "01a18c22-48d2-70bc-8318-07719de80dea"
name = "Stuffed bell peppers"
serves = 4
prep_minutes = 20
cook_minutes = 45
ingredients = [
  { id = "bell-pepper", amount = 4, unit = "large" },
  { id = "beef-mince", amount = 400, unit = "g" },
  { id = "rice", amount = 0.5, unit = "cup" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "canned-tomatoes", amount = 1, unit = "can" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "smoked-paprika", amount = 1, unit = "tsp" },
  { id = "cheddar", amount = 1, unit = "cup" },
  { id = "olive-oil", amount = 1, unit = "tbsp" },
  { id = "parsley", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Rinse the rice and simmer it in the water in a covered pan for 12 minutes, until just tender.",
  "Heat the oven to 190°C. Cut the bell peppers in half lengthwise and scoop out the seeds. Lay them cut side up in a baking dish.",
  "Chop the onion and garlic. Heat the olive oil in a pan over medium-high heat and brown the beef mince for 6 minutes. Add the onion for 5 minutes and the garlic, cumin powder and smoked paprika for 1 minute.",
  "Stir in half the canned tomatoes and the rice and simmer for 5 minutes. Season with salt.",
  "Taste the filling and adjust. Spoon it into the peppers. Pour the rest of the canned tomatoes round them.",
  "Cover with foil and bake for 25 minutes. Uncover, scatter the grated cheddar over and bake for 10 to 15 minutes, until the peppers are tender and the cheese is golden.",
  "Scatter the chopped parsley over and serve hot.",
]

[[recipe]]
id = "01a18c22-48d4-71fa-ac01-1fc4ecfd3d00"
name = "Hot chocolate"
serves = 2
prep_minutes = 2
cook_minutes = 6
ingredients = [
  { id = "milk", amount = 2, unit = "cup" },
  { id = "dark-chocolate", amount = 75, unit = "g" },
  { id = "cocoa-powder", amount = 1, unit = "tbsp" },
  { id = "sugar", amount = 1, unit = "tbsp" },
  { id = "vanilla-extract", amount = 0.25, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Chop the dark chocolate finely.",
  "Whisk a little of the milk with the cocoa powder and sugar in a pan into a smooth paste.",
  "Whisk in the rest of the milk and heat over medium heat for 3 to 4 minutes, until steaming. Do not let it boil.",
  "Take off the heat and whisk in the chocolate until melted and frothy.",
  "Add the vanilla extract and a tiny pinch of salt.",
  "Taste and add more sugar if needed. Serve hot.",
]

[[recipe]]
id = "01a18c22-48d6-73e1-ad5e-9405ad8e716c"
name = "Iced lemon tea"
serves = 4
prep_minutes = 5
cook_minutes = 5
plan_ahead = { wait_minutes = 60, note = "chill for 1 hour" }
ingredients = [
  { id = "black-tea", amount = 2, unit = "tbsp" },
  { id = "lemon", amount = 2, unit = "medium" },
  { id = "sugar", amount = 0.33, unit = "cup" },
  { id = "mint", amount = 4, unit = "sprig" },
  { id = "water", amount = 5, unit = "cup" },
]
steps = [
  "Bring half the water to a boil. Take it off the heat, add the black tea and steep for 4 minutes. Do not steep longer or it turns bitter.",
  "Strain, stir in the sugar until dissolved and add the rest of the water, cold.",
  "Stir in the juice of one of the lemons.",
  "Chill for at least 1 hour.",
  "Taste and adjust the sweetness and lemon.",
  "Serve over ice with slices of the other lemon and the mint.",
]

[[recipe]]
id = "01a18c22-48d9-7217-90ea-1e9143c5f867"
name = "Lemonade"
serves = 6
prep_minutes = 10
cook_minutes = 3
plan_ahead = { wait_minutes = 60, note = "chill for 1 hour" }
ingredients = [
  { id = "lemon", amount = 6, unit = "medium" },
  { id = "sugar", amount = 0.75, unit = "cup" },
  { id = "mint", amount = 4, unit = "sprig" },
  { id = "water", amount = 6, unit = "cup" },
]
steps = [
  "Heat the sugar with a little of the water in a pan over low heat for 2 to 3 minutes, stirring, until dissolved. Cool.",
  "Squeeze the lemons and strain out the seeds. Keep a few slices aside.",
  "Stir the lemon juice and syrup into the rest of the water.",
  "Chill for at least 1 hour.",
  "Taste and add more sugar or lemon as needed.",
  "Serve over ice with the lemon slices and mint.",
]

[[recipe]]
