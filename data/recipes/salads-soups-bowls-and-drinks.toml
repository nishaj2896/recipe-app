[[recipe]]
id = "01a18c22-48a7-7e7c-8eb5-069a3ed8724b"
name = "Roasted pumpkin soup"
serves = 4
prep_minutes = 15
cook_minutes = 45
ingredients = [
  { id = "pumpkin", amount = 1, unit = "kg" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "olive-oil", amount = 2, unit = "tbsp" },
  { id = "vegetable-stock", amount = 3, unit = "cup" },
  { id = "cream", amount = 0.33, unit = "cup" },
  { id = "nutmeg", amount = 0.25, unit = "tsp" },
  { id = "pumpkin-seeds", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Heat the oven to 200°C. Peel the pumpkin, scoop out the seeds and cut the flesh into chunks about 4 cm across. Quarter the onion.",
  "Toss the pumpkin, onion and unpeeled garlic with the olive oil and salt on a tray. Roast for 30 to 35 minutes, until soft and caramelised at the edges.",
  "Squeeze the garlic out of its skins. Put everything in a pot with the vegetable stock and simmer for 5 minutes.",
  "Blend until very smooth.",
  "Stir in most of the cream and the nutmeg and warm through. Season with salt.",
  "Toast the pumpkin seeds in a dry pan for 3 minutes, until they pop.",
  "Taste and adjust. Serve hot with a swirl of the rest of the cream and the pumpkin seeds.",
]

