steps = [
  "Rinse the ker and sangri in several changes of water, then soak them in plenty of water overnight.",
  "Drain, then boil them in the water for 10 minutes, until the sangri are tender. Drain well.",
  "Heat the mustard oil in a heavy pan over medium-high heat until it just smokes, then let it cool for 1 minute.",
  "Add the cumin seeds, fennel seeds, dried red chillies and asafoetida and let them sizzle for 20 seconds.",
  "Add the ker and sangri with the turmeric, red chilli powder, coriander powder and salt. Fry on medium heat for 5 minutes, stirring.",
  "Stir in the curd and raisins and cook for 5 to 6 minutes, until the curd is absorbed and the vegetables look glossy and dry.",
  "Sprinkle the dry mango powder over and toss. Taste for salt and serve with bajre ki roti.",
]

[[recipe]]
id = "01a18b5a-d341-7472-a13b-3f105ba46983"
name = "Papad ki sabzi"
