[[recipe]]
id = "01a18b5a-d309-7a45-94ad-a3bc8b578eae"
name = "Dhokla"
serves = 4
prep_minutes = 15
cook_minutes = 20
ingredients = [
  { id = "rice", amount = 1, unit = "cup" },
  { id = "urad-dal", amount = 0.25, unit = "cup" },
  { id = "curd", amount = 0.5, unit = "cup" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "fruit-salt", amount = 1, unit = "tsp" },
  { id = "red-chilli-powder", amount = 0.25, unit = "tsp" },
  { id = "black-pepper", amount = 0.25, unit = "tsp" },
  { id = "mustard-seeds", amount = 1, unit = "tsp" },
  { id = "sesame-seeds", amount = 1, unit = "tsp" },
  { id = "curry-leaves", amount = 1, unit = "sprig" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.75, unit = "cup" },
]
steps = [
  "Rinse the rice and urad dal and soak them together for 5 hours. Drain.",
  "Grind them with the curd and the water into a slightly grainy batter, like fine sand. Cover and leave in a warm place for 8 hours or overnight, until risen and sour.",
  "Grind the ginger and green chillies to a paste and stir it into the batter with the salt and a spoonful of the oil.",
  "Bring a steamer to a boil and grease a round plate or tin about 20 cm across.",
  "Just before steaming, stir the fruit salt into the batter. It will froth up. Pour it into the plate at once, about 1.5 cm deep.",
  "Sprinkle the red chilli powder and crushed black pepper over. Steam on high heat for 12 to 15 minutes, until a knife comes out clean.",
  "Heat the rest of the oil in a small pan. Fry the mustard seeds until they pop, then the sesame seeds and curry leaves for 10 seconds.",
  "Pour the tempering over, cut into squares and scatter the coriander leaves over. Serve warm with chutney.",
]

[[recipe]]
id = "01a18b5a-d30b-7253-9386-da2dbe57c1bf"
name = "Khaman"
serves = 4
prep_minutes = 10
cook_minutes = 20
ingredients = [
