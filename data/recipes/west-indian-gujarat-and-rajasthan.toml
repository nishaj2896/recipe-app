[[recipe]]
id = "01a18b5a-d334-7005-83e2-f16bb22dae58"
name = "Basundi"
serves = 6
prep_minutes = 5
cook_minutes = 75
ingredients = [
  { id = "milk", amount = 2, unit = "l" },
  { id = "sugar", amount = 0.5, unit = "cup" },
  { id = "green-cardamom", amount = 5, unit = "piece" },
  { id = "nutmeg", amount = 1, unit = "pinch" },
  { id = "saffron", amount = 1, unit = "pinch" },
  { id = "almonds", amount = 10, unit = "piece" },
  { id = "pistachios", amount = 10, unit = "piece" },
  { id = "charoli", amount = 1, unit = "tbsp" },
]
steps = [
  "Bring the milk to a boil in a wide, heavy pan over medium heat.",
  "Lower the heat and simmer for 60 to 70 minutes, stirring every few minutes. Scrape the skin that forms on the sides back into the milk each time.",
  "Keep going until the milk has reduced to about a third and is thick and rich, with soft milky flecks through it.",
  "Add the sugar and saffron and simmer for 5 minutes, stirring, until dissolved.",
  "Crush the cardamom and grind the seeds. Stir them in with the nutmeg.",
  "Slice the almonds and pistachios and stir them in with the charoli. Chill and serve cold with puri.",
]

[[recipe]]
id = "01a18b5a-d336-7ed8-bf32-09ca1c59aefb"
name = "Mohanthal"
serves = 12
prep_minutes = 15
cook_minutes = 30
ingredients = [
  { id = "gram-flour", amount = 2, unit = "cup" },
  { id = "ghee", amount = 1, unit = "cup" },
  { id = "milk", amount = 0.25, unit = "cup" },
  { id = "khoa", amount = 0.5, unit = "cup" },
  { id = "sugar", amount = 1.25, unit = "cup" },
  { id = "green-cardamom", amount = 5, unit = "piece" },
  { id = "saffron", amount = 1, unit = "pinch" },
  { id = "almonds", amount = 10, unit = "piece" },
  { id = "pistachios", amount = 10, unit = "piece" },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Rub a quarter of the ghee and the milk, warmed, into the gram flour with your fingertips until it looks like coarse sand. Push it through a coarse sieve. This makes the fudge grainy, which is the point.",
  "Grease a tray about 20 cm across.",
  "Heat the rest of the ghee in a heavy pan over low heat. Add the gram flour and roast it for 15 to 20 minutes, stirring constantly, until it turns golden brown, smells nutty and the ghee separates.",
  "Crumble in the khoa and stir for 2 minutes, until it melts in.",
  "Meanwhile, heat the sugar and the water with the saffron, stirring until the sugar dissolves. Boil for 5 to 6 minutes, until it reaches one-thread consistency.",
  "Crush the cardamom and grind the seeds. Pour the syrup into the gram flour mixture with the cardamom and stir hard for 2 minutes, until it thickens.",
  "Spread it in the tray and smooth the top. Slice the almonds and pistachios and press them on.",
  "Let it set for 2 to 3 hours, then cut into squares.",
]

[[recipe]]
