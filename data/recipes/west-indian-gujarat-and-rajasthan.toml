[[recipe]]
id = "01a18b5a-d343-7c1d-a464-f1e946eea2e3"
name = "Bajre ki roti"
serves = 4
prep_minutes = 10
cook_minutes = 25
ingredients = [
  { id = "pearl-millet-flour", amount = 2, unit = "cup" },
  { id = "ghee", amount = 2, unit = "tbsp" },
  { id = "jaggery", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.75, unit = "cup" },
]
steps = [
  "Warm the water. Mix the pearl millet flour with the salt and add the warm water a little at a time, kneading with the heel of your palm until smooth and soft. Knead just enough for one or two rotis at a time.",
  "Take a ball of dough about 6 cm across. Pat it between wet palms, turning, into a round about 5 mm thick.",
  "Cook on a hot griddle over medium heat for 2 minutes, until set underneath. Flip and cook for 2 minutes more.",
  "Hold it over a flame for a few seconds with tongs, until it puffs in patches.",
  "Spread with the ghee and serve hot, with the jaggery crumbled alongside and a kadhi.",
]

[[recipe]]
id = "01a18b5a-d346-7a42-99b1-439ffb638573"
name = "Pyaaz kachori"
serves = 6
prep_minutes = 40
cook_minutes = 30
ingredients = [
  { id = "all-purpose-flour", amount = 2, unit = "cup" },
  { id = "ghee", amount = 0.25, unit = "cup" },
  { id = "onion", amount = 3, unit = "medium" },
  { id = "gram-flour", amount = 2, unit = "tbsp" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "fennel-seeds", amount = 1, unit = "tsp" },
  { id = "coriander-seeds", amount = 1, unit = "tsp" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "nigella-seeds", amount = 0.5, unit = "tsp" },
  { id = "red-chilli-powder", amount = 1, unit = "tsp" },
  { id = "garam-masala", amount = 0.5, unit = "tsp" },
  { id = "dry-mango-powder", amount = 1, unit = "tsp" },
  { id = "asafoetida", amount = 1, unit = "pinch" },
  { id = "oil", amount = 2, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "For the dough, rub the ghee into the all-purpose flour with salt until it holds together when pressed. Add the water a little at a time and knead into a soft, smooth dough. Cover and rest for 20 minutes.",
  "Chop the onions finely and grind the green chillies and ginger to a paste. Crush the fennel seeds and coriander seeds coarsely.",
  "Heat a spoonful of the oil in a pan over medium heat. Add the cumin seeds, nigella seeds, crushed fennel and coriander and the asafoetida, and stir for 20 seconds.",
  "Add the onions and the paste and cook for 6 minutes, until soft but not brown.",
  "Add the gram flour, red chilli powder, garam masala, dry mango powder and salt and stir for 3 minutes, until the mixture is dry. Cool completely.",
  "Divide the dough into balls about 5 cm across. Flatten each into a small bowl shape, fill with a spoonful of the onion mixture, gather the edges and seal. Press gently into a round about 8 cm across.",
  "Heat the rest of the oil for deep frying over low heat.",
  "Fry the kachoris a few at a time on low heat for 12 to 15 minutes, turning, until they puff, turn golden and sound crisp when tapped.",
  "Drain on paper and serve warm with a tangy chutney.",
]
