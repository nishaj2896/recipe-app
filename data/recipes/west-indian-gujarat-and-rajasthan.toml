  "Cover and steam on low heat for 8 to 10 minutes, stirring once, until the dough is smooth, glossy and cooked through.",
  "Spoon it into bowls, drizzle over the sesame oil and sprinkle the red chilli powder over. Taste for salt and serve hot.",
]

[[recipe]]
id = "01a18b5a-d32d-7abf-acf8-0c6a378df2fa"
name = "Bajra rotla"
serves = 4
prep_minutes = 10
cook_minutes = 25
ingredients = [
  { id = "pearl-millet-flour", amount = 2, unit = "cup" },
  { id = "ghee", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.75, unit = "cup" },
]
steps = [
  "Put the pearl millet flour and salt in a wide plate. Add the warm water a little at a time and knead with the heel of your palm for 3 to 4 minutes, until smooth and soft. Knead only enough for one or two rotlas at a time, as the dough dries out.",
  "Take a ball of dough about 6 cm across. Wet your hands and pat it between your palms, turning, into a round about 1 cm thick. You can also pat it out on a wet cloth.",
  "Heat a heavy griddle over medium heat. Lay the rotla on it and sprinkle a little of the water on top.",
  "Cook for 2 minutes, until the bottom is set, then flip and cook for 2 minutes more.",
  "Hold it over a flame with tongs for a few seconds, until it puffs in patches and has golden-brown spots.",
  "Spread with the ghee and serve hot with ringan no olo or kadhi.",
]

[[recipe]]
id = "01a18b5a-d32f-79e3-a8e1-428093f3694d"
name = "Lilva kachori"
serves = 6
prep_minutes = 40
cook_minutes = 30
ingredients = [
  { id = "green-pigeon-peas", amount = 2, unit = "cup" },
  { id = "all-purpose-flour", amount = 2, unit = "cup" },
  { id = "ghee", amount = 3, unit = "tbsp" },
  { id = "green-chillies", amount = 3, unit = "piece" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "coconut", amount = 2, unit = "tbsp" },
  { id = "sesame-seeds", amount = 1, unit = "tbsp" },
  { id = "sugar", amount = 1, unit = "tbsp" },
  { id = "lemon", amount = 1, unit = "small" },
  { id = "fennel-seeds", amount = 1, unit = "tsp" },
  { id = "garam-masala", amount = 0.5, unit = "tsp" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 2, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "For the dough, rub the ghee into the all-purpose flour with salt until it holds together when pressed. Add the water a little at a time and knead into a firm, smooth dough. Cover and rest for 20 minutes.",
  "Crush the green pigeon peas coarsely in a grinder, pulsing, without adding liquid.",
  "Grind the green chillies and ginger to a paste.",
  "Heat a spoonful of the oil in a pan over medium heat. Add the fennel seeds, then the crushed green pigeon peas and the chilli paste. Cook for 6 to 8 minutes, stirring, until the raw smell goes and the mixture is dry.",
  "Stir in the coconut, sesame seeds, sugar, lemon juice, garam masala, coriander leaves and salt. Cool, then roll into balls about 3 cm across.",
  "Divide the dough into balls slightly bigger than the filling. Roll each into a round about 8 cm across, put a filling ball in the centre and gather the edges up to seal. Flatten gently.",
  "Heat the rest of the oil for deep frying over low heat.",
  "Fry the kachoris a few at a time on low heat for 10 to 12 minutes, turning, until crisp and golden all over. Slow frying makes them flaky.",
  "Drain on paper and serve warm.",
]

[[recipe]]
