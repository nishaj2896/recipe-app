steps = [
  "Roast the papad over a flame or in a dry pan for a few seconds per side, until crisp. Break each into large pieces.",
  "Whisk the curd, gram flour, red chilli powder, turmeric, coriander powder, salt and the water until smooth.",
  "Heat the ghee in a pan over medium heat. Let the cumin seeds sizzle, then add the asafoetida and slit green chillies.",
  "Turn the heat to low and pour in the curd mixture, stirring constantly. Simmer for 5 to 6 minutes, until it thickens slightly and no longer tastes raw.",
