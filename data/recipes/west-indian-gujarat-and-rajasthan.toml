  "Blend the mango with the saffron milk until smooth and thick, like a thick custard.",
  "Crush the cardamom and grind the seeds. Stir them in with the dry ginger powder.",
  "Taste and add the sugar only if the mangoes aren't sweet enough. Chill and serve with puri.",
]

[[recipe]]
