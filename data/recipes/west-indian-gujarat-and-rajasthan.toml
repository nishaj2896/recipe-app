  "Roll the dough into a thin round about 2 mm thick and cut it into diamonds about 3 cm across.",
  "Chop the tomato and grind the ginger and green chillies to a paste.",
  "Add most of the rest of the water to the dal with the tomato, ginger paste, jaggery, kokum, the rest of the red chilli powder and salt. Bring to a rolling boil.",
  "Drop in the dhokli one at a time, stirring gently so they don't stick. Simmer for 12 to 15 minutes, until the dhokli are cooked through and the dal has thickened. Add the last of the water if it gets too thick.",
  "Heat the ghee in a small pan. Fry the mustard seeds and cumin seeds until they pop, then the cloves, cinnamon, curry leaves and asafoetida for 15 seconds.",
  "Pour the tempering over and squeeze in the lemon juice. Taste for salt, scatter the coriander leaves over and serve hot with a spoonful of extra ghee.",
