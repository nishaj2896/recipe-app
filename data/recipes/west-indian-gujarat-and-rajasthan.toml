  "Heat the oil in a wide pan over medium heat. Fry the mustard seeds until they pop, then the sesame seeds, asafoetida and turmeric for 10 seconds.",
  "Add the crumbled dal, sugar, lemon juice and salt and toss on low heat for 3 minutes, until mixed and warm.",
  "Taste for salt and sweetness. Pile it on a plate and top with the sev, pomegranate, grated coconut and coriander leaves. Serve at once.",
