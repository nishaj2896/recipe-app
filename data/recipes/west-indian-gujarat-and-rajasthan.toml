  { id = "semolina", amount = 1, unit = "tbsp" },
  { id = "sugar", amount = 2, unit = "tbsp" },
  { id = "lemon", amount = 1, unit = "medium" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "green-chillies", amount = 3, unit = "piece" },
  { id = "turmeric", amount = 0.25, unit = "tsp" },
  { id = "fruit-salt", amount = 1.5, unit = "tsp" },
  { id = "mustard-seeds", amount = 1, unit = "tsp" },
  { id = "sesame-seeds", amount = 1, unit = "tsp" },
  { id = "curry-leaves", amount = 1, unit = "sprig" },
  { id = "asafoetida", amount = 1, unit = "pinch" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "coconut", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1.5, unit = "cup" },
]
steps = [
  "Grind the ginger and one green chilli to a paste.",
  "Whisk the gram flour, semolina, half the sugar, half the lemon juice, the ginger paste, turmeric, a spoonful of the oil and salt with most of the water into a smooth, thick batter, like pancake batter. Rest for 10 minutes.",
  "Bring a steamer to a boil and grease a round tin about 20 cm across.",
  "Stir the fruit salt into the batter with a spoonful of the rest of the water. It will froth up; mix gently in one direction and pour it into the tin at once.",
  "Steam on high heat for 15 to 18 minutes, until risen, spongy and a knife comes out clean. Rest for 5 minutes, then cut into squares.",
  "Heat the rest of the oil in a small pan. Fry the mustard seeds until they pop, then the sesame seeds, curry leaves, the other green chillies, slit, and the asafoetida for 20 seconds.",
  "Take the pan off the heat and carefully add the rest of the water, sugar and lemon juice. Stir until the sugar dissolves.",
  "Spoon the tempering evenly over the khaman so it soaks in. Scatter the coriander leaves and grated coconut over and serve.",
]

