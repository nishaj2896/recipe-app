  "Chop the spring onions and spring garlic, including the greens. Chop the tomato, green chillies and ginger.",
  "Heat the rest of the oil in a pan over medium heat and let the cumin seeds sizzle.",
  "Add the spring onions, spring garlic, green chillies and ginger and cook for 4 minutes, until soft.",
  "Add the tomato, turmeric, red chilli powder and coriander powder and cook for 3 minutes, until soft.",
  "Add the mashed brinjal and salt and cook for 5 minutes, stirring, until the mixture is thick and smoky.",
  "Scatter the coriander leaves over, taste for salt and serve with bajra rotla.",
]

