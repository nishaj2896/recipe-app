  "Trim the green beans and dry them completely. Finely chop the garlic and ginger and snip the dried red chillies into pieces.",
  "Heat the oil in a wok over medium-high heat. Fry the green beans in two batches for 5 to 6 minutes, turning, until blistered, wrinkled and tender. Lift them out.",
  "Pour off all but a spoonful of the oil. Fry the minced pork for 3 minutes, breaking it up, until browned and crisp.",
  "Add the garlic, ginger, dried red chillies and sichuan peppercorns and stir-fry for 30 seconds, until fragrant.",
  "Return the green beans, add the shaoxing wine, soy sauce and sugar and toss for 1 minute, until coated.",
