]

[[recipe]]
id = "01a18c0c-0c9b-7fd2-a681-080da440ba0a"
name = "Hong shao rou"
serves = 4
prep_minutes = 15
cook_minutes = 90
ingredients = [
  { id = "pork-belly", amount = 750, unit = "g" },
  { id = "rock-sugar", amount = 2, unit = "tbsp" },
  { id = "shaoxing-wine", amount = 3, unit = "tbsp" },
  { id = "soy-sauce", amount = 2, unit = "tbsp" },
  { id = "dark-soy-sauce", amount = 1, unit = "tbsp" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "star-anise", amount = 2, unit = "piece" },
  { id = "cinnamon-sticks", amount = 1, unit = "piece" },
  { id = "spring-onions", amount = 3, unit = "piece" },
  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 4, unit = "cup" },
]
steps = [
  "Cut the pork belly into cubes about 3 cm across. Slice the ginger and cut the spring onions into lengths.",
  "Put the pork belly in a pan of cold tap water, bring to a boil and blanch for 3 minutes. Drain and rinse.",
  "Heat the oil and rock sugar in a wok over low heat for 3 to 4 minutes, stirring, until the rock sugar melts and turns amber.",
  "Add the pork belly and toss for 2 minutes, until coated in the caramel.",
  "Add the ginger, star anise, cinnamon, spring onions, shaoxing wine, soy sauce, dark soy sauce and the water. Bring to a boil, then cover and simmer on low heat for 60 to 70 minutes, until the pork belly is very tender.",
  "Uncover, raise the heat and simmer for 8 to 10 minutes, stirring, until the sauce reduces to a thick, glossy glaze.",
  "Taste for salt and serve hot.",
]

[[recipe]]
id = "01a18c0c-0c9d-704d-9c75-895ccf99a70e"
