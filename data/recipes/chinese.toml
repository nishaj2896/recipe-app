]
steps = [
  "Halve the bok choy lengthwise and rinse out any grit. Shake dry. Finely chop the garlic.",
  "Heat the oil in a wok over medium heat. Fry the garlic for 30 seconds, until pale golden.",
  "Raise the heat to high. Add the bok choy and toss for 1 minute.",
  "Add the water, cover and steam for 1 to 2 minutes, until the stems are just tender.",
  "Uncover, add the oyster sauce and soy sauce and toss for 30 seconds, until glossy. Taste for salt and serve hot.",
]

[[recipe]]
id = "01a18c0c-0c98-78ec-b4e3-bf80061baee4"
name = "Dry-fried green beans"
serves = 4
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "french-beans", amount = 400, unit = "g" },
  { id = "pork", amount = 100, unit = "g" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "dried-red-chillies", amount = 4, unit = "piece" },
  { id = "sichuan-peppercorns", amount = 0.5, unit = "tsp" },
