ingredients = [
  { id = "chicken", amount = 500, unit = "g" },
  { id = "egg", amount = 1, unit = "large" },
  { id = "cornflour", amount = 0.5, unit = "cup" },
  { id = "all-purpose-flour", amount = 2, unit = "tbsp" },
  { id = "pineapple", amount = 1, unit = "cup" },
  { id = "bell-pepper", amount = 1, unit = "medium" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "ketchup", amount = 3, unit = "tbsp" },
  { id = "rice-vinegar", amount = 3, unit = "tbsp" },
  { id = "sugar", amount = 2, unit = "tbsp" },
  { id = "soy-sauce", amount = 1, unit = "tbsp" },
  { id = "oil", amount = 2, unit = "cup" },
  { id = "salt", to_taste = true },
