[[recipe]]
id = "01a18c0c-0c7e-7648-8def-906c51a046e5"
name = "Yangzhou fried rice"
serves = 4
prep_minutes = 15
cook_minutes = 15
ingredients = [
  { id = "rice", amount = 1.5, unit = "cup" },
  { id = "prawns", amount = 200, unit = "g" },
  { id = "ham", amount = 100, unit = "g" },
  { id = "egg", amount = 3, unit = "large" },
  { id = "peas", amount = 0.5, unit = "cup" },
  { id = "spring-onions", amount = 4, unit = "piece" },
  { id = "soy-sauce", amount = 1.5, unit = "tbsp" },
  { id = "shaoxing-wine", amount = 1, unit = "tbsp" },
  { id = "white-pepper", amount = 0.25, unit = "tsp" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 3, unit = "cup" },
]
steps = [
  "Rinse the rice in several changes of water. Simmer it in the water in a covered pan over low heat for 15 minutes, until tender, then spread it on a tray and chill until cold, ideally overnight.",
  "Peel and devein the prawns and cut them into pieces about 1.5 cm across. Dice the ham and slice the spring onions, keeping the green parts separate. Beat the eggs with a little salt.",
  "Heat a spoonful of the oil in a wok over high heat. Stir-fry the prawns for 1 to 2 minutes, until pink. Lift them out.",
  "Heat another spoonful of the oil, pour in the eggs and scramble for 30 seconds, until just set in large soft pieces. Lift them out.",
  "Heat the rest of the oil. Stir-fry the white parts of the spring onions for 20 seconds, then add the rice and toss for 3 minutes, pressing out any clumps, until every grain is hot and separate.",
  "Add the ham, peas, prawns and eggs, then splash the shaoxing wine and soy sauce round the edge of the wok. Toss for 2 minutes, until evenly coloured.",
  "Season with the white pepper, taste for salt, toss in the green parts of the spring onions and serve hot.",
]

[[recipe]]
id = "01a18c0c-0c84-72c3-9cb7-30ec9cbf0399"
name = "Egg drop soup"
serves = 4
prep_minutes = 5
cook_minutes = 12
ingredients = [
  { id = "chicken-stock", amount = 5, unit = "cup" },
  { id = "egg", amount = 3, unit = "large" },
  { id = "cornflour", amount = 2, unit = "tbsp" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "spring-onions", amount = 2, unit = "piece" },
  { id = "soy-sauce", amount = 1, unit = "tsp" },
  { id = "white-pepper", amount = 0.25, unit = "tsp" },
  { id = "toasted-sesame-oil", amount = 1, unit = "tsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 3, unit = "tbsp" },
]
steps = [
  "Slice the ginger into thin coins and the spring onions into thin rounds. Beat the eggs well. Mix the cornflour with the water until smooth.",
  "Simmer the chicken stock with the ginger in a pan over medium heat for 5 minutes, until fragrant. Lift out the ginger.",
  "Season with the soy sauce, white pepper and salt. Stir in the cornflour mixture and simmer for 1 minute, until the soup thickens slightly.",
  "Stir the soup in one direction to make a slow whirlpool. Pour the eggs in a thin stream from a height as it swirls.",
  "Leave it untouched for 10 seconds, until the egg sets in silky ribbons, then stir gently once.",
  "Drizzle the toasted sesame oil over, scatter the spring onions over, taste for salt and serve hot.",
]

[[recipe]]
