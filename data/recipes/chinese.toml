[[recipe]]
id = "01a18c0c-0c8d-7a83-a7e3-2c0d7c110e37"
name = "Char siu pork"
serves = 4
prep_minutes = 15
cook_minutes = 60
plan_ahead = { wait_minutes = 240, note = "marinate for 4 hours" }
ingredients = [
  { id = "pork", amount = 750, unit = "g" },
  { id = "hoisin-sauce", amount = 3, unit = "tbsp" },
  { id = "honey", amount = 3, unit = "tbsp" },
  { id = "soy-sauce", amount = 2, unit = "tbsp" },
  { id = "dark-soy-sauce", amount = 1, unit = "tbsp" },
  { id = "shaoxing-wine", amount = 1, unit = "tbsp" },
  { id = "chinese-five-spice", amount = 0.5, unit = "tsp" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Use pork shoulder or neck. Cut it along the grain into strips about 5 cm thick.",
  "Grate the garlic and mix it with the hoisin sauce, half the honey, the soy sauce, dark soy sauce, shaoxing wine and five spice.",
  "Coat the pork in most of the marinade and leave in the fridge for at least 4 hours, ideally overnight. Keep the rest of the marinade.",
  "Heat the oven to 200°C. Pour the water into a roasting tin and set a rack over it. Lay the pork on the rack.",
  "Roast for 25 minutes, then turn and roast for 15 minutes more.",
  "Mix the rest of the marinade with the rest of the honey. Brush it over the pork and roast for 10 to 15 minutes, until sticky, deeply glazed and charred at the edges, and the centre reaches 70°C.",
  "Rest for 10 minutes, then slice thinly and serve with any pan juices spooned over.",
]

[[recipe]]
id = "01a18c0c-0c90-7f6e-b008-450543d82631"
