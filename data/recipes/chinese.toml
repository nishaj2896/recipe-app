  { id = "garlic", amount = 3, unit = "clove" },
  { id = "ketchup", amount = 3, unit = "tbsp" },
  { id = "rice-vinegar", amount = 3, unit = "tbsp" },
  { id = "sugar", amount = 2, unit = "tbsp" },
  { id = "soy-sauce", amount = 1, unit = "tbsp" },
  { id = "oil", amount = 2, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Cut the chicken into cubes about 2.5 cm across and toss with the egg and salt. Mix most of the cornflour with the all-purpose flour and toss the chicken in it until coated.",
  "Cut the pineapple, bell pepper and onion into chunks about 2.5 cm across. Chop the garlic.",
  "Whisk the ketchup, rice vinegar, sugar, soy sauce, the rest of the cornflour and the water into a sauce.",
  "Heat the oil for deep frying over medium-high heat. Fry the chicken in batches for 4 to 5 minutes, until golden, crisp and cooked through. Drain.",
