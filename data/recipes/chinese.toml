[[recipe]]
id = "01a18c0c-0c92-7cb2-8e19-527eff504a2f"
name = "Scallion pancakes"
serves = 4
prep_minutes = 30
cook_minutes = 20
ingredients = [
  { id = "all-purpose-flour", amount = 2, unit = "cup" },
  { id = "spring-onions", amount = 6, unit = "piece" },
  { id = "toasted-sesame-oil", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 0.25, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.75, unit = "cup" },
]
steps = [
  "Bring the water to a boil. Pour it over the all-purpose flour, stir with chopsticks into shaggy clumps, then knead for 5 minutes into a smooth, soft dough. Cover and rest for 30 minutes.",
  "Thinly slice the spring onions. Mix a spoonful of the all-purpose flour with the toasted sesame oil into a paste.",
  "Divide the dough into quarters. Roll a portion into a thin rectangle about 30 by 20 cm. Spread with the flour paste, sprinkle with salt and a quarter of the spring onions.",
  "Roll it up tightly from the long side into a rope, then coil the rope into a snail and tuck the end under. Rest for 10 minutes, then roll it out gently into a round about 18 cm across.",
  "Heat a spoonful of the oil in a frying pan over medium heat. Fry the pancake for 2 to 3 minutes per side, until golden, crisp and flaky.",
  "Repeat with the rest of the dough. Cut into wedges and serve hot.",
]

[[recipe]]
id = "01a18c0c-0c94-7245-8103-1e8150106026"
name = "Tomato and egg stir-fry"
serves = 2
prep_minutes = 5
cook_minutes = 8
ingredients = [
  { id = "tomato", amount = 3, unit = "medium" },
  { id = "egg", amount = 4, unit = "large" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "spring-onions", amount = 2, unit = "piece" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 2, unit = "tbsp" },
]
steps = [
  "Cut the tomatoes into wedges. Slice the spring onions. Beat the eggs with a little salt.",
  "Heat most of the oil in a wok over medium-high heat. Pour in the eggs and stir gently for 30 to 40 seconds, until just set in large soft folds. Lift them out.",
  "Heat the rest of the oil and stir-fry the tomatoes for 2 to 3 minutes, until they soften and release their juice.",
  "Add the sugar, salt and the water and cook for 1 minute, until saucy.",
  "Return the eggs and fold gently for 30 seconds, until coated.",
  "Taste for salt and sweetness, scatter the spring onions over and serve hot.",
]

[[recipe]]
id = "01a18c0c-0c96-7c75-af1b-2b1ccb034cb6"
name = "Garlic bok choy"
serves = 4
prep_minutes = 5
cook_minutes = 5
