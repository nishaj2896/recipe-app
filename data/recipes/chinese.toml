[[recipe]]
id = "01a18c0c-0ca4-723c-b4e4-813d4740db1c"
name = "Congee"
serves = 4
prep_minutes = 10
cook_minutes = 75
ingredients = [
  { id = "rice", amount = 0.75, unit = "cup" },
  { id = "chicken", amount = 300, unit = "g" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "spring-onions", amount = 3, unit = "piece" },
  { id = "soy-sauce", amount = 2, unit = "tbsp" },
  { id = "toasted-sesame-oil", amount = 2, unit = "tsp" },
  { id = "white-pepper", amount = 0.25, unit = "tsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 9, unit = "cup" },
]
steps = [
  "Rinse the rice in several changes of water. Toss it with a little salt and a few drops of the toasted sesame oil and leave for 15 minutes.",
  "Bring the water to a boil in a large pot with the chicken and half the ginger, sliced. Add the rice and stir.",
  "Simmer, partly covered, on low heat for 60 to 70 minutes, stirring now and then to stop it sticking, until the grains have broken down into a thick, silky porridge.",
  "Lift out the chicken after 20 minutes, when it is cooked through. Shred it and set it aside.",
  "Cut the rest of the ginger into fine strips and slice the spring onions.",
  "Season the congee with salt and the white pepper. Ladle into bowls and top with the chicken, ginger strips, spring onions, soy sauce and the rest of the toasted sesame oil. Serve hot.",
