  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 2, unit = "tbsp" },
]
steps = [
  "Use barramundi fillets with the skin on. Pat them dry and season with salt.",
  "Cut the ginger and spring onions into very fine strips about 6 cm long.",
  "Put the fish on a heatproof plate, scatter half the ginger over and drizzle the shaoxing wine over.",
  "Steam over boiling water for 8 to 10 minutes, until the flesh is opaque and flakes easily. Pour off the liquid on the plate.",
  "Warm the soy sauce, sugar and the water in a small pan for 1 minute, until the sugar dissolves. Pour it round the fish.",
  "Pile the rest of the ginger and the spring onions on top. Heat the oil in a small pan until smoking and pour it over so it sizzles. Serve straight away.",
