  "Use boneless chicken thighs. Cut them into pieces about 3 cm across and toss with the egg and salt. Mix most of the cornflour with the all-purpose flour and coat the chicken in it.",
  "Grate the zest of one orange and squeeze the juice from both. Grate the garlic and ginger. Whisk the orange juice and zest with the soy sauce, rice vinegar, sugar, chilli flakes and the rest of the cornflour.",
  "Heat the oil for deep frying over medium-high heat. Fry the chicken in batches for 4 to 5 minutes, until golden, crisp and cooked through. Drain.",
