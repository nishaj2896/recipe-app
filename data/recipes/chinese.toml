[[recipe]]
id = "01a18bba-785c-7cb8-834d-24e0197260c4"
name = "Kung pao chicken"
serves = 4
prep_minutes = 15
cook_minutes = 15
image = { file = "01a18bba-785c-7cb8-834d-24e0197260c4.webp", sha256 = "39f3ec2b9fa611f7722f649534e71cef98a2863315cd991ececeb763de8707f9", alt = "Kung pao chicken with peanuts, dried chillies and spring onion" }
ingredients = [
  { id = "chicken", amount = 500, unit = "g" },
  { id = "peanuts", amount = 0.5, unit = "cup" },
  { id = "dried-red-chillies", amount = 10, unit = "piece" },
  { id = "sichuan-peppercorns", amount = 1, unit = "tsp" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "spring-onions", amount = 4, unit = "piece" },
  { id = "soy-sauce", amount = 2, unit = "tbsp" },
  { id = "dark-soy-sauce", amount = 1, unit = "tsp" },
  { id = "black-vinegar", amount = 1.5, unit = "tbsp" },
  { id = "shaoxing-wine", amount = 1, unit = "tbsp" },
  { id = "sugar", amount = 1, unit = "tbsp" },
  { id = "cornflour", amount = 1, unit = "tbsp" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 3, unit = "tbsp" },
]
steps = [
  "Use boneless chicken thighs. Cut them into cubes about 1.5 cm across and toss with the shaoxing wine, half the soy sauce, half the cornflour and a little salt.",
  "Whisk the rest of the soy sauce, the dark soy sauce, black vinegar, sugar, the rest of the cornflour and the water into a sauce.",
  "Snip the dried red chillies into pieces and shake out most of the seeds. Slice the garlic and ginger and cut the spring onions into pieces about 2 cm long.",
  "Heat the oil in a wok over medium heat. Fry the peanuts for 1 to 2 minutes, until golden, and lift them out. Fry the dried red chillies and sichuan peppercorns for 20 to 30 seconds, until the chillies darken but don't burn.",
  "Raise the heat to high, add the chicken and stir-fry for 3 to 4 minutes, until cooked through. Add the garlic, ginger and spring onions and toss for 30 seconds.",
  "Stir the sauce, pour it in and toss for 1 minute, until thick and glossy. Toss in the peanuts.",
  "Taste for salt and balance and serve straight away.",
]

[[recipe]]
id = "01a18bba-785e-7793-8335-d5dc9b148364"
name = "Mapo tofu"
serves = 4
prep_minutes = 10
cook_minutes = 15
image = { file = "01a18bba-785e-7793-8335-d5dc9b148364.webp", sha256 = "42a24861351b31d95da17589f6db19424817e7bb0d2df009617925ccd7263fa3", alt = "Mapo tofu with beef mince and spring onions in a chilli sauce" }
ingredients = [
  { id = "silken-tofu", amount = 400, unit = "g" },
  { id = "beef-mince", amount = 150, unit = "g" },
  { id = "doubanjiang", amount = 2, unit = "tbsp" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "sichuan-peppercorns", amount = 1, unit = "tsp" },
  { id = "chilli-flakes", amount = 1, unit = "tsp" },
  { id = "soy-sauce", amount = 1, unit = "tbsp" },
  { id = "cornflour", amount = 1, unit = "tbsp" },
  { id = "spring-onions", amount = 2, unit = "piece" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Toast the sichuan peppercorns in a dry wok over low heat for 2 minutes, until fragrant, then grind them to a powder.",
  "Cut the silken tofu into cubes about 2 cm across. Finely chop the garlic and ginger and slice the spring onions.",
  "Bring the water to a simmer in a small pan with a little salt. Slide in the silken tofu for 2 minutes to firm it up, then lift it out gently with a slotted spoon. Keep the water.",
  "Heat the oil in the wok over medium-high heat. Fry the beef mince for 3 minutes, until browned and crisp in places.",
  "Lower the heat to medium. Add the doubanjiang and chilli flakes and fry for 1 minute, until the oil turns red. Add the garlic and ginger for 30 seconds.",
  "Pour in most of the water and the soy sauce and bring to a simmer. Slide in the silken tofu and simmer for 4 to 5 minutes, nudging gently so it doesn't break.",
  "Mix the cornflour with the rest of the water, stir it in gently and simmer for 1 minute, until glossy. Taste for salt, sprinkle the ground sichuan peppercorns and spring onions over and serve hot.",
]

[[recipe]]
id = "01a18bba-7860-7ecc-b429-d4ea871652b1"
name = "Sweet and sour chicken"
serves = 4
prep_minutes = 20
cook_minutes = 25
