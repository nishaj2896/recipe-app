  "Crush the ginger and green cardamom lightly.",
  "Bring the water to a boil in a small pan with the ginger and cardamom, and simmer for 2 minutes.",
  "Add the black tea and simmer for 1 minute, until the colour deepens to a dark amber.",
  "Pour in the milk and add the sugar.",
