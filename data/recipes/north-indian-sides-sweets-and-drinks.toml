[[recipe]]
id = "01a15175-3c13-7e43-b346-d7c2279e5e6b"
name = "Rice kheer"
serves = 4
prep_minutes = 5
cook_minutes = 40
ingredients = [
  { id = "rice", amount = 50, unit = "g" },
  { id = "milk", amount = 1, unit = "l" },
  { id = "sugar", amount = 0.333, unit = "cup" },
  { id = "green-cardamom", amount = 4, unit = "piece" },
]
steps = [
  "Rinse the rice and soak it for 15 minutes, then drain.",
  "Bring the milk to a boil in a heavy pan, add the rice and simmer on low heat for 30 to 35 minutes, stirring often so it doesn't catch, until the rice is soft and the milk has thickened.",
  "Stir in the sugar and the crushed seeds of the green cardamom and simmer for 5 minutes more.",
  "Serve warm, or chill it for a few hours and serve cold.",
]

