  "Taste for sweetness and serve cold.",
]

[[recipe]]
id = "01a188e4-2cf8-7c0a-8505-3c257a0d73d6"
name = "Jaljeera"
serves = 4
prep_minutes = 10
cook_minutes = 0
ingredients = [
  { id = "mint", amount = 0.5, unit = "cup" },
  { id = "coriander-leaves", amount = 0.25, unit = "cup" },
  { id = "cumin-powder", amount = 2, unit = "tsp" },
  { id = "black-salt", amount = 1, unit = "tsp" },
  { id = "dry-mango-powder", amount = 1, unit = "tsp" },
  { id = "tamarind", amount = 15, unit = "g" },
  { id = "lemon", amount = 1, unit = "medium" },
  { id = "sugar", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "l" },
]
steps = [
  "Soak the tamarind in a little of the water for 10 minutes, then squeeze it and strain the pulp.",
  "Dry roast the cumin powder for 30 seconds, until it darkens slightly.",
  "Blend the mint and coriander leaves with the tamarind pulp, cumin powder, black salt, dry mango powder, sugar and a splash of the water to a smooth paste.",
  "Stir the paste into the rest of the water, chilled, with the lemon juice and salt.",
  "Taste, strain if you like it clear, and serve over ice.",
]

[[recipe]]
id = "01a188e4-2cfb-734d-93ac-3a01af3d592b"
name = "Thandai"
serves = 4
prep_minutes = 15
cook_minutes = 10
ingredients = [
  { id = "milk", amount = 1, unit = "l" },
  { id = "almonds", amount = 30, unit = "g" },
  { id = "cashews", amount = 15, unit = "g" },
  { id = "melon-seeds", amount = 1, unit = "tbsp" },
  { id = "poppy-seeds", amount = 1, unit = "tbsp" },
  { id = "fennel-seeds", amount = 1, unit = "tbsp" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "green-cardamom", amount = 6, unit = "piece" },
  { id = "saffron", amount = 1, unit = "pinch" },
  { id = "rose-water", amount = 1, unit = "tsp" },
  { id = "sugar", amount = 0.5, unit = "cup" },
]
steps = [
  "Put the almonds, cashews, melon seeds, poppy seeds, fennel seeds, black pepper and green cardamom in a bowl. Cover with a little of the milk and soak for 4 hours.",
  "Grind them to a very fine paste.",
  "Warm the rest of the milk with the sugar and saffron, stirring, until the sugar dissolves. Let it cool.",
  "Stir in the paste, then strain through a fine sieve, pressing to get all the liquid out.",
  "Stir in the rose water and chill well before serving.",
]
