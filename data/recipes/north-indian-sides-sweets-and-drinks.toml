[[recipe]]
id = "01a15175-3c13-7e43-b346-d7c2279e5e6b"
name = "Rice kheer"
serves = 4
prep_minutes = 5
cook_minutes = 40
ingredients = [
  { id = "rice", amount = 50, unit = "g" },
  { id = "milk", amount = 1, unit = "l" },
  { id = "sugar", amount = 0.333, unit = "cup" },
  { id = "green-cardamom", amount = 4, unit = "piece" },
]
steps = [
  "Rinse the rice and soak it for 15 minutes, then drain.",
  "Bring the milk to a boil in a heavy pan over medium heat, stirring so it doesn't catch.",
  "Add the rice and lower the heat. Simmer for 30 to 35 minutes, stirring every few minutes and scraping the bottom, until the rice is very soft and the milk has thickened and turned creamy.",
  "Crush the green cardamom and take out the seeds. Grind them to a powder.",
  "Stir in the sugar and cardamom and simmer for 5 minutes, until the sugar dissolves.",
  "Serve warm, or chill for a few hours and serve cold. It thickens as it cools.",
]

