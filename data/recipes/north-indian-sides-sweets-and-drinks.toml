id = "01a188e4-2cf6-7b18-9459-f97d106e2641"
name = "Mango lassi"
serves = 2
prep_minutes = 5
cook_minutes = 0
ingredients = [
  { id = "mango", amount = 1, unit = "large" },
  { id = "curd", amount = 1, unit = "cup" },
  { id = "milk", amount = 0.5, unit = "cup" },
  { id = "sugar", amount = 2, unit = "tbsp" },
  { id = "green-cardamom", amount = 2, unit = "piece" },
]
steps = [
  "Peel the ripe mango and cut the flesh off the stone.",
  "Crush the green cardamom and grind the seeds.",
