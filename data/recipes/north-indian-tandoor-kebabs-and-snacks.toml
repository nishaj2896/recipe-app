ingredients = [
  { id = "paneer", amount = 300, unit = "g" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "bell-pepper", amount = 0.5, unit = "medium" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "ginger", amount = 10, unit = "g" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "turmeric", amount = 0.25, unit = "tsp" },
  { id = "red-chilli-powder", amount = 0.5, unit = "tsp" },
  { id = "pav-bhaji-masala", amount = 1, unit = "tsp" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Crumble the paneer into a bowl with your fingertips until it looks like coarse crumbs, with no lumps bigger than a pea.",
  "Finely chop the onion, tomato and bell pepper. Slit and chop the green chillies, and grate the ginger.",
  "Melt the butter in a wide pan over medium heat. Add the cumin seeds and wait until they sizzle and darken by a shade, about 30 seconds.",
  "Add the onion and green chillies. Stir now and then for 5 to 6 minutes, until the onion turns soft and light golden at the edges.",
  "Add the ginger and stir for about 1 minute, until its sharp raw smell is gone.",
  "Add the tomato, turmeric and salt. Cook for 4 to 5 minutes, pressing the tomato with the back of the spoon, until it breaks down into a soft, jammy mass.",
  "Lower the heat and stir in the red chilli powder and pav bhaji masala. Cook for 1 to 2 minutes, until the masala smells toasted, butter glistens at its edges and it starts to pull away from the sides of the pan.",
  "Add the bell pepper and cook for 2 minutes, until it softens slightly but still has some crunch.",
  "Add the paneer and fold it gently through the masala for 2 minutes, until it is evenly coloured and hot. Don't cook it longer, or it turns dry and rubbery.",
  "Taste and adjust the salt. Turn off the heat, scatter the coriander leaves over and serve hot with rotis or parathas.",
]
