  "Rub the ghee into the all-purpose flour with the carom seeds and salt, add the water and knead into a stiff dough. Rest for 15 minutes.",
  "Roll the dough thin, cut small rounds, prick them with a fork and fry in the hot oil on low heat until crisp and pale golden. These are the papdi.",
