[[recipe]]
id = "01a188aa-f1bb-7de8-bf53-445fbba68aca"
name = "Tandoori chicken"
serves = 4
prep_minutes = 270
cook_minutes = 35
ingredients = [
  { id = "chicken", amount = 1, unit = "kg" },
  { id = "curd", amount = 0.75, unit = "cup" },
  { id = "lemon", amount = 1, unit = "medium" },
  { id = "ginger-garlic-paste", amount = 2, unit = "tbsp" },
  { id = "kashmiri-chilli-powder", amount = 1, unit = "tbsp" },
  { id = "tandoori-masala", amount = 1, unit = "tbsp" },
  { id = "garam-masala", amount = 1, unit = "tsp" },
  { id = "mustard-oil", amount = 2, unit = "tbsp" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "chaat-masala", amount = 1, unit = "tsp" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use bone-in legs and thighs. Make deep cuts to the bone, rub with half the lemon juice, the Kashmiri chilli powder and salt and rest for 30 minutes.",
  "Whisk the hung or thick curd with the ginger garlic paste, tandoori masala, garam masala and mustard oil. Coat the chicken well, pushing the marinade into the cuts, and refrigerate for at least 4 hours.",
  "Heat the oven to its highest setting, around 240 °C, with a rack over a tray.",
  "Roast the chicken on the rack for 25 to 30 minutes, turning once and basting with the melted butter, until charred at the edges and cooked through.",
  "Sprinkle with the chaat masala and the rest of the lemon juice and serve with the onion cut into rings.",
]

