[[recipe]]
id = "01a188aa-f1c8-7e46-bac6-1c917b930b0f"
name = "Galouti kebab"
serves = 4
prep_minutes = 25
cook_minutes = 30
plan_ahead = { wait_minutes = 240, note = "marinate for 4 hours" }
ingredients = [
  { id = "lamb-mince", amount = 500, unit = "g" },
  { id = "raw-papaya", amount = 2, unit = "tbsp" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "ginger-garlic-paste", amount = 1, unit = "tbsp" },
  { id = "gram-flour", amount = 2, unit = "tbsp" },
  { id = "saffron", amount = 1, unit = "pinch" },
  { id = "kewra-water", amount = 1, unit = "tsp" },
  { id = "green-cardamom", amount = 4, unit = "piece" },
  { id = "cloves", amount = 3, unit = "piece" },
  { id = "mace", amount = 1, unit = "pinch" },
  { id = "nutmeg", amount = 1, unit = "pinch" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "red-chilli-powder", amount = 1, unit = "tsp" },
  { id = "ghee", amount = 5, unit = "tbsp" },
  { id = "milk", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Peel and grate the raw papaya to a paste. Mix it with the lamb mince, ginger garlic paste and salt and refrigerate for 4 hours. The raw papaya makes the meat very soft.",
  "Thinly slice the onions. Fry them in half the ghee over medium heat for 12 minutes, until deep brown and crisp. Drain and crush them.",
  "Toast the gram flour in a dry pan for 2 minutes, until nutty. Soak the saffron in the warm milk.",
  "Grind the green cardamom, cloves, mace, nutmeg and black pepper to a fine powder.",
  "Pass the mince through a grinder or pound it until it becomes a smooth, almost silky paste.",
  "Mix in the onions, gram flour, spice powder, red chilli powder, saffron milk and kewra water. Chill for 30 minutes.",
  "With wet hands, shape small flat patties. They are very soft, so handle them gently.",
  "Heat the rest of the ghee in a heavy pan over medium-low heat. Fry the patties for 2 to 3 minutes on each side, until a deep brown crust forms. Turn them only once.",
  "Serve hot.",
]

[[recipe]]
id = "01a188aa-f1ca-74c1-976b-a15fbbe73ec2"
name = "Shami kebab"
serves = 4
prep_minutes = 15
cook_minutes = 60
ingredients = [
  { id = "lamb-mince", amount = 500, unit = "g" },
  { id = "chana-dal", amount = 0.25, unit = "cup" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "ginger", amount = 15, unit = "g" },
  { id = "garlic", amount = 6, unit = "clove" },
  { id = "dried-red-chillies", amount = 3, unit = "piece" },
  { id = "black-cardamom", amount = 1, unit = "piece" },
  { id = "green-cardamom", amount = 3, unit = "piece" },
  { id = "cloves", amount = 4, unit = "piece" },
  { id = "cinnamon-sticks", amount = 1, unit = "piece" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "egg", amount = 1, unit = "piece" },
  { id = "mint", amount = 2, unit = "tbsp" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "oil", amount = 4, unit = "tbsp" },
  { id = "salt", to_taste = true },
