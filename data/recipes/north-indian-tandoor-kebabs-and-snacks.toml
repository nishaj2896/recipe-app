serves = 4
prep_minutes = 30
cook_minutes = 25
ingredients = [
  { id = "all-purpose-flour", amount = 1, unit = "cup" },
  { id = "carom-seeds", amount = 0.25, unit = "tsp" },
  { id = "ghee", amount = 2, unit = "tbsp" },
  { id = "potato", amount = 2, unit = "medium" },
  { id = "chickpeas", amount = 0.5, unit = "cup" },
  { id = "curd", amount = 1.5, unit = "cup" },
  { id = "sugar", amount = 1, unit = "tbsp" },
  { id = "green-chutney", amount = 4, unit = "tbsp" },
  { id = "tamarind-chutney", amount = 4, unit = "tbsp" },
  { id = "sev", amount = 0.5, unit = "cup" },
  { id = "pomegranate", amount = 0.25, unit = "cup" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "chaat-masala", amount = 1, unit = "tsp" },
  { id = "red-chilli-powder", amount = 0.5, unit = "tsp" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 2, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.25, unit = "cup" },
]
