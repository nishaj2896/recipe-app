[[recipe]]
id = "01a188aa-f1d8-72f8-b06b-92069ff0ac6b"
name = "Samosa"
serves = 4
prep_minutes = 25
cook_minutes = 45
ingredients = [
  { id = "all-purpose-flour", amount = 2, unit = "cup" },
  { id = "carom-seeds", amount = 0.5, unit = "tsp" },
  { id = "ghee", amount = 4, unit = "tbsp" },
  { id = "potato", amount = 4, unit = "medium" },
  { id = "peas", amount = 0.5, unit = "cup" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "ginger", amount = 15, unit = "g" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "coriander-seeds", amount = 1, unit = "tsp" },
  { id = "garam-masala", amount = 1, unit = "tsp" },
  { id = "dry-mango-powder", amount = 1, unit = "tsp" },
  { id = "red-chilli-powder", amount = 0.5, unit = "tsp" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 3, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Mix the all-purpose flour with the carom seeds and salt. Add the ghee and rub it in with your fingertips until the flour holds together when pressed in your fist.",
  "Add the water a little at a time and knead into a stiff, smooth dough. Cover and rest for 30 minutes.",
  "Boil the potatoes until tender, peel and crumble them roughly. Grate the ginger, chop the green chillies and lightly crush the coriander seeds.",
  "Heat a spoonful of the oil in a pan over medium heat. Add the cumin seeds and coriander seeds and let them sizzle for 20 seconds.",
  "Add the ginger, green chillies and peas and cook for 3 minutes.",
  "Add the potatoes, garam masala, dry mango powder, red chilli powder and salt and mix well for 2 minutes. Stir in the coriander leaves and let the filling cool.",
  "Divide the dough into golf-ball-sized balls. Roll each into an oval about 2 mm thick and cut it in half.",
  "Fold each half into a cone, sealing the seam with a little water. Fill it, then pinch the top closed.",
  "Heat the rest of the oil over low heat until just warm. Add the samosas; they should sink and only a few small bubbles should rise.",
  "Fry on low heat for 12 to 15 minutes, turning, until the pastry is firm, blistered and golden. Hot oil makes them bubbly and soft. Drain and serve hot.",
