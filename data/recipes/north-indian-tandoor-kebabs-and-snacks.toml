[[recipe]]
id = "01a188aa-f1bb-7de8-bf53-445fbba68aca"
name = "Tandoori chicken"
serves = 4
prep_minutes = 20
cook_minutes = 35
plan_ahead = { wait_minutes = 240, note = "marinate for 4 hours" }
ingredients = [
  { id = "chicken", amount = 1, unit = "kg" },
  { id = "curd", amount = 0.75, unit = "cup" },
  { id = "lemon", amount = 1, unit = "medium" },
  { id = "ginger-garlic-paste", amount = 2, unit = "tbsp" },
  { id = "kashmiri-chilli-powder", amount = 1, unit = "tbsp" },
  { id = "tandoori-masala", amount = 1, unit = "tbsp" },
  { id = "garam-masala", amount = 1, unit = "tsp" },
  { id = "mustard-oil", amount = 2, unit = "tbsp" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "chaat-masala", amount = 1, unit = "tsp" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use bone-in legs and thighs, skin removed. Make 2 or 3 deep cuts in each piece, right down to the bone.",
  "Rub the chicken with half the lemon juice, the Kashmiri chilli powder and salt, working it into the cuts. Leave for 30 minutes.",
  "Whisk the thick curd with the ginger garlic paste, tandoori masala, garam masala and mustard oil until smooth.",
  "Coat the chicken in the marinade, pushing it into the cuts, and refrigerate for at least 4 hours, or overnight.",
  "Take the chicken out of the fridge 30 minutes before cooking. Heat the oven to its highest setting, around 240 °C, with a rack set over a tray.",
  "Arrange the chicken on the rack with space between the pieces. Roast for 15 minutes.",
  "Turn the pieces, brush them with the melted butter and roast for 10 to 15 minutes more, until charred at the edges and the juices run clear when you pierce the thickest part.",
  "Cut the onion into rings. Sprinkle the chicken with the chaat masala and the rest of the lemon juice and serve hot with the onion.",
]

[[recipe]]
id = "01a188aa-f1be-73ed-a585-cf2dc55a06d0"
name = "Chicken tikka"
serves = 4
prep_minutes = 15
cook_minutes = 20
plan_ahead = { wait_minutes = 120, note = "marinate for 2 hours" }
ingredients = [
  { id = "chicken", amount = 600, unit = "g" },
  { id = "curd", amount = 0.5, unit = "cup" },
  { id = "gram-flour", amount = 1, unit = "tbsp" },
  { id = "ginger-garlic-paste", amount = 1.5, unit = "tbsp" },
  { id = "kashmiri-chilli-powder", amount = 2, unit = "tsp" },
  { id = "garam-masala", amount = 1, unit = "tsp" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "lemon", amount = 1, unit = "medium" },
  { id = "mustard-oil", amount = 2, unit = "tbsp" },
  { id = "butter", amount = 1, unit = "tbsp" },
  { id = "chaat-masala", amount = 1, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Cut boneless chicken thighs into 4 cm cubes. Rub them with half the lemon juice and salt and leave for 15 minutes.",
  "Toast the gram flour in a dry pan over low heat for 2 minutes, stirring, until it smells nutty. Let it cool.",
  "Whisk the gram flour into the curd with the ginger garlic paste, Kashmiri chilli powder, garam masala, cumin powder and mustard oil until smooth.",
  "Coat the chicken in the marinade and refrigerate for at least 2 hours.",
  "Heat the oven or grill to 240 °C. Thread the chicken onto skewers, leaving a little space between the pieces.",
  "Cook for 6 to 7 minutes, then turn, brush with the melted butter and cook for 6 to 8 minutes more, until charred in spots and cooked through.",
  "Sprinkle with the chaat masala and the rest of the lemon juice and serve hot.",
]

[[recipe]]
id = "01a188aa-f1c1-73fb-9543-fd72dee5304c"
name = "Chicken malai tikka"
serves = 4
prep_minutes = 15
cook_minutes = 20
plan_ahead = { wait_minutes = 120, note = "marinate for 2 hours" }
ingredients = [
  { id = "chicken", amount = 600, unit = "g" },
  { id = "hung-curd", amount = 0.5, unit = "cup" },
  { id = "cream", amount = 4, unit = "tbsp" },
  { id = "cream-cheese", amount = 50, unit = "g" },
  { id = "cashews", amount = 20, unit = "g" },
  { id = "ginger-garlic-paste", amount = 1, unit = "tbsp" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "white-pepper", amount = 0.5, unit = "tsp" },
  { id = "green-cardamom", amount = 4, unit = "piece" },
  { id = "nutmeg", amount = 1, unit = "pinch" },
  { id = "lemon", amount = 0.5, unit = "medium" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Cut boneless chicken into 4 cm cubes. Rub them with the ginger garlic paste, lemon juice, white pepper and salt and leave for 20 minutes.",
  "Crack open the green cardamom and take out the seeds.",
  "Grind the cashews with the green chillies, cardamom seeds and a splash of the cream to a smooth paste.",
  "Whisk the hung curd, cream cheese, the rest of the cream, the nutmeg and the cashew paste until smooth and thick.",
  "Coat the chicken in the marinade and refrigerate for 2 hours.",
  "Heat the oven or grill to 230 °C. Thread the chicken onto skewers.",
  "Cook for 12 to 15 minutes, turning once and basting with the melted butter, until just golden in spots and cooked through. Keep it pale; this tikka should be creamy and juicy, not charred.",
  "Serve hot.",
]

[[recipe]]
id = "01a188aa-f1c3-75fe-a474-6b5c552d8ff7"
name = "Chicken seekh kebab"
serves = 4
prep_minutes = 15
cook_minutes = 20
ingredients = [
  { id = "chicken-mince", amount = 500, unit = "g" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "ginger-garlic-paste", amount = 1, unit = "tbsp" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "coriander-leaves", amount = 3, unit = "tbsp" },
  { id = "mint", amount = 2, unit = "tbsp" },
  { id = "garam-masala", amount = 1, unit = "tsp" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "kashmiri-chilli-powder", amount = 1, unit = "tsp" },
  { id = "breadcrumbs", amount = 2, unit = "tbsp" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "lemon", amount = 0.5, unit = "medium" },
  { id = "salt", to_taste = true },
]
steps = [
  "Grate the onion and squeeze out its juice with your hands. Finely chop the green chillies, coriander leaves and mint.",
  "Put the chicken mince in a bowl with the onion, herbs, ginger garlic paste, garam masala, cumin powder, Kashmiri chilli powder, breadcrumbs and salt.",
  "Knead for 3 minutes, until the mixture turns sticky and holds together. Chill for 30 minutes so it firms up.",
  "Heat the oven or grill to 230 °C. Divide the mixture into portions about the size of a golf ball.",
  "With wet hands, press each portion around a flat skewer into a long, even kebab about 2 cm thick.",
  "Cook for 12 to 15 minutes, turning every few minutes and brushing with the melted butter, until browned all over and firm when pressed.",
  "Slide the kebabs off the skewers, squeeze over the lemon juice and serve hot.",
]

[[recipe]]
