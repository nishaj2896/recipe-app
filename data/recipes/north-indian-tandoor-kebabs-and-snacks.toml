  "Put the lamb mince, dal, ginger, garlic, dried red chillies, black cardamom, green cardamom, cloves, cinnamon, black pepper, salt and the water in a pan.",
  "Bring to a boil and simmer uncovered for 40 minutes, stirring now and then, until the dal is soft and all the water has dried up. The mixture must be dry, or the kebabs will break.",
