[[recipe]]
id = "01a18c0c-0cab-74d1-84e6-cbf6625fa8ec"
name = "Pad thai"
serves = 2
prep_minutes = 20
cook_minutes = 12
image = { file = "01a18c0c-0cab-74d1-84e6-cbf6625fa8ec.webp", sha256 = "061b45044f07f5bd38a6cc58ae21492bece0b8096e39f90691fa4b8fdb890456", alt = "Pad thai with prawns, tofu, bean sprouts and a lime wedge" }
ingredients = [
  { id = "flat-rice-noodles", amount = 200, unit = "g" },
  { id = "prawns", amount = 200, unit = "g" },
  { id = "tofu", amount = 100, unit = "g" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "bean-sprouts", amount = 1, unit = "cup" },
  { id = "chives", amount = 0.5, unit = "cup" },
  { id = "peanuts", amount = 3, unit = "tbsp" },
  { id = "tamarind", amount = 1, unit = "tbsp" },
  { id = "fish-sauce", amount = 2, unit = "tbsp" },
  { id = "palm-sugar", amount = 2, unit = "tbsp" },
  { id = "chilli-flakes", amount = 0.5, unit = "tsp" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "shallot", amount = 2, unit = "piece" },
  { id = "lime", amount = 1, unit = "medium" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Soak the rice noodles in warm tap water for 20 to 30 minutes, until bendy but still firm. Drain.",
  "Soak the tamarind in the water, hot, for 10 minutes, squeeze and strain. Stir in the fish sauce and palm sugar until dissolved.",
  "Peel and devein the prawns. Cut the tofu into small cubes, chop the garlic and shallots, cut the chives into lengths about 4 cm and crush the peanuts.",
  "Heat the oil in a wok over high heat. Fry the tofu for 3 minutes, until golden. Add the garlic, shallots and prawns and stir-fry for 2 minutes, until the prawns turn pink.",
  "Push everything to the side, crack in the eggs and scramble for 30 seconds, until just set.",
  "Add the noodles and the tamarind sauce and toss for 2 to 3 minutes, until the noodles soften and absorb the sauce. Add a splash of water if they stick.",
  "Toss in the bean sprouts, chives and chilli flakes for 30 seconds. Taste and balance so it is sweet, sour and salty. Serve with the peanuts and lime wedges.",
]

[[recipe]]
id = "01a18c0c-0cad-740d-8f61-ea9172a571f5"
name = "Green curry with chicken"
serves = 4
prep_minutes = 15
cook_minutes = 25
ingredients = [
  { id = "chicken", amount = 500, unit = "g" },
  { id = "thai-curry-paste", amount = 3, unit = "tbsp" },
  { id = "coconut-milk", amount = 2, unit = "cup" },
  { id = "small-brinjal", amount = 6, unit = "piece" },
  { id = "bamboo-shoots", amount = 0.5, unit = "cup" },
  { id = "makrut-lime-leaves", amount = 4, unit = "leaf" },
  { id = "thai-basil", amount = 0.5, unit = "cup" },
  { id = "birds-eye-chillies", amount = 2, unit = "piece" },
  { id = "fish-sauce", amount = 2, unit = "tbsp" },
  { id = "palm-sugar", amount = 1, unit = "tbsp" },
  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "chicken-stock", amount = 0.5, unit = "cup" },
]
steps = [
  "Use boneless chicken thighs and slice them thinly. Quarter the small brinjals and slice the bird's eye chillies.",
  "Heat the oil in a wok or pan over medium heat. Spoon in the thick layer from the top of the coconut milk and simmer for 2 to 3 minutes, until it splits and the oil shows.",
