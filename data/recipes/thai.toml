  "Add the chicken and stir for 3 minutes, until it is coated and no longer pink outside.",
  "Pour in the rest of the coconut milk and the chicken stock. Add the small brinjals, bamboo shoots and torn makrut lime leaves and simmer for 10 to 12 minutes, until the chicken is cooked and the small brinjals are tender.",
