  { id = "soy-sauce", amount = 3, unit = "tbsp" },
  { id = "lime", amount = 2, unit = "medium" },
  { id = "honey", amount = 1, unit = "tbsp" },
  { id = "sriracha", amount = 1, unit = "tbsp" },
  { id = "garlic", amount = 2, unit = "clove" },
