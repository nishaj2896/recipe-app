  "Add the potatoes, onion and peanuts and simmer for 20 to 25 minutes, until the potatoes are tender and the beef falls apart.",
  "Season with the tamarind liquid, fish sauce and palm sugar. The curry should be rich, sweet, salty and slightly sour.",
  "Taste and adjust, then serve hot.",
]

