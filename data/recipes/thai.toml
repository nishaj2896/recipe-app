[[recipe]]
id = "01a18c0c-0cb2-7c90-af98-3af5b60de70e"
name = "Massaman curry"
serves = 4
prep_minutes = 20
cook_minutes = 120
ingredients = [
  { id = "beef", amount = 750, unit = "g" },
  { id = "potato", amount = 3, unit = "medium" },
  { id = "onion", amount = 1, unit = "large" },
  { id = "peanuts", amount = 0.33, unit = "cup" },
  { id = "thai-curry-paste", amount = 3, unit = "tbsp" },
  { id = "ground-cinnamon", amount = 0.5, unit = "tsp" },
  { id = "green-cardamom", amount = 4, unit = "piece" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "coconut-milk", amount = 3, unit = "cup" },
  { id = "tamarind", amount = 1, unit = "tbsp" },
  { id = "fish-sauce", amount = 2, unit = "tbsp" },
