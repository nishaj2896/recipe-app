  "Peel the green papaya, halve it and scrape out the seeds. Shred the flesh into long, thin strands with a julienne peeler or the coarse side of a grater.",
  "Dry-roast the peanuts in a pan for 4 minutes, until golden. Cut the green beans into lengths about 3 cm and halve the cherry tomatoes.",
  "Pound the garlic and bird's eye chillies in a large mortar to a rough paste. Add the dried shrimp and peanuts and pound lightly.",
  "Add the palm sugar, fish sauce and lime juice and stir until the palm sugar dissolves.",
  "Add the green beans and cherry tomatoes and bruise them lightly. Add the green papaya and pound gently while turning with a spoon for 1 minute, until it softens slightly and soaks up the dressing.",
  "Taste and balance the sour, salty, sweet and hot. Serve straight away.",
]

[[recipe]]
id = "01a18c0c-0ccb-799c-9cbf-2de39f21d098"
name = "Larb"
serves = 4
prep_minutes = 15
cook_minutes = 10
ingredients = [
  { id = "chicken-mince", amount = 500, unit = "g" },
  { id = "glutinous-rice", amount = 2, unit = "tbsp" },
  { id = "shallot", amount = 3, unit = "piece" },
  { id = "mint", amount = 0.5, unit = "cup" },
  { id = "coriander-leaves", amount = 0.5, unit = "cup" },
  { id = "spring-onions", amount = 3, unit = "piece" },
  { id = "lime", amount = 2, unit = "medium" },
  { id = "fish-sauce", amount = 2, unit = "tbsp" },
  { id = "chilli-flakes", amount = 1, unit = "tsp" },
  { id = "lettuce", amount = 1, unit = "small-head" },
  { id = "water", amount = 3, unit = "tbsp" },
]
steps = [
  "Dry-roast the glutinous rice in a pan over medium-low heat for 6 to 8 minutes, stirring, until deep golden and nutty. Grind to a coarse powder.",
  "Thinly slice the shallots and spring onions. Pick the mint and coriander leaves. Separate the lettuce leaves.",
  "Cook the chicken mince with the water in a pan over medium heat for 5 to 6 minutes, breaking it up, until just cooked through. Take it off the heat.",
  "Stir in the fish sauce, lime juice and chilli flakes while it is warm.",
  "Fold in the shallots, spring onions, mint, coriander leaves and most of the ground glutinous rice.",
