[[recipe]]
id = "01a18c0c-0cd2-773b-9416-1958680405f1"
name = "Mango sticky rice"
serves = 4
prep_minutes = 10
cook_minutes = 30
plan_ahead = { wait_minutes = 240, note = "soak for 4 hours" }
ingredients = [
  { id = "glutinous-rice", amount = 1, unit = "cup" },
  { id = "coconut-milk", amount = 1.5, unit = "cup" },
  { id = "sugar", amount = 0.33, unit = "cup" },
  { id = "mango", amount = 2, unit = "large" },
  { id = "sesame-seeds", amount = 1, unit = "tsp" },
  { id = "cornflour", amount = 1, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Rinse the glutinous rice well, then soak it for at least 4 hours. Drain.",
  "Line a steamer basket with a damp cloth, spread the glutinous rice in it and steam for 20 to 25 minutes, until translucent, sticky and tender.",
  "Meanwhile, warm most of the coconut milk with most of the sugar and a little salt in a pan over low heat for 3 minutes, stirring, until the sugar dissolves.",
  "Tip the hot glutinous rice into a bowl, pour the warm sweet coconut milk over, stir and cover. Leave for 20 minutes to soak it up.",
  "Heat the rest of the coconut milk with the rest of the sugar, a little salt and the cornflour for 2 minutes, stirring, until slightly thick. Toast the sesame seeds in a dry pan for 2 minutes.",
  "Peel the mangoes and slice the flesh off the stones. Serve the sticky rice with the mango, drizzled with the thick coconut milk sauce and sprinkled with the sesame seeds.",
]

[[recipe]]
id = "01a18c0c-0cd4-7ffe-9d0e-415bcdd7df9d"
name = "Thai fish cakes"
serves = 4
prep_minutes = 20
cook_minutes = 15
ingredients = [
  { id = "basa", amount = 400, unit = "g" },
  { id = "thai-curry-paste", amount = 2, unit = "tbsp" },
  { id = "egg", amount = 1, unit = "large" },
  { id = "french-beans", amount = 50, unit = "g" },
  { id = "makrut-lime-leaves", amount = 4, unit = "leaf" },
  { id = "fish-sauce", amount = 1, unit = "tbsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "sweet-chilli-sauce", amount = 0.25, unit = "cup" },
  { id = "cucumber", amount = 0.5, unit = "small" },
  { id = "oil", amount = 1, unit = "cup" },
]
steps = [
  "Cut the basa into chunks and pat dry. Pulse it in a food processor with the red curry paste, egg, fish sauce and sugar until it forms a smooth, sticky paste.",
  "Thinly slice the green beans into rounds. Roll the makrut lime leaves tightly and slice them into fine threads. Mix both into the fish paste.",
  "With wet hands, shape into flat cakes about 6 cm across and 1 cm thick.",
  "Heat the oil in a frying pan over medium heat. Fry the cakes in batches for 2 to 3 minutes per side, until puffed, golden and cooked through. Drain.",
  "Finely dice the cucumber and stir it into the sweet chilli sauce.",
  "Serve the fish cakes hot with the cucumber dipping sauce.",
]

[[recipe]]
id = "01a18c0c-0cd7-7285-97cc-18da54cdf186"
name = "Glass noodle salad"
serves = 4
prep_minutes = 20
cook_minutes = 10
ingredients = [
  { id = "glass-noodles", amount = 150, unit = "g" },
  { id = "prawns", amount = 200, unit = "g" },
  { id = "pork", amount = 150, unit = "g" },
  { id = "shallot", amount = 2, unit = "piece" },
  { id = "cherry-tomatoes", amount = 8, unit = "piece" },
  { id = "celery", amount = 1, unit = "piece" },
  { id = "coriander-leaves", amount = 0.5, unit = "cup" },
  { id = "birds-eye-chillies", amount = 2, unit = "piece" },
  { id = "lime", amount = 2, unit = "medium" },
  { id = "fish-sauce", amount = 2, unit = "tbsp" },
  { id = "sugar", amount = 1, unit = "tbsp" },
  { id = "peanuts", amount = 2, unit = "tbsp" },
  { id = "water", amount = 2, unit = "l" },
]
steps = [
  "Soak the glass noodles in warm tap water for 10 minutes, until soft. Drain and cut them into shorter lengths with scissors.",
  "Peel and devein the prawns. Thinly slice the shallots and celery, halve the cherry tomatoes and finely chop the bird's eye chillies.",
  "Whisk the lime juice, fish sauce, sugar and bird's eye chillies until the sugar dissolves.",
  "Bring the water to a boil. Cook the prawns for 2 minutes, until pink, and lift them out. Cook the minced pork in the same water for 2 minutes, stirring, until just cooked, and lift it out. Blanch the noodles for 30 seconds and drain.",
  "Toss the warm noodles, prawns and pork with the dressing, then add the shallots, celery, cherry tomatoes and coriander leaves.",
  "Taste and balance so it is sour, salty, sweet and hot. Top with the crushed peanuts and serve.",
]
