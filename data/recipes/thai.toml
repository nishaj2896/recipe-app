[[recipe]]
id = "01a18c0c-0cbe-7287-819a-154eb608ae68"
name = "Pad see ew"
serves = 2
prep_minutes = 15
cook_minutes = 10
ingredients = [
  { id = "flat-rice-noodles", amount = 250, unit = "g" },
  { id = "chicken", amount = 200, unit = "g" },
  { id = "broccoli", amount = 1, unit = "small" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "soy-sauce", amount = 1, unit = "tbsp" },
  { id = "dark-soy-sauce", amount = 1, unit = "tbsp" },
  { id = "oyster-sauce", amount = 1.5, unit = "tbsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "white-pepper", amount = 0.25, unit = "tsp" },
  { id = "oil", amount = 3, unit = "tbsp" },
]
steps = [
  "Use fresh wide rice noodles if you can. Separate the strands gently. If using dried ones, soak them for 30 minutes, until soft, and drain.",
  "Slice the chicken thinly, cut the broccoli into small florets and slice the stems, and chop the garlic. Mix the soy sauce, dark soy sauce, oyster sauce and sugar.",
