  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "water", amount = 1.5, unit = "cup" },
]
steps = [
  "Cut the beef into cubes about 4 cm across. Peel the potatoes and cut them into chunks. Cut the onion into wedges. Soak the tamarind in a little of the water, hot, then squeeze and strain.",
  "Dry-roast the peanuts in a pan for 4 minutes, until golden. Lightly crush the cardamom.",
