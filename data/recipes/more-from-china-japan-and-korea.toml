prep_minutes = 20
cook_minutes = 10
ingredients = [
  { id = "lamb", amount = 750, unit = "g" },
  { id = "cumin-seeds", amount = 2, unit = "tbsp" },
  { id = "chilli-flakes", amount = 2, unit = "tsp" },
  { id = "sichuan-peppercorns", amount = 0.5, unit = "tsp" },
  { id = "onion", amount = 0.5, unit = "medium" },
  { id = "sesame-seeds", amount = 1, unit = "tbsp" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use lamb shoulder or leg with some fat. Cut it into cubes about 2 cm across.",
  "Grate the onion and squeeze its juice over the lamb with the oil and salt. Leave for 30 minutes.",
  "Toast the cumin seeds and sichuan peppercorns in a dry pan for 1 to 2 minutes, until fragrant. Grind them coarsely and mix with the chilli flakes and sesame seeds.",
  "Thread the lamb onto skewers, alternating lean and fatty pieces.",
  "Grill over high heat on a barbecue or griddle pan for 6 to 8 minutes, turning, sprinkling generously with the spice mix as they cook, until charred outside and still juicy inside.",
  "Taste one and add more salt or spice. Serve straight away.",
]

[[recipe]]
id = "01a18c22-48ec-795d-ade5-e799ee17b297"
