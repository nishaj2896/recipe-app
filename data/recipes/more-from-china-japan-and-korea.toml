[[recipe]]
id = "01a18c22-48f1-7d28-9510-10fa5d26b58e"
name = "Chawanmushi"
serves = 4
prep_minutes = 15
cook_minutes = 20
ingredients = [
  { id = "egg", amount = 3, unit = "large" },
  { id = "kombu", amount = 5, unit = "g" },
  { id = "bonito-flakes", amount = 5, unit = "g" },
  { id = "soy-sauce", amount = 1, unit = "tsp" },
  { id = "mirin", amount = 1, unit = "tsp" },
  { id = "prawns", amount = 4, unit = "piece" },
  { id = "mushroom", amount = 4, unit = "piece" },
  { id = "spring-onions", amount = 1, unit = "piece" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1.5, unit = "cup" },
]
steps = [
  "Warm the kombu in the water over low heat for 8 minutes, until small bubbles form. Lift it out, add the bonito flakes, simmer for 1 minute and strain. Cool the dashi completely.",
  "Beat the eggs gently without making foam. Stir in the cool dashi, soy sauce, mirin and a little salt, then strain through a fine sieve.",
  "Peel and devein the prawns and slice the mushrooms. Divide them between small heatproof cups.",
  "Pour the egg mixture over and skim off any bubbles. Cover each cup with foil.",
  "Steam over low heat for 15 to 18 minutes, until just set with a slight wobble, like silken custard. Keep the heat gentle so it stays smooth.",
  "Taste one and serve hot with the sliced spring onions on top.",
]

[[recipe]]
id = "01a18c22-48f3-7f62-9b64-c108b0578897"
name = "Zaru soba"
serves = 2
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "soba", amount = 200, unit = "g" },
  { id = "kombu", amount = 5, unit = "g" },
  { id = "bonito-flakes", amount = 5, unit = "g" },
  { id = "soy-sauce", amount = 3, unit = "tbsp" },
  { id = "mirin", amount = 3, unit = "tbsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "nori", amount = 1, unit = "piece" },
  { id = "spring-onions", amount = 2, unit = "piece" },
  { id = "radish", amount = 50, unit = "g" },
  { id = "water", amount = 2.5, unit = "l" },
]
steps = [
  "Warm the kombu in a little of the water over low heat for 8 minutes. Lift it out, add the bonito flakes, simmer for 1 minute and strain.",
  "Stir in the soy sauce, mirin and sugar and simmer for 1 minute. Chill the dipping sauce until cold.",
  "Bring the rest of the water to a boil and cook the soba as the packet says, stirring so it doesn't stick.",
  "Drain and rinse well under the cold tap, rubbing the noodles to remove the starch. Drain again.",
  "Slice the spring onions thinly, grate the radish and cut the nori into thin strips.",
  "Taste the dipping sauce. Pile the soba on plates, top with the nori and serve with the cold sauce, spring onions and radish to stir in.",
]

[[recipe]]
id = "01a18c22-48f6-7627-a079-c1dbf711d029"
name = "Japanese curry rice"
serves = 4
prep_minutes = 15
cook_minutes = 45
ingredients = [
  { id = "rice", amount = 1.5, unit = "cup" },
  { id = "chicken", amount = 500, unit = "g" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "carrot", amount = 1, unit = "large" },
  { id = "potato", amount = 2, unit = "medium" },
  { id = "apple", amount = 0.5, unit = "medium" },
  { id = "butter", amount = 3, unit = "tbsp" },
  { id = "all-purpose-flour", amount = 3, unit = "tbsp" },
  { id = "curry-powder", amount = 2, unit = "tbsp" },
  { id = "garam-masala", amount = 1, unit = "tsp" },
  { id = "chicken-stock", amount = 3, unit = "cup" },
  { id = "soy-sauce", amount = 1, unit = "tbsp" },
  { id = "honey", amount = 1, unit = "tbsp" },
  { id = "ketchup", amount = 1, unit = "tbsp" },
  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 2, unit = "cup" },
]
steps = [
  "Rinse the rice and simmer it in the water in a covered pan on low heat for 15 minutes. Rest covered for 10 minutes.",
  "Use boneless chicken thighs and cut them into bite-sized pieces. Slice the onions, and peel and cut the carrot and potatoes into chunks. Grate the apple.",
  "Heat the oil in a pot over medium heat. Fry the onions for 10 minutes, until golden. Add the chicken for 4 minutes.",
  "Add the carrot, potatoes, apple and chicken stock. Simmer for 15 to 20 minutes, until the vegetables are tender.",
  "Meanwhile, melt the butter in a small pan over low heat. Stir in the all-purpose flour for 4 to 5 minutes, until light brown, then the curry powder and garam masala for 30 seconds. This is the roux.",
  "Whisk a ladleful of the hot liquid into the roux until smooth, then stir it into the pot. Simmer for 5 minutes, until thick. Stir in the soy sauce, honey and ketchup and season with salt.",
  "Taste and adjust. Serve the curry beside the rice.",
]

