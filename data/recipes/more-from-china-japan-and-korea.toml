[[recipe]]
id = "01a18c22-48df-729b-a291-7629aa4f0dec"
name = "General Tso's chicken"
serves = 4
prep_minutes = 20
cook_minutes = 20
ingredients = [
  { id = "chicken", amount = 600, unit = "g" },
  { id = "cornflour", amount = 0.5, unit = "cup" },
  { id = "egg", amount = 1, unit = "large" },
  { id = "soy-sauce", amount = 3, unit = "tbsp" },
  { id = "dark-soy-sauce", amount = 1, unit = "tsp" },
  { id = "rice-vinegar", amount = 2, unit = "tbsp" },
  { id = "hoisin-sauce", amount = 1, unit = "tbsp" },
  { id = "sugar", amount = 3, unit = "tbsp" },
  { id = "chicken-stock", amount = 0.5, unit = "cup" },
  { id = "dried-red-chillies", amount = 6, unit = "piece" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "spring-onions", amount = 2, unit = "piece" },
  { id = "sesame-seeds", amount = 1, unit = "tsp" },
  { id = "oil", amount = 2, unit = "cup" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use boneless chicken thighs and cut them into pieces about 3 cm across. Toss with the egg, a spoonful of the soy sauce and a little salt, then coat in most of the cornflour.",
  "Whisk the rest of the soy sauce, the dark soy sauce, rice vinegar, hoisin sauce, sugar, chicken stock and the rest of the cornflour into a sauce.",
  "Heat the oil in a wok or deep pan to 175°C. Fry the chicken in batches for 5 to 6 minutes, until golden and crisp. Drain.",
  "Pour off all but a spoonful of the oil. Fry the dried red chillies, chopped garlic and grated ginger over medium heat for 30 seconds, until fragrant.",
  "Stir the sauce and pour it in. Simmer for 1 minute, until thick and glossy.",
  "Toss in the chicken until coated. Taste and adjust, then scatter the sliced spring onions and sesame seeds over and serve hot.",
]

[[recipe]]
id = "01a18c22-48e1-7de2-85f2-63ffd36590aa"
name = "Yu xiang eggplant"
serves = 4
prep_minutes = 15
cook_minutes = 15
ingredients = [
  { id = "brinjal", amount = 2, unit = "medium" },
  { id = "pork", amount = 150, unit = "g" },
  { id = "doubanjiang", amount = 1, unit = "tbsp" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "spring-onions", amount = 3, unit = "piece" },
  { id = "soy-sauce", amount = 1, unit = "tbsp" },
  { id = "black-vinegar", amount = 1.5, unit = "tbsp" },
  { id = "sugar", amount = 1.5, unit = "tbsp" },
  { id = "cornflour", amount = 1, unit = "tsp" },
  { id = "oil", amount = 0.33, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Use long Chinese eggplants and cut them into batons about 8 cm long. Toss with a little salt and leave for 15 minutes, then pat dry.",
  "Chop the garlic and ginger and slice the spring onions, keeping the green parts separate. Whisk the soy sauce, black vinegar, sugar, cornflour and the water into a sauce.",
  "Heat most of the oil in a wok over medium-high heat. Fry the eggplant in batches for 5 to 6 minutes, until golden and soft. Drain.",
  "Add the rest of the oil and the minced pork and stir-fry for 2 minutes, until it turns pale.",
  "Add the doubanjiang and fry for 1 minute, until the oil turns red. Add the garlic, ginger and white parts of the spring onions for 30 seconds.",
  "Pour in the sauce and return the eggplant. Toss for 1 to 2 minutes, until the sauce is thick and glossy.",
  "Taste and balance the sweet, sour and heat. Scatter the green parts of the spring onions over and serve hot.",
]

[[recipe]]
id = "01a18c22-48e3-7bb4-aa6a-fac7cb727a29"
name = "Twice-cooked pork"
serves = 4
prep_minutes = 10
cook_minutes = 40
ingredients = [
  { id = "pork-belly", amount = 500, unit = "g" },
  { id = "doubanjiang", amount = 1.5, unit = "tbsp" },
  { id = "black-bean-sauce", amount = 1, unit = "tbsp" },
  { id = "leek", amount = 1, unit = "medium" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "soy-sauce", amount = 1, unit = "tsp" },
  { id = "shaoxing-wine", amount = 1, unit = "tbsp" },
  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "water", amount = 6, unit = "cup" },
]
steps = [
  "Put the pork belly in a pot with the water and some of the ginger. Bring to a boil, then simmer for 25 minutes, until cooked through. Cool, then chill for 30 minutes so it slices neatly.",
  "Slice the pork belly as thinly as you can. Slice the leek on the diagonal, the green chillies into rounds and the garlic and the rest of the ginger thinly.",
  "Heat the oil in a wok over medium heat. Fry the pork belly for 4 to 5 minutes, until the fat renders and the slices curl and turn golden.",
  "Push the pork belly aside. Fry the doubanjiang and black bean sauce in the fat for 1 minute, until the oil turns red.",
  "Add the garlic and ginger for 30 seconds, then the shaoxing wine, sugar and soy sauce and toss with the pork belly.",
  "Add the leek and green chillies and toss for 1 to 2 minutes, until just wilted.",
  "Taste and serve hot.",
]

[[recipe]]
id = "01a18c22-48e6-7bf2-b748-f4f37b90bbf6"
name = "Cantonese steamed fish"
serves = 4
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "barramundi", amount = 1, unit = "piece" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "spring-onions", amount = 4, unit = "piece" },
  { id = "soy-sauce", amount = 3, unit = "tbsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "shaoxing-wine", amount = 1, unit = "tbsp" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 3, unit = "tbsp" },
]
steps = [
  "Use a whole barramundi, cleaned and scaled. Pat dry, make 2 deep cuts on each side and rub with a little salt and the shaoxing wine.",
  "Cut half the ginger into slices and the rest into very fine strips. Cut the spring onions into fine strips about 6 cm long.",
  "Lay the ginger slices on a heatproof plate and set the fish on them.",
  "Steam over high heat for 10 to 12 minutes, until the flesh at the thickest part flakes away from the bone. Pour off the liquid on the plate.",
  "Warm the soy sauce, sugar and the water for 1 minute, until the sugar dissolves. Pour it round the fish.",
  "Pile the ginger strips, spring onions and coriander leaves on top. Heat the oil until smoking and pour it over so it sizzles.",
  "Taste the sauce and serve straight away.",
]

[[recipe]]
id = "01a18c22-48e8-70c1-acce-651beee65d3f"
name = "Chinese chicken corn soup"
serves = 4
prep_minutes = 10
cook_minutes = 20
ingredients = [
  { id = "chicken", amount = 250, unit = "g" },
  { id = "sweetcorn", amount = 2, unit = "cup" },
  { id = "chicken-stock", amount = 5, unit = "cup" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "cornflour", amount = 2, unit = "tbsp" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "white-pepper", amount = 0.25, unit = "tsp" },
  { id = "toasted-sesame-oil", amount = 1, unit = "tsp" },
  { id = "spring-onions", amount = 2, unit = "piece" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.25, unit = "cup" },
]
steps = [
  "Finely chop the chicken. Blend half the sweetcorn with a little of the chicken stock until creamy.",
  "Bring the rest of the chicken stock to a simmer with the sliced ginger. Add the chicken, stirring to separate, and simmer for 5 minutes.",
  "Add the blended sweetcorn and the rest of the sweetcorn and simmer for 5 minutes. Lift out the ginger.",
  "Mix the cornflour with the water, stir it in and simmer for 1 minute, until slightly thick.",
  "Beat the eggs. Stir the soup in a circle and pour the eggs in slowly, so they set in thin ribbons.",
  "Season with salt and the white pepper. Taste and adjust, then drizzle with the toasted sesame oil, scatter the sliced spring onions over and serve hot.",
]

[[recipe]]
id = "01a18c22-48ea-7255-85d9-b0e209375471"
name = "Xinjiang lamb skewers"
