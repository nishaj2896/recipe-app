[[recipe]]
id = "01a18c12-058a-7d1f-979e-239d8d907c5e"
name = "Miso soup"
serves = 4
prep_minutes = 5
cook_minutes = 15
ingredients = [
  { id = "miso", amount = 3, unit = "tbsp" },
  { id = "tofu", amount = 200, unit = "g" },
  { id = "wakame", amount = 1, unit = "tbsp" },
  { id = "kombu", amount = 10, unit = "g" },
  { id = "bonito-flakes", amount = 10, unit = "g" },
  { id = "spring-onions", amount = 2, unit = "piece" },
  { id = "water", amount = 4, unit = "cup" },
]
steps = [
  "Put the kombu in the water and warm it over low heat for 8 to 10 minutes, until small bubbles form at the edge. Lift out the kombu before it boils.",
  "Add the bonito flakes, simmer for 1 minute, then take off the heat and leave for 3 minutes, until they sink. Strain the dashi back into the pan.",
  "Soak the wakame for 5 minutes, until it swells, and drain. Cut the tofu into cubes about 1.5 cm across and slice the spring onions.",
  "Bring the dashi to a gentle simmer over low heat. Add the tofu and wakame for 2 minutes, until warmed through.",
  "Put the miso in a ladle, lower it into the soup and whisk with chopsticks until fully dissolved. Do not let the soup boil after this.",
  "Taste and add a little more miso if needed. Scatter the spring onions over and serve straight away.",
]

