[[recipe]]
id = "01a18c12-0583-7039-8ac5-f83074f83c43"
name = "Katsu curry"
serves = 4
prep_minutes = 25
cook_minutes = 45
ingredients = [
  { id = "chicken", amount = 600, unit = "g" },
  { id = "all-purpose-flour", amount = 0.5, unit = "cup" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "panko", amount = 2, unit = "cup" },
  { id = "oil", amount = 2, unit = "cup" },
  { id = "onion", amount = 1, unit = "large" },
  { id = "carrot", amount = 1, unit = "medium" },
  { id = "potato", amount = 1, unit = "medium" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "butter", amount = 3, unit = "tbsp" },
  { id = "curry-powder", amount = 2, unit = "tbsp" },
  { id = "chicken-stock", amount = 3, unit = "cup" },
  { id = "soy-sauce", amount = 1, unit = "tbsp" },
  { id = "honey", amount = 1, unit = "tbsp" },
  { id = "ketchup", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Dice the onion. Peel the carrot and potato and cut them into chunks about 2 cm across. Grate the garlic and ginger.",
  "Melt the butter in a pan over medium heat. Fry the onion for 8 to 10 minutes, until soft and golden.",
  "Add the garlic and ginger for 1 minute. Stir in a quarter of the all-purpose flour and the curry powder and cook for 2 minutes, stirring, until it smells toasty.",
  "Whisk in the chicken stock a little at a time until smooth. Add the carrot and potato, cover and simmer on low heat for 20 to 25 minutes, until the vegetables are tender and the sauce is thick.",
  "Stir in the soy sauce, honey and ketchup and season with salt. Keep warm.",
  "Meanwhile, use boneless chicken breasts and slice each in half horizontally into cutlets about 1.5 cm thick. Season with salt.",
  "Coat the cutlets in the rest of the all-purpose flour, then the beaten eggs, then the panko, pressing it on firmly.",
  "Heat the oil in a deep pan to 170°C. Fry the cutlets in batches for 5 to 6 minutes, turning once, until deep golden and cooked through. Drain on a rack and slice.",
  "Taste the curry sauce and adjust. Spoon it beside the sliced katsu and serve hot.",
]

[[recipe]]
id = "01a18c12-0586-728d-9647-bf6d6d816931"
name = "Oyakodon"
serves = 2
prep_minutes = 10
cook_minutes = 30
ingredients = [
  { id = "rice", amount = 1, unit = "cup" },
  { id = "chicken", amount = 300, unit = "g" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "egg", amount = 3, unit = "large" },
  { id = "kombu", amount = 5, unit = "g" },
  { id = "bonito-flakes", amount = 5, unit = "g" },
  { id = "soy-sauce", amount = 2, unit = "tbsp" },
  { id = "mirin", amount = 2, unit = "tbsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "spring-onions", amount = 1, unit = "piece" },
  { id = "water", amount = 2, unit = "cup" },
]
steps = [
  "Rinse the rice until the rinsing runs clear. Simmer it in half the water in a covered pan on low heat for 15 minutes, then rest covered for 10 minutes.",
  "Meanwhile, put the kombu in the rest of the water and warm it over low heat for 8 to 10 minutes, until small bubbles form. Lift out the kombu, add the bonito flakes, simmer for 1 minute, then strain. This is the dashi.",
  "Use boneless chicken thighs and cut them into pieces about 2 cm across. Slice the onion thinly. Beat the eggs lightly, leaving some streaks of white.",
  "Put the dashi, soy sauce, mirin and sugar in a small frying pan and bring to a simmer over medium heat.",
  "Add the onion and simmer for 3 minutes, until soft. Add the chicken and simmer for 5 to 6 minutes, turning once, until cooked through.",
  "Pour the eggs over in a slow circle. Cover and cook on low heat for 1 to 2 minutes, until the egg is just set but still a little runny.",
  "Spoon the rice into bowls. Taste the sauce, slide the chicken and egg on top with the sauce, scatter the sliced spring onions over and serve straight away.",
]

[[recipe]]
