[[recipe]]
id = "01a18c12-057c-7595-8e84-0c214eda32e4"
name = "Chicken teriyaki"
serves = 4
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "chicken", amount = 600, unit = "g" },
  { id = "soy-sauce", amount = 4, unit = "tbsp" },
  { id = "mirin", amount = 3, unit = "tbsp" },
  { id = "sake", amount = 2, unit = "tbsp" },
  { id = "sugar", amount = 1, unit = "tbsp" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "sesame-seeds", amount = 1, unit = "tsp" },
  { id = "spring-onions", amount = 2, unit = "piece" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use boneless chicken thighs with the skin on. Pat them dry and season lightly with salt. Grate the ginger.",
  "Whisk the soy sauce, mirin, sake, sugar and ginger into a glaze until the sugar dissolves.",
  "Heat the oil in a frying pan over medium heat. Lay the chicken in skin side down and fry for 7 to 8 minutes, pressing gently, until the skin is deep golden and crisp.",
  "Turn the chicken and cook for 4 to 5 minutes, until cooked through with no pink at the centre. Wipe the fat out of the pan with kitchen paper.",
  "Pour in the glaze and let it bubble over medium heat for 2 to 3 minutes, turning the chicken often, until the glaze is thick and shiny and coats each piece.",
  "Toast the sesame seeds in a dry pan for 2 minutes and slice the spring onions.",
  "Slice the chicken, spoon the glaze from the pan over, taste and scatter the sesame seeds and spring onions over. Serve hot.",
]

