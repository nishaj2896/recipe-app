[[recipe]]
id = "01a18c12-05a5-7159-8e6a-b67889e637dd"
name = "Bibimbap"
serves = 4
prep_minutes = 30
cook_minutes = 30
ingredients = [
  { id = "rice", amount = 1.5, unit = "cup" },
  { id = "beef", amount = 250, unit = "g" },
  { id = "spinach", amount = 200, unit = "g" },
  { id = "carrot", amount = 1, unit = "large" },
  { id = "soybean-sprouts", amount = 150, unit = "g" },
  { id = "zucchini", amount = 1, unit = "medium" },
  { id = "mushroom", amount = 150, unit = "g" },
  { id = "egg", amount = 4, unit = "large" },
  { id = "gochujang", amount = 3, unit = "tbsp" },
  { id = "soy-sauce", amount = 3, unit = "tbsp" },
  { id = "sugar", amount = 2, unit = "tsp" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "toasted-sesame-oil", amount = 2, unit = "tbsp" },
