  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 2.5, unit = "cup" },
]
steps = [
  "Rinse the rice and simmer it in most of the water in a covered pan on low heat for 15 minutes, then rest covered for 10 minutes.",
  "Slice the beef into thin strips and toss with half the soy sauce, half the sugar and a third of the garlic, grated. Mix the gochujang with the rest of the sugar, a spoonful of the toasted sesame oil and a splash of the rest of the water into a sauce.",
  "Blanch the soybean sprouts in a pan of boiling tap water for 4 minutes and drain. Blanch the spinach for 30 seconds, cool under the cold tap and squeeze dry. Season each with a little salt, the rest of the garlic and a little of the toasted sesame oil.",
  "Cut the carrot and zucchini into matchsticks and slice the mushrooms. Heat a little of the oil in a frying pan over medium-high heat and stir-fry each separately for 1 to 2 minutes with a little salt, until just tender.",
  "Stir-fry the mushrooms with the rest of the soy sauce for 3 minutes. Then stir-fry the beef for 2 to 3 minutes, until browned.",
  "Fry the eggs in the rest of the oil for 2 to 3 minutes, until the whites are set and the yolks still runny.",
  "Spoon the rice into bowls and arrange the vegetables and beef on top in sections. Add an egg to each, sprinkle with the sesame seeds and drizzle with the rest of the toasted sesame oil.",
  "Taste the sauce and adjust. Serve with the sauce to mix in at the table.",
]

