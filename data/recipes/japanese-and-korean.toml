steps = [
  "Use frozen edamame in their pods. Rub them with a little salt and leave for 2 minutes.",
  "Bring the water to a rolling boil with plenty of salt.",
  "Add the edamame and boil for 4 to 5 minutes, until the beans inside are tender but still bright green.",
  "Drain well and toss while hot with more salt.",
  "Taste a bean and add more salt if needed. Serve warm with a bowl for the empty pods.",
]

