]
steps = [
  "Use cold cooked rice from the day before. Chop the kimchi, keeping its juice. Cut the pork belly into small strips and slice the spring onions.",
  "Heat half the oil in a wok over medium-high heat. Fry the pork belly for 3 to 4 minutes, until browned and crisp at the edges.",
  "Add the kimchi and fry for 3 minutes, until it softens and starts to caramelise.",
