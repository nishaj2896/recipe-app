[[recipe]]
id = "01a18c12-0581-7b81-9a6b-9632b57e5a6b"
name = "Chicken katsu"
serves = 4
prep_minutes = 20
cook_minutes = 15
ingredients = [
  { id = "chicken", amount = 600, unit = "g" },
  { id = "all-purpose-flour", amount = 0.33, unit = "cup" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "panko", amount = 2, unit = "cup" },
  { id = "oil", amount = 2, unit = "cup" },
  { id = "cabbage", amount = 2, unit = "cup" },
  { id = "ketchup", amount = 3, unit = "tbsp" },
  { id = "worcestershire-sauce", amount = 2, unit = "tbsp" },
  { id = "soy-sauce", amount = 1, unit = "tsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "black-pepper", amount = 0.25, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use boneless chicken breasts. Slice each in half horizontally into thin cutlets about 1.5 cm thick. Season with salt and the black pepper.",
