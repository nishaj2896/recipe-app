[[recipe]]
id = "01a15175-3c0f-7496-91c1-4e90dc98797e"
name = "Vegetable pulao"
serves = 4
prep_minutes = 15
cook_minutes = 25
ingredients = [
  { id = "basmati-rice", amount = 300, unit = "g" },
  { id = "carrot", amount = 1, unit = "medium" },
  { id = "french-beans", amount = 80, unit = "g" },
  { id = "peas", amount = 0.5, unit = "cup" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "bay-leaves", amount = 1, unit = "leaf" },
  { id = "green-cardamom", amount = 3, unit = "piece" },
  { id = "cloves", amount = 4, unit = "piece" },
  { id = "cinnamon-sticks", amount = 1, unit = "piece" },
  { id = "ghee", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 600, unit = "ml" },
]
steps = [
  "Rinse the basmati rice three times and soak it for 20 minutes, then drain. Dice the carrot and french beans and slice the onion.",
  "Heat the ghee in a heavy pot and add the cumin seeds, bay leaves, green cardamom, cloves and cinnamon sticks. Fry for 30 seconds until fragrant.",
  "Add the onion and cook for 5 minutes until golden, then add the carrot, french beans and peas and stir for 2 minutes.",
  "Add the basmati rice and stir gently to coat it in the ghee. Pour in the water, add salt and bring to a boil.",
  "Cover tightly and cook on the lowest heat for 12 minutes. Turn off the heat and leave it covered for 5 minutes before fluffing with a fork.",
]

