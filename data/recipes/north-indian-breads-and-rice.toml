  "Meanwhile, rinse the basmati rice and bring it to a boil in the rest of the water with a little salt. Cover and cook on the lowest heat for 12 minutes, then rest for 5 minutes.",
  "Stir the garam masala into the beans, taste for salt and scatter the coriander leaves over. Serve the beans over the basmati rice.",
]

