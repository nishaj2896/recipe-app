serves = 4
prep_minutes = 10
cook_minutes = 60
ingredients = [
  { id = "kidney-beans", amount = 1, unit = "cup" },
  { id = "basmati-rice", amount = 1, unit = "cup" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "tomato", amount = 3, unit = "medium" },
  { id = "ginger-garlic-paste", amount = 1, unit = "tbsp" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "red-chilli-powder", amount = 1, unit = "tsp" },
  { id = "coriander-powder", amount = 2, unit = "tsp" },
