  "Add the water gradually and knead into a stiff dough. Cover and rest for 15 minutes.",
  "Divide the dough into small balls the size of a large marble and roll each into a round about 10 cm across, using a few drops of oil rather than dry flour.",
  "Heat the oil for deep frying over high heat. A small piece of dough should rise to the top at once.",
  "Slide in one puri at a time and press it gently with a slotted spoon until it puffs.",
  "Flip and fry for a few seconds more, until golden.",
  "Drain on paper and serve hot.",
]

