[[recipe]]
id = "01a15175-3c1c-71e8-a493-8702aa35c9e3"
name = "Chicken biryani"
serves = 4
prep_minutes = 60
cook_minutes = 60
ingredients = [
  { id = "chicken", amount = 750, unit = "g" },
  { id = "basmati-rice", amount = 400, unit = "g" },
  { id = "onion", amount = 3, unit = "large" },
  { id = "curd", amount = 0.75, unit = "cup" },
  { id = "mint", amount = 0.5, unit = "bunch" },
  { id = "ginger-garlic-paste", amount = 1.5, unit = "tbsp" },
  { id = "biryani-masala", amount = 2, unit = "tbsp" },
  { id = "saffron", amount = 1, unit = "pinch" },
  { id = "ghee", amount = 4, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 2.5, unit = "l" },
]
steps = [
  "Marinate the chicken with the curd, ginger garlic paste, biryani masala, half of the mint and salt for at least 1 hour.",
  "Slice the onion thinly and fry it in the ghee for 15 minutes until deep golden and crisp. Lift out the onion and keep the ghee.",
  "Rinse and soak the basmati rice for 30 minutes. Boil it in the salted water for 5 to 6 minutes until three-quarters cooked, then drain.",
  "Soak the saffron in a little warm water. Cook the chicken in a heavy pot with some of the ghee for 10 minutes, then layer over the basmati rice, the fried onion, the rest of the mint, the saffron and the remaining ghee.",
  "Seal the pot with a lid and cook on the lowest heat for 25 minutes. Rest for 10 minutes, then mix gently from the sides and serve with raita.",
]

[[recipe]]
id = "01a188ac-0597-7bfe-8ab8-24300d82453f"
