steps = [
  "Rinse the kidney beans and soak them overnight in plenty of water. Drain.",
  "Pressure cook them with salt and most of the water for 6 to 7 whistles. Let the pressure drop on its own. The beans must be completely soft and creamy inside.",
  "Finely chop the onions, purée the tomatoes and slit the green chillies.",
