[[recipe]]
id = "01a188e4-2cc1-7d6c-91e0-de20898e32ce"
name = "Mutton biryani"
serves = 6
prep_minutes = 40
cook_minutes = 120
ingredients = [
  { id = "mutton", amount = 1, unit = "kg" },
  { id = "basmati-rice", amount = 3, unit = "cup" },
  { id = "curd", amount = 1, unit = "cup" },
  { id = "onion", amount = 4, unit = "large" },
  { id = "ginger-garlic-paste", amount = 2, unit = "tbsp" },
  { id = "green-chillies", amount = 4, unit = "piece" },
  { id = "mint", amount = 0.5, unit = "cup" },
  { id = "coriander-leaves", amount = 0.5, unit = "cup" },
  { id = "biryani-masala", amount = 2, unit = "tbsp" },
  { id = "red-chilli-powder", amount = 2, unit = "tsp" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "lemon", amount = 1, unit = "medium" },
  { id = "saffron", amount = 1, unit = "pinch" },
  { id = "milk", amount = 0.25, unit = "cup" },
  { id = "green-cardamom", amount = 5, unit = "piece" },
  { id = "cloves", amount = 5, unit = "piece" },
  { id = "cinnamon-sticks", amount = 2, unit = "piece" },
  { id = "bay-leaves", amount = 3, unit = "leaf" },
  { id = "black-cumin", amount = 1, unit = "tsp" },
  { id = "ghee", amount = 6, unit = "tbsp" },
  { id = "oil", amount = 0.5, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 3, unit = "l" },
]
steps = [
  "Thinly slice the onions. Fry them in the oil in a heavy pot over medium heat for 15 to 18 minutes, stirring often, until deep brown and crisp. Lift them out and keep the oil.",
  "Mix the mutton with the curd, ginger garlic paste, slit green chillies, half the mint and coriander leaves, the biryani masala, red chilli powder, turmeric, lemon juice, salt, half the fried onions and a spoonful of the onion oil. Marinate for at least 2 hours.",
  "Put the mutton and its marinade in the pot, cover and cook on low heat for 50 to 60 minutes, stirring every 15 minutes, until tender and the gravy is thick.",
  "Rinse the basmati rice in 3 changes of water and soak it for 30 minutes.",
  "Bring the water to a rolling boil with the green cardamom, cloves, cinnamon, bay leaves, black cumin and plenty of salt.",
  "Drain the basmati rice, add it and boil for 5 to 6 minutes, until a grain breaks easily but still has a firm core. Drain.",
  "Warm the milk and soak the saffron in it.",
  "Spread the basmati rice evenly over the mutton. Scatter over the rest of the fried onions, mint and coriander leaves, and drizzle with the saffron milk and ghee.",
  "Seal the pot with a tight lid, or with a rope of dough around the rim. Cook on high heat for 5 minutes, until you hear it sizzle.",
  "Set the pot on a griddle over the lowest heat and cook for 25 minutes. Rest for 10 minutes without opening, then mix gently from the sides and serve.",
]

[[recipe]]
id = "01a188e4-2cc3-741b-b1ec-d5dc88859668"
name = "Lucknowi biryani"
serves = 6
prep_minutes = 30
cook_minutes = 150
ingredients = [
  { id = "mutton", amount = 1, unit = "kg" },
  { id = "basmati-rice", amount = 3, unit = "cup" },
  { id = "curd", amount = 1, unit = "cup" },
  { id = "onion", amount = 3, unit = "large" },
  { id = "ginger-garlic-paste", amount = 2, unit = "tbsp" },
  { id = "fennel-seeds", amount = 1, unit = "tbsp" },
  { id = "coriander-seeds", amount = 1, unit = "tbsp" },
  { id = "green-cardamom", amount = 8, unit = "piece" },
  { id = "black-cardamom", amount = 2, unit = "piece" },
  { id = "cloves", amount = 6, unit = "piece" },
  { id = "cinnamon-sticks", amount = 2, unit = "piece" },
  { id = "bay-leaves", amount = 3, unit = "leaf" },
  { id = "mace", amount = 1, unit = "pinch" },
  { id = "nutmeg", amount = 1, unit = "pinch" },
  { id = "white-pepper", amount = 1, unit = "tsp" },
  { id = "kewra-water", amount = 1, unit = "tsp" },
  { id = "rose-water", amount = 1, unit = "tsp" },
  { id = "saffron", amount = 1, unit = "pinch" },
  { id = "milk", amount = 0.25, unit = "cup" },
  { id = "cream", amount = 4, unit = "tbsp" },
  { id = "ghee", amount = 8, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 4, unit = "l" },
]
steps = [
  "Tie the fennel seeds, coriander seeds, half the green cardamom, the black cardamom, half the cloves and cinnamon and the bay leaves in a muslin cloth.",
  "Put the mutton in a large pot with the spice pouch, half the onions roughly chopped, the ginger garlic paste, salt and most of the water.",
  "Bring to a boil, skim off any scum and simmer for 60 to 70 minutes, until the mutton is tender. This is the yakhni. Lift out the meat and strain the broth.",
  "Thinly slice the rest of the onions. Fry them in the ghee in a heavy pot over medium heat for 10 minutes, until golden.",
  "Add the mutton and the whisked curd and cook for 10 minutes, stirring, until the curd no longer looks raw.",
  "Add the mace, nutmeg, white pepper and a ladle of the broth and simmer for 5 minutes, until the meat is coated in a thick gravy.",
  "Rinse the basmati rice in 3 changes of water and soak it for 30 minutes.",
  "Bring the rest of the broth to a boil, topped up with the rest of the water, the remaining whole spices and salt. Add the drained basmati rice and cook for 5 to 6 minutes, until a grain breaks easily but still has a firm core. Drain.",
  "Spread the basmati rice over the mutton. Mix the saffron into the warm milk with the cream, kewra water and rose water and pour it over the top.",
  "Seal the pot and cook on the lowest heat for 25 minutes. Rest for 10 minutes. The Lucknowi style keeps the basmati rice white and fragrant, so don't stir in any spice paste.",
]

