serves = 4
prep_minutes = 30
cook_minutes = 25
ingredients = [
  { id = "whole-wheat-flour", amount = 2, unit = "cup" },
  { id = "ghee", amount = 4, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.75, unit = "cup" },
]
steps = [
  "Mix the whole wheat flour with the salt and a spoon of the ghee, then add the water a little at a time and knead to a soft dough. Cover and rest for 20 minutes.",
  "Divide into balls. Roll one into a round, brush it with ghee, fold it in half and in half again into a triangle, and roll it out gently into a thin triangle.",
