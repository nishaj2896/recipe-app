[[recipe]]
id = "01a15175-3c1c-71e8-a493-8702aa35c9e3"
name = "Chicken biryani"
serves = 4
prep_minutes = 30
cook_minutes = 60
ingredients = [
  { id = "chicken", amount = 750, unit = "g" },
  { id = "basmati-rice", amount = 400, unit = "g" },
  { id = "onion", amount = 3, unit = "large" },
  { id = "curd", amount = 0.75, unit = "cup" },
  { id = "mint", amount = 0.5, unit = "bunch" },
  { id = "ginger-garlic-paste", amount = 1.5, unit = "tbsp" },
  { id = "biryani-masala", amount = 2, unit = "tbsp" },
  { id = "saffron", amount = 1, unit = "pinch" },
  { id = "ghee", amount = 4, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 2.5, unit = "l" },
]
steps = [
  "Mix the chicken with the curd, ginger garlic paste, biryani masala, half the mint leaves and salt. Marinate for at least 1 hour.",
  "Rinse the basmati rice in 3 changes of water and soak it for 30 minutes.",
  "Thinly slice the onions. Fry them in the ghee in a heavy pot over medium heat for 15 minutes, stirring often, until deep golden and crisp. Lift them out and keep the ghee.",
  "Soak the saffron in a spoonful of warm water.",
  "Bring the water to a rolling boil with plenty of salt. Drain the basmati rice, add it and boil for 5 to 6 minutes, until a grain breaks easily but still has a firm core. Drain.",
  "Put the chicken with its marinade in the pot with a spoonful of the ghee. Cook on medium heat for 10 minutes, stirring, until it is half cooked and the masala thickens.",
  "Spread the basmati rice evenly over the chicken. Scatter over the fried onions and the rest of the mint, drizzle with the saffron water and the rest of the ghee.",
  "Cover tightly, sealing the lid with foil if it isn't snug, and cook on the lowest heat for 25 minutes.",
  "Turn off the heat and rest for 10 minutes without opening.",
  "Mix gently from the sides with a wide spoon, bringing up the chicken, and serve with raita.",
]

[[recipe]]
id = "01a188ac-0597-7bfe-8ab8-24300d82453f"
name = "Plain paratha"
serves = 4
prep_minutes = 15
cook_minutes = 25
ingredients = [
  { id = "whole-wheat-flour", amount = 2, unit = "cup" },
  { id = "ghee", amount = 4, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.75, unit = "cup" },
]
steps = [
  "Mix the whole wheat flour with the salt and a spoonful of the ghee. Add the water a little at a time and knead for 5 minutes, into a soft, smooth dough. Cover and rest for 20 minutes.",
  "Divide the dough into golf-ball-sized balls. Roll one into a 12 cm round.",
  "Brush the round with ghee, fold it in half, brush again and fold in half again into a triangle.",
  "Roll the triangle out gently, dusting with flour, until it is thin and about 18 cm across.",
  "Put it on a hot griddle over medium heat and cook for 1 minute, until small bubbles and pale spots appear.",
  "Flip, brush with ghee and press with a spatula; the layers should puff.",
  "Flip again, brush and cook for 1 more minute, until both sides are golden and flaky.",
  "Keep the cooked parathas wrapped in a cloth while you make the rest.",
]

[[recipe]]
