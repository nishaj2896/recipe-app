[[recipe]]
id = "01a15175-3c23-770c-afb9-16d99fa0592d"
name = "Vegetable hakka noodles"
serves = 4
prep_minutes = 15
cook_minutes = 15
ingredients = [
  { id = "hakka-noodles", amount = 300, unit = "g" },
  { id = "cabbage", amount = 150, unit = "g" },
  { id = "carrot", amount = 1, unit = "medium" },
  { id = "bell-pepper", amount = 1, unit = "medium" },
  { id = "spring-onions", amount = 4, unit = "piece" },
  { id = "soy-sauce", amount = 2, unit = "tbsp" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "ginger", amount = 10, unit = "g" },
  { id = "white-vinegar", amount = 1, unit = "tsp" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 2, unit = "l" },
]
steps = [
  "Bring the water to a boil. Cook the hakka noodles until just tender, about 1 minute less than the packet says.",
  "Drain, rinse under cold water and toss with a spoonful of the oil so they don't stick.",
  "Shred the cabbage. Cut the carrot and bell pepper into thin strips. Slice the spring onions, keeping the white and green parts apart. Finely chop the garlic and ginger.",
  "Heat the rest of the oil in a wok over the highest heat until it shimmers.",
  "Add the garlic and ginger and stir-fry for 30 seconds, until fragrant.",
  "Add the white parts of the spring onions, the cabbage, carrot and bell pepper and stir-fry for 2 minutes, until just tender but still crunchy.",
  "Add the hakka noodles, soy sauce, white vinegar and salt and toss over high heat for 2 minutes, until hot and evenly coloured.",
  "Scatter the green tops of the spring onions over and serve hot.",
]

[[recipe]]
id = "01a15175-3c2c-75c4-a0fb-92fed93ef6e7"
name = "Egg fried rice"
serves = 4
prep_minutes = 10
cook_minutes = 10
ingredients = [
  { id = "egg", amount = 3, unit = "piece" },
  { id = "rice", amount = 250, unit = "g" },
  { id = "spring-onions", amount = 4, unit = "piece" },
  { id = "soy-sauce", amount = 2, unit = "tbsp" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 500, unit = "ml" },
]
steps = [
  "Cook the rice in the water until just tender. Spread it on a tray and let it cool completely, ideally overnight in the fridge. Warm rice turns mushy.",
  "Finely chop the garlic. Slice the spring onions, keeping the white and green parts apart.",
  "Heat half the oil in a wok over high heat. Beat the eggs, pour them in and scramble for 1 minute, until just set. Lift them out.",
  "Heat the rest of the oil. Stir-fry the garlic and the white parts of the spring onions for 30 seconds.",
  "Add the rice and stir-fry for 3 minutes, pressing it against the wok to break up clumps, until hot and lightly toasted.",
  "Add the soy sauce, salt and eggs and toss for 1 minute.",
  "Toss through the green tops of the spring onions and serve hot.",
]
