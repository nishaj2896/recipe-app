  "Heat the oil for deep frying over medium-high heat and fry the chicken for 4 to 5 minutes, until crisp. Drain. Fry the cashews for 1 minute, until golden.",
  "Slice the onion and bell pepper into strips, chop the garlic and break the dried red chillies.",
