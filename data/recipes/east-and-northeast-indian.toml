steps = [
  "Cut the hilsa into steaks about 2 cm thick. Rub them with half the turmeric and salt.",
  "Soak the yellow mustard seeds and mustard seeds in a little of the water for 15 minutes.",
  "Grind them with two of the green chillies, some of the salt and a splash of the water into a smooth paste. Grind briefly, as over-grinding turns mustard bitter.",
  "Heat the mustard oil in a wide pan over high heat until it just smokes, then lower the heat to medium. Add the nigella seeds and the other green chillies, slit.",
  "Mix the mustard paste with the rest of the water and the rest of the turmeric and pour it into the pan. Bring to a gentle simmer.",
