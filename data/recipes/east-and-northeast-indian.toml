  "For the dough, mix the whole wheat flour with a spoonful of the ghee and salt, add the water little by little and knead into a firm dough. Rest for 15 minutes.",
  "For the filling, mix the sattu with chopped onion, half the garlic and green chillies, the grated ginger, carom seeds, nigella seeds, half the coriander leaves, half the lemon juice, half the mustard oil and salt. It should hold together when pressed.",
  "Divide the dough into balls about 5 cm across. Flatten each into a small bowl shape, fill with the sattu mixture, seal and roll back into a ball.",
  "Bake at 200°C for 30 to 35 minutes, turning halfway, until golden and cracked in places.",
