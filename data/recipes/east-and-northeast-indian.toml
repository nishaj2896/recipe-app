[[recipe]]
id = "01a18b6c-22fb-7037-a86e-1fd6c219f189"
name = "Machher jhol"
serves = 4
prep_minutes = 15
cook_minutes = 30
image = { file = "01a18b6c-22fb-7037-a86e-1fd6c219f189.webp", sha256 = "ac9a6f898abfb1a02707e9eae18c4b05ae833117ca2f92c38c1ec6eb6f6fbdbe", alt = "Machher jhol: rohu steaks and potato in a light turmeric broth with coriander" }
ingredients = [
  { id = "rohu", amount = 500, unit = "g" },
  { id = "potato", amount = 2, unit = "medium" },
  { id = "tomato", amount = 1, unit = "medium" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "green-chillies", amount = 3, unit = "piece" },
  { id = "turmeric", amount = 1, unit = "tsp" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "coriander-powder", amount = 1, unit = "tsp" },
  { id = "red-chilli-powder", amount = 1, unit = "tsp" },
  { id = "panch-phoron", amount = 1, unit = "tsp" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "mustard-oil", amount = 4, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 2, unit = "cup" },
]
steps = [
  "Cut the rohu into steaks about 2 cm thick. Rub them with half the turmeric and salt and leave for 10 minutes.",
  "Peel the potatoes and cut them into long wedges. Chop the tomato, grind the ginger to a paste and slit the green chillies.",
  "Heat the mustard oil in a wide pan over high heat until it just smokes, then lower the heat to medium.",
  "Fry the fish for 2 to 3 minutes per side, until golden. Lift it out.",
  "Fry the potatoes in the same mustard oil for 5 minutes, until golden at the edges. Lift them out.",
  "Add the panch phoron and green chillies and let them crackle. Add the ginger paste and tomato and cook for 3 minutes, until soft.",
  "Mix the cumin powder, coriander powder, red chilli powder and the rest of the turmeric with a splash of the water, add the paste to the pan and fry for 2 minutes, until the mustard oil separates.",
  "Add the rest of the water, the potatoes and salt. Simmer for 10 minutes, until the potatoes are tender.",
  "Slide in the fish and simmer for 5 minutes, until cooked through. The jhol should be thin and light.",
  "Scatter the coriander leaves over, taste for salt and serve hot.",
]

[[recipe]]
id = "01a18b6c-22fe-7801-9a85-873df71cd0c8"
name = "Shorshe ilish"
serves = 4
prep_minutes = 15
cook_minutes = 20
ingredients = [
  { id = "hilsa", amount = 500, unit = "g" },
  { id = "yellow-mustard-seeds", amount = 2, unit = "tbsp" },
  { id = "mustard-seeds", amount = 1, unit = "tbsp" },
  { id = "green-chillies", amount = 4, unit = "piece" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "nigella-seeds", amount = 0.5, unit = "tsp" },
  { id = "mustard-oil", amount = 4, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.75, unit = "cup" },
