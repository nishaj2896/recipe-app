[[recipe]]
id = "01a15175-3c11-7d06-89b9-1b9f415eeffd"
name = "Lemon rice"
serves = 4
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "rice", amount = 250, unit = "g" },
  { id = "peanuts", amount = 30, unit = "g" },
  { id = "lemon", amount = 1, unit = "piece" },
  { id = "mustard-seeds", amount = 1, unit = "tsp" },
  { id = "curry-leaves", amount = 10, unit = "leaf" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 500, unit = "ml" },
]
steps = [
  "Rinse the rice and cook it in the water until tender. Spread it on a plate and let it cool, so the grains stay separate.",
  "Slit the green chillies.",
  "Heat the oil in a wide pan over medium heat. Fry the peanuts for 2 minutes, until golden and crunchy.",
  "Add the mustard seeds and wait until they pop. Add the curry leaves and green chillies.",
  "Lower the heat, add the turmeric and stir for 5 seconds.",
  "Add the rice and salt and toss gently, until every grain is evenly yellow.",
  "Turn off the heat, squeeze over the lemon juice and toss again. Serve warm or at room temperature.",
]

[[recipe]]
id = "01a15175-3c12-7238-998a-d2b358a0c24e"
name = "Curd rice"
serves = 4
prep_minutes = 10
cook_minutes = 20
ingredients = [
  { id = "rice", amount = 200, unit = "g" },
  { id = "curd", amount = 1.5, unit = "cup" },
  { id = "milk", amount = 0.5, unit = "cup" },
  { id = "mustard-seeds", amount = 1, unit = "tsp" },
  { id = "curry-leaves", amount = 8, unit = "leaf" },
  { id = "ginger", amount = 5, unit = "g" },
  { id = "green-chillies", amount = 1, unit = "piece" },
  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 600, unit = "ml" },
]
steps = [
  "Rinse the rice and cook it in the water until very soft.",
  "Mash it lightly with the back of a spoon and let it cool to room temperature. Hot rice would curdle the curd.",
  "Stir in the curd, milk and salt until creamy. The milk keeps it from turning sour as it sits.",
  "Grate the ginger and finely chop the green chilli.",
  "Heat the oil in a small pan. Add the mustard seeds and wait until they pop, then add the curry leaves, ginger and green chilli and stir for 10 seconds.",
  "Pour this over the curd rice, mix well and serve cool.",
]

[[recipe]]
id = "01a15175-3c29-7980-a562-3e1ffcc1a26f"
name = "Onion tomato chutney"
serves = 4
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "onion", amount = 2, unit = "medium" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "dried-red-chillies", amount = 3, unit = "piece" },
  { id = "mustard-seeds", amount = 0.5, unit = "tsp" },
  { id = "curry-leaves", amount = 8, unit = "leaf" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Roughly chop the onions, tomatoes and garlic.",
  "Heat half the oil in a pan over medium heat. Fry the dried red chillies for 30 seconds, until they darken slightly.",
  "Add the onions and garlic and cook for 6 minutes, until soft and golden.",
  "Add the tomatoes and salt and cook for 6 minutes, until mushy and the oil starts to separate.",
  "Let it cool, then blend to a coarse paste.",
  "Heat the rest of the oil in a small pan. Add the mustard seeds and, when they pop, the curry leaves.",
  "Pour this over the chutney and serve with idli or dosa.",
]

[[recipe]]
id = "01a15175-3c2b-7dd6-aec8-9b35af3404ac"
name = "Garlic chutney"
serves = 4
prep_minutes = 5
cook_minutes = 10
ingredients = [
