[[recipe]]
id = "01a18b54-81c5-7e25-a61a-8625f39be958"
name = "Tamarind rice"
serves = 4
prep_minutes = 15
cook_minutes = 25
ingredients = [
  { id = "rice", amount = 1.5, unit = "cup" },
  { id = "tamarind", amount = 2, unit = "tbsp" },
  { id = "peanuts", amount = 3, unit = "tbsp" },
  { id = "chana-dal", amount = 1, unit = "tbsp" },
  { id = "urad-dal", amount = 1, unit = "tbsp" },
  { id = "mustard-seeds", amount = 1, unit = "tsp" },
  { id = "dried-red-chillies", amount = 5, unit = "piece" },
  { id = "curry-leaves", amount = 2, unit = "sprig" },
  { id = "asafoetida", amount = 0.25, unit = "tsp" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "jaggery", amount = 1, unit = "tsp" },
  { id = "sesame-seeds", amount = 1, unit = "tbsp" },
  { id = "fenugreek-seeds", amount = 0.25, unit = "tsp" },
  { id = "sesame-oil", amount = 4, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 4, unit = "cup" },
]
steps = [
  "Rinse the rice. Cook it with most of the water for 15 minutes over low heat, covered, until tender. Spread it out on a wide plate to cool so the grains stay separate.",
  "Soak the tamarind in the rest of the water, warmed, for 15 minutes. Squeeze and strain a thick pulp.",
  "Dry roast the sesame seeds and fenugreek seeds over low heat for 2 minutes, until the sesame seeds are golden. Grind to a powder.",
  "Heat the sesame oil in a pan over medium heat. Fry the peanuts for 2 minutes, until crisp. Add the mustard seeds, chana dal and urad dal and fry until the seeds pop and the dals turn golden.",
  "Add the dried red chillies, curry leaves, asafoetida and turmeric and stir for 10 seconds.",
  "Pour in the tamarind pulp with the jaggery and salt. Simmer on low heat for 8 to 10 minutes, stirring now and then, until it is thick like a paste and the sesame oil separates at the edges.",
  "Stir in the sesame powder. Add the rice and mix gently with your fingers or a fork until every grain is coated.",
  "Taste and add salt if needed. Rest for 30 minutes if you can so the flavour soaks in, then serve.",
]

