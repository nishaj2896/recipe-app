[[recipe]]
id = "01a18b54-81ed-7b59-8c51-f262d91a2e78"
name = "Mysore pak"
serves = 12
prep_minutes = 10
cook_minutes = 25
ingredients = [
  { id = "gram-flour", amount = 1, unit = "cup" },
  { id = "sugar", amount = 2, unit = "cup" },
  { id = "ghee", amount = 2, unit = "cup" },
  { id = "water", amount = 0.75, unit = "cup" },
]
steps = [
  "Grease a deep tray, about 20 cm across, with a little of the ghee.",
  "Sift the gram flour. Warm the rest of the ghee in a small pan until hot and keep it on the lowest heat.",
  "Mix a quarter of the hot ghee into the gram flour to make a smooth, runny paste with no lumps.",
  "Heat the sugar and the water in a heavy pan over medium heat, stirring until the sugar dissolves. Boil for 5 to 6 minutes, until a drop pulled between finger and thumb forms a single thread.",
  "Turn the heat to low and add the gram flour paste a little at a time, whisking constantly so no lumps form.",
  "Add the rest of the hot ghee a ladle at a time, stirring hard. Each time, wait until the mixture absorbs it and bubbles before adding the next.",
  "Keep stirring for 8 to 10 minutes, until the mixture turns light and porous, froths up and starts leaving the sides of the pan.",
  "Pour it into the tray at once; it sets quickly. Let it sit for 5 minutes, then cut into squares while still warm.",
  "Let it cool completely before lifting the pieces out. Keep in an airtight box.",
]

[[recipe]]
id = "01a18b54-81f0-7bcb-b74e-17be585e8b70"
name = "Kesari bath"
serves = 4
prep_minutes = 5
cook_minutes = 20
ingredients = [
  { id = "semolina", amount = 0.5, unit = "cup" },
  { id = "sugar", amount = 0.75, unit = "cup" },
  { id = "ghee", amount = 0.33, unit = "cup" },
