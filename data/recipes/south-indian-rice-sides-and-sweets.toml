  "Cut the crusts off the white bread and cut each slice into two triangles.",
  "Heat the ghee in a wide pan over medium heat. Fry the bread a few pieces at a time for 1 to 2 minutes per side, until golden and crisp. Drain on paper.",
  "Bring the milk to a boil with the saffron and simmer on low heat for 15 minutes, stirring often, until reduced by about a third.",
  "In another pan, heat the sugar with the water over medium heat, stirring until it dissolves. Boil for 3 minutes, until slightly sticky.",
  "Crush the cardamom and grind the seeds. Stir them into the syrup.",
  "Dip each piece of fried bread in the syrup for a few seconds and lay it in a wide dish.",
  "Pour the reduced milk over the bread. Simmer gently on low heat for 5 minutes, or leave it to soak, until the bread is soft and has drunk most of the milk.",
  "Slice the almonds and pistachios and scatter them over. Serve warm or chilled.",
]

[[recipe]]
id = "01a18b54-81f8-7d67-8527-5a688f5ead83"
name = "Qubani ka meetha"
serves = 6
prep_minutes = 10
cook_minutes = 40
plan_ahead = { wait_minutes = 480, note = "soak overnight" }
ingredients = [
  { id = "dried-apricots", amount = 250, unit = "g" },
  { id = "sugar", amount = 0.5, unit = "cup" },
  { id = "cream", amount = 0.5, unit = "cup" },
  { id = "almonds", amount = 10, unit = "piece" },
  { id = "water", amount = 3, unit = "cup" },
]
steps = [
  "Rinse the dried apricots and soak them in the water overnight, until plump.",
  "Lift them out, keeping the soaking liquid. Split each of the dried apricots, take out the stone and set the stones aside.",
  "Simmer the dried apricots in the soaking liquid over medium heat for 15 minutes, until very soft.",
  "Add the sugar and cook on low heat for 15 to 20 minutes, stirring and mashing, until it turns thick, glossy and jammy.",
  "If you like, crack a few of the stones and add the kernels for an almond flavour. Otherwise, slice the almonds.",
  "Cool, then serve chilled, topped with the cream and almonds.",
]

[[recipe]]
id = "01a18b54-81fb-7b02-a01b-8336a10cf2c5"
name = "Filter coffee"
serves = 2
prep_minutes = 5
cook_minutes = 15
ingredients = [
  { id = "ground-coffee", amount = 4, unit = "tbsp" },
  { id = "milk", amount = 1, unit = "cup" },
  { id = "sugar", amount = 2, unit = "tsp" },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Use a South Indian coffee filter, or a small cafetière. Put the ground coffee in the upper chamber and press it down lightly with the plunger disc.",
  "Bring the water to a boil and pour it over the coffee. Cover and let it drip for 10 to 15 minutes, until you have a thick, dark decoction below.",
  "Heat the milk until it just starts to boil.",
  "Put the sugar in a tumbler and pour in the decoction until it is about a quarter full.",
  "Top up with the hot milk. Pour it back and forth between two steel tumblers from a height a few times, until frothy. Taste, add more sugar if you like, and serve hot.",
]

[[recipe]]
