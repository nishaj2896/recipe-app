[[recipe]]
id = "01a18b54-81d1-7921-ad97-8f0eec6cba72"
name = "Hyderabadi chicken biryani"
serves = 6
prep_minutes = 40
cook_minutes = 80
plan_ahead = { wait_minutes = 120, note = "marinate for 2 hours" }
ingredients = [
  { id = "chicken", amount = 1, unit = "kg" },
  { id = "basmati-rice", amount = 3, unit = "cup" },
  { id = "curd", amount = 1, unit = "cup" },
  { id = "onion", amount = 4, unit = "large" },
  { id = "ginger-garlic-paste", amount = 2, unit = "tbsp" },
  { id = "green-chillies", amount = 4, unit = "piece" },
  { id = "mint", amount = 0.5, unit = "cup" },
  { id = "coriander-leaves", amount = 0.5, unit = "cup" },
  { id = "red-chilli-powder", amount = 2, unit = "tsp" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "biryani-masala", amount = 2, unit = "tbsp" },
  { id = "lemon", amount = 1, unit = "medium" },
  { id = "saffron", amount = 1, unit = "pinch" },
  { id = "milk", amount = 0.25, unit = "cup" },
  { id = "green-cardamom", amount = 5, unit = "piece" },
  { id = "cloves", amount = 5, unit = "piece" },
  { id = "cinnamon-sticks", amount = 2, unit = "piece" },
  { id = "bay-leaves", amount = 2, unit = "leaf" },
  { id = "black-cumin", amount = 1, unit = "tsp" },
  { id = "ghee", amount = 5, unit = "tbsp" },
  { id = "oil", amount = 0.5, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 3, unit = "l" },
]
steps = [
  "Slice the onions thinly. Heat the oil in a wide pan over medium heat and fry them for 15 to 20 minutes, stirring, until deep brown and crisp. Lift them out onto paper and keep the oil.",
  "Cut the chicken into large pieces. Slit the green chillies and chop the mint and coriander leaves.",
  "In a heavy, wide pot, mix the chicken with the curd, ginger garlic paste, green chillies, red chilli powder, turmeric, biryani masala, lemon juice, salt, half the mint and coriander leaves, half the fried onion and a few spoonfuls of the onion oil. Cover and marinate for at least 2 hours in the fridge.",
  "Rinse the basmati rice in several changes of water until it runs clear, then soak it for 30 minutes.",
  "Warm the milk and soak the saffron in it.",
  "Bring the water to a rolling boil with the cardamom, cloves, cinnamon, bay leaves, black cumin and plenty of salt. It should taste salty like the sea.",
  "Drain the basmati rice, add it to the boiling water and cook for 5 to 6 minutes, until about 70 percent done: a grain should still have a firm white core when pressed. Drain at once.",
  "Spread the basmati rice evenly over the raw marinated chicken. Scatter over the rest of the fried onion, mint and coriander leaves, then drizzle with the saffron milk and the ghee.",
  "Cover with a tight lid, sealing the edge with foil. Cook on high heat for 5 minutes, until you hear it sizzle and see steam escaping.",
  "Set the pot on a griddle over the lowest heat and cook for 35 to 40 minutes, until the chicken is cooked through and the basmati rice is fluffy.",
  "Rest for 10 minutes before opening. Scoop from the side so each serving gets both layers, and serve with mirchi ka salan and raita.",
]

