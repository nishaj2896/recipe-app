]
steps = [
  "Heat half the ghee in a heavy pan over medium heat. Fry the cashews for 1 minute, until golden, then the raisins until they puff. Lift them out.",
  "Add the semolina to the same ghee and roast on low heat for 5 to 6 minutes, stirring, until it smells nutty but stays pale.",
  "Meanwhile, bring the water to a boil with the saffron in another pan. Chop the pineapple into small pieces.",
  "Pour the boiling saffron water into the semolina slowly, stirring constantly. It will splutter, so stand back.",
  "Cook on low heat for 3 minutes, stirring, until the semolina absorbs the water and swells.",
  "Add the sugar and pineapple and stir for 3 to 4 minutes. It will turn runny, then thicken again.",
  "Add the rest of the ghee a spoonful at a time and stir until the kesari leaves the sides of the pan and looks glossy.",
  "Crush the cardamom, grind the seeds and stir them in with the cashews and raisins. Serve warm.",
]

