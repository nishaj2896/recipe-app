  "Add the chicken in large pieces, the curd, half the garam masala, half the fried onion, the lemon juice and salt. Cover and cook on medium-low heat for 25 minutes, until the chicken is tender and the masala is thick. Stir in half the mint and coriander leaves.",
  "In another pot, heat the rest of the ghee over medium heat. Add the fennel seeds, cardamom, cloves and cinnamon and stir for 30 seconds.",
  "Add the basmati rice and stir gently for 2 minutes. Pour in the water, add salt and bring to a boil. Cover and cook on low heat for 10 minutes, until the water is absorbed and the basmati rice is nearly done.",
  "Spread the basmati rice over the chicken. Top with the rest of the fried onion, garam masala, mint and coriander leaves, and the cashews and raisins.",
  "Cover tightly and cook on the lowest heat for 15 minutes. Rest for 5 minutes, then serve with raita and pickle.",
]

