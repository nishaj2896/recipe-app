[[recipe]]
id = "01a18b54-81e7-7b17-9646-a0def52a7eb2"
name = "Parippu payasam"
serves = 6
prep_minutes = 10
cook_minutes = 45
ingredients = [
  { id = "moong-dal", amount = 0.5, unit = "cup" },
  { id = "jaggery", amount = 1, unit = "cup" },
  { id = "coconut-milk", amount = 2, unit = "cup" },
  { id = "coconut-cream", amount = 0.5, unit = "cup" },
  { id = "green-cardamom", amount = 4, unit = "piece" },
  { id = "dry-ginger-powder", amount = 0.25, unit = "tsp" },
  { id = "cashews", amount = 12, unit = "piece" },
  { id = "raisins", amount = 1, unit = "tbsp" },
  { id = "dried-coconut", amount = 2, unit = "tbsp" },
  { id = "ghee", amount = 3, unit = "tbsp" },
  { id = "water", amount = 2.5, unit = "cup" },
]
steps = [
  "Dry roast the moong dal in a heavy pan over medium heat for 4 to 5 minutes, stirring, until it turns golden and smells toasty.",
  "Rinse the dal and pressure cook it with most of the water for 3 whistles, until soft. Mash it well.",
  "Melt the jaggery in the rest of the water over low heat. Strain out any grit.",
  "Pour the jaggery syrup into the dal with a spoonful of the ghee. Cook on low heat for 8 to 10 minutes, stirring often, until thick.",
  "Pour in the coconut milk and simmer on low heat for 10 minutes, stirring, until it thickens slightly. Don't let it boil hard.",
  "Crush the cardamom and grind the seeds. Stir them in with the dry ginger powder and the coconut cream, and turn off the heat.",
  "Cut the dried coconut into small bits. Fry them in the rest of the ghee over medium heat for 1 minute, then the cashews for 1 minute, until golden, then the raisins until they puff.",
  "Pour everything over the payasam and serve warm.",
]

[[recipe]]
