[[recipe]]
id = "01a18c4a-5f93-7445-b9e5-2ace755af2f9"
name = "Bobotie"
serves = 6
prep_minutes = 20
cook_minutes = 55
ingredients = [
  { id = "beef-mince", amount = 750, unit = "g" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "curry-powder", amount = 2, unit = "tbsp" },
  { id = "turmeric", amount = 1, unit = "tsp" },
  { id = "white-bread", amount = 2, unit = "slice" },
