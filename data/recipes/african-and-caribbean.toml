[[recipe]]
id = "01a18c4a-5f8e-7c60-acaf-8a4fe25a35f2"
name = "Jollof rice"
serves = 6
prep_minutes = 20
cook_minutes = 50
image = { file = "01a18c4a-5f8e-7c60-acaf-8a4fe25a35f2.webp", sha256 = "ddd4927dfb547f528bbe512cde77f1b3c20b0fefab71a1721e18b02327750c06", alt = "Jollof rice in a tomato and pepper sauce" }
ingredients = [
  { id = "parboiled-rice", amount = 2, unit = "cup" },
  { id = "tomato", amount = 4, unit = "medium" },
  { id = "bell-pepper", amount = 2, unit = "medium" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "birds-eye-chillies", amount = 1, unit = "piece" },
  { id = "tomato-paste", amount = 3, unit = "tbsp" },
  { id = "chicken-stock", amount = 3, unit = "cup" },
  { id = "curry-powder", amount = 1, unit = "tsp" },
  { id = "dried-thyme", amount = 1, unit = "tsp" },
  { id = "bay-leaves", amount = 2, unit = "piece" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "oil", amount = 0.33, unit = "cup" },
  { id = "butter", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Blend the tomatoes, red bell peppers, one of the onions, the bird's eye chillies, garlic and ginger until smooth.",
  "Slice the other onion. Rinse the parboiled rice until the rinsing runs clear and drain.",
  "Heat the oil in a heavy pot over medium heat. Fry the sliced onion for 5 minutes, then stir in the tomato paste and fry for 3 minutes, until it darkens.",
  "Add the blended mixture, curry powder, dried thyme, bay leaves and salt. Simmer for 15 to 20 minutes, stirring often, until reduced by half and the oil rises to the top.",
  "Stir in the parboiled rice and chicken stock. Bring to a boil, then cover tightly and cook on the lowest heat for 25 to 30 minutes, until the parboiled rice is tender. Don't stir; let a little crust form on the base.",
  "Stir in the butter and fluff the parboiled rice.",
  "Taste and adjust the salt. Pick out the bay leaves and serve hot.",
]

[[recipe]]
id = "01a18c4a-5f90-7c75-81a5-7add2dad1f6f"
name = "Chicken yassa"
serves = 4
prep_minutes = 20
cook_minutes = 50
plan_ahead = { wait_minutes = 120, note = "marinate for 2 hours" }
ingredients = [
  { id = "chicken", amount = 1.2, unit = "kg" },
  { id = "onion", amount = 4, unit = "large" },
  { id = "lemon", amount = 3, unit = "medium" },
  { id = "dijon-mustard", amount = 2, unit = "tbsp" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "birds-eye-chillies", amount = 1, unit = "piece" },
  { id = "olives", amount = 0.33, unit = "cup" },
  { id = "bay-leaves", amount = 2, unit = "piece" },
  { id = "chicken-stock", amount = 1, unit = "cup" },
  { id = "oil", amount = 0.25, unit = "cup" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use bone-in chicken thighs and legs. Slice the onions thinly and grate the garlic.",
  "Mix the lemon juice, dijon mustard, garlic, black pepper, salt and half the oil. Toss the chicken and onions in it and leave for at least 2 hours, or overnight in the fridge.",
  "Lift the chicken out, shaking off the onions. Grill or pan-fry it over medium-high heat for 4 to 5 minutes a side, until browned.",
