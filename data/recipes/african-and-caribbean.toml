steps = [
  "For the bara, stir the dry yeast and sugar into a third of the water, warm, and leave for 5 minutes. Mix the all-purpose flour with half the turmeric, half the cumin powder and salt, add the yeast and knead into a soft, sticky dough. Cover and leave for 1 hour.",
  "For the channa, chop the onion and garlic. Heat a spoonful of the oil in a pot over medium heat and fry them for 5 minutes. Add the curry powder and the rest of the turmeric and cumin powder for 1 minute.",
  "Add the drained chickpeas, the rest of the water and salt. Simmer for 20 minutes, mashing some chickpeas, until soft and saucy.",
  "With oiled hands, pinch off balls of dough about 4 cm across and press each into a thin round about 10 cm across.",
  "Heat the rest of the oil in a deep pan to 180°C. Fry the bara for 30 seconds a side, until puffed and pale golden. Drain.",
  "Slice the cucumber thinly. Taste the channa and adjust.",
  "Sandwich a spoonful of channa between 2 bara and top with the tamarind chutney and cucumber. Serve straight away.",
]

[[recipe]]
id = "01a18c4a-5fb1-7545-9231-705002a3aa96"
name = "Brown stew chicken"
serves = 4
prep_minutes = 15
cook_minutes = 45
ingredients = [
  { id = "chicken", amount = 1.2, unit = "kg" },
  { id = "brown-sugar", amount = 2, unit = "tbsp" },
  { id = "onion", amount = 1, unit = "large" },
  { id = "bell-pepper", amount = 1, unit = "medium" },
  { id = "carrot", amount = 1, unit = "medium" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "thyme", amount = 3, unit = "sprig" },
  { id = "allspice", amount = 0.5, unit = "tsp" },
  { id = "ketchup", amount = 2, unit = "tbsp" },
  { id = "soy-sauce", amount = 2, unit = "tbsp" },
  { id = "spring-onions", amount = 2, unit = "piece" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Use bone-in chicken pieces. Season with the allspice, soy sauce, grated garlic and salt and leave for 30 minutes.",
  "Slice the onion, bell pepper and carrot and chop the tomatoes and spring onions.",
  "Heat the oil in a heavy pot over medium heat. Add the brown sugar and let it melt and darken for 2 to 3 minutes, until almost smoking and deep brown.",
  "Carefully add the chicken and turn it in the caramel for 5 minutes, until browned all over.",
  "Add the onion, bell pepper, carrot, tomatoes, spring onions and thyme and stir for 3 minutes.",
  "Add the ketchup and the water. Cover and simmer on low heat for 30 to 35 minutes, until the chicken is tender and the sauce is rich and thick.",
  "Taste and adjust. Serve hot.",
]

[[recipe]]
id = "01a18c4a-5fb3-7bd1-9db2-f8d7f9200fcb"
name = "Fried plantains"
serves = 4
prep_minutes = 5
cook_minutes = 10
ingredients = [
  { id = "raw-banana", amount = 3, unit = "large" },
  { id = "oil", amount = 0.5, unit = "cup" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use very ripe plantains, with mostly black skins. They should give when pressed.",
  "Cut off the ends, slit the skin lengthwise and peel.",
  "Slice on a long diagonal about 1.5 cm thick.",
  "Heat the oil in a large frying pan over medium heat. Fry the slices for 2 to 3 minutes a side, until deep golden and caramelised at the edges.",
  "Drain on kitchen paper and sprinkle with salt.",
  "Taste one and serve hot.",
]
