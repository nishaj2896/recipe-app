[[recipe]]
id = "01a18c4a-5f97-7a26-8dd0-5204054b53a1"
name = "Peri peri chicken"
serves = 4
prep_minutes = 15
cook_minutes = 45
plan_ahead = { wait_minutes = 120, note = "marinate for 2 hours" }
ingredients = [
  { id = "chicken", amount = 1.5, unit = "kg" },
  { id = "birds-eye-chillies", amount = 6, unit = "piece" },
  { id = "garlic", amount = 4, unit = "clove" },
