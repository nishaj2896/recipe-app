[[recipe]]
id = "01a18bae-8f8b-78ce-ba4f-0aab703ac96a"
name = "Paneer pasanda"
serves = 4
prep_minutes = 20
cook_minutes = 25
ingredients = [
  { id = "paneer", amount = 400, unit = "g" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "cashews", amount = 20, unit = "piece" },
  { id = "raisins", amount = 1, unit = "tbsp" },
  { id = "cream", amount = 0.25, unit = "cup" },
  { id = "ginger-garlic-paste", amount = 1, unit = "tbsp" },
  { id = "kashmiri-chilli-powder", amount = 1.5, unit = "tsp" },
  { id = "coriander-powder", amount = 1, unit = "tsp" },
  { id = "garam-masala", amount = 0.5, unit = "tsp" },
  { id = "cornflour", amount = 2, unit = "tbsp" },
  { id = "green-cardamom", amount = 3, unit = "piece" },
  { id = "oil", amount = 0.5, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Cut the paneer into rectangles about 5 cm by 4 cm and 1.5 cm thick. Cut each one almost in half through the thickness to make a pocket.",
  "Finely chop half the cashews and the raisins and mix with a little of the paneer, crumbled, and salt. Stuff a little into each pocket and press closed.",
  "Mix the cornflour with a splash of the water into a thin paste. Dip each stuffed paneer in it.",
  "Heat the oil in a pan over medium heat. Shallow-fry the paneer for 1 to 2 minutes per side, until golden. Drain.",
  "Roughly chop the onions and tomatoes. Simmer them with the rest of the cashews and half the rest of the water for 10 minutes, until soft, then blend smooth.",
  "Pour off all but a spoonful of the oil. Fry the cardamom and ginger garlic paste for 1 minute, then the blended paste with the Kashmiri chilli powder, coriander powder and salt for 6 minutes, until thick.",
  "Add the rest of the water and simmer for 3 minutes. Stir in the cream and garam masala.",
  "Slide the paneer into the gravy and simmer for 1 minute. Taste for salt and serve hot with rotis.",
]

[[recipe]]
