[[recipe]]
id = "01a15175-3c01-7f7f-bbc8-f5c5fce48a60"
name = "Jeera aloo"
serves = 4
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "potato", amount = 4, unit = "medium" },
  { id = "cumin-seeds", amount = 1.5, unit = "tsp" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "red-chilli-powder", amount = 0.5, unit = "tsp" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "l" },
]
steps = [
  "Boil the potatoes in the water for 12 to 15 minutes, until a knife goes in easily. Drain and let them cool, so they hold their shape.",
  "Peel the potatoes and cut them into bite-sized cubes. Slit the green chillies.",
  "Heat the oil in a wide pan over medium heat. Add the cumin seeds and let them crackle for 20 to 30 seconds, until a shade darker.",
  "Add the green chillies, then the turmeric and red chilli powder. Stir for 5 seconds only, so the spices don't burn.",
  "Add the potatoes and salt and toss over medium-high heat for 5 minutes, until coated and crisp at the edges.",
  "Taste for salt, scatter the coriander leaves over and serve with puri or roti.",
]

