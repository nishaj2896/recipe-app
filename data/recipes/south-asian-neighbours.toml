serves = 2
prep_minutes = 20
cook_minutes = 15
ingredients = [
  { id = "frozen-parathas", amount = 4, unit = "piece" },
  { id = "chicken", amount = 250, unit = "g" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "cabbage", amount = 2, unit = "cup" },
  { id = "carrot", amount = 1, unit = "medium" },
  { id = "leek", amount = 1, unit = "small" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "curry-leaves", amount = 1, unit = "sprig" },
  { id = "curry-powder", amount = 1, unit = "tbsp" },
  { id = "soy-sauce", amount = 1, unit = "tbsp" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Cook the frozen parathas in a dry pan as the packet says, then cut them into thin strips about 1 cm wide.",
  "Cut the chicken into small pieces and toss with half the curry powder and salt. Shred the cabbage, cut the carrot into matchsticks and slice the leek, onion and green chillies. Chop the garlic.",
  "Heat the oil in a large wok over high heat. Stir-fry the chicken for 4 to 5 minutes, until cooked through.",
