[[recipe]]
id = "01a18c4a-5f7a-7e5c-997b-ef9101e0b2a2"
name = "Egg hoppers"
serves = 4
prep_minutes = 15
cook_minutes = 30
plan_ahead = { wait_minutes = 360, note = "ferment the batter for 6 hours" }
ingredients = [
  { id = "rice-flour", amount = 2, unit = "cup" },
  { id = "coconut-milk", amount = 1.5, unit = "cup" },
  { id = "active-dry-yeast", amount = 1, unit = "tsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "egg", amount = 6, unit = "large" },
  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Stir the dry yeast and sugar into the warm water and leave for 5 minutes, until foamy.",
  "Mix the rice flour with the yeast mixture and most of the coconut milk into a thick batter. Cover and leave for at least 6 hours, or overnight, until bubbly.",
  "Stir in the rest of the coconut milk and salt until the batter is like thin pancake batter.",
  "Heat a small round-bottomed pan or wok over medium heat and wipe it with oil.",
  "Pour in a small ladleful of batter and swirl the pan at once so it coats the sides thinly, leaving a thicker pool in the centre.",
  "Crack an egg into the centre, cover and cook for 3 to 4 minutes, until the edges are crisp and lacy and the egg white is set.",
  "Ease out with a spatula and repeat with the rest of the batter and eggs. Sprinkle the eggs with salt, taste one and serve hot.",
]

