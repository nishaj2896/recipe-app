[[recipe]]
id = "01a18c4a-5f87-7180-bffa-d6d81231c9e1"
name = "Kabuli pulao"
serves = 6
prep_minutes = 25
cook_minutes = 105
ingredients = [
  { id = "basmati-rice", amount = 2, unit = "cup" },
  { id = "lamb", amount = 750, unit = "g" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "carrot", amount = 3, unit = "medium" },
  { id = "raisins", amount = 0.5, unit = "cup" },
  { id = "almond-flakes", amount = 0.33, unit = "cup" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "green-cardamom", amount = 4, unit = "piece" },
  { id = "cinnamon-sticks", amount = 1, unit = "piece" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "sugar", amount = 1, unit = "tbsp" },
  { id = "oil", amount = 0.33, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 5, unit = "cup" },
]
steps = [
  "Rinse the basmati rice and soak it for 30 minutes. Cut the lamb into chunks about 4 cm across and slice the onions.",
  "Heat most of the oil in a heavy pot over medium heat. Fry the onions for 12 minutes, until deep brown. Add the lamb and brown for 6 minutes.",
  "Add the cumin seeds, green cardamom, cinnamon sticks, black pepper, salt and the water. Cover and simmer on low heat for 60 minutes, until the lamb is tender.",
  "Cut the carrots into thin matchsticks. Fry them in the rest of the oil with the sugar over medium heat for 5 minutes, until soft and glazed. Add the raisins for 1 minute, until plump, and the almond flakes for 1 minute. Set aside.",
  "Drain the basmati rice and add it to the pot with the broth. Bring to a boil, then cook uncovered on medium heat until the liquid sinks below the surface of the basmati rice.",
  "Spread the carrot mixture on top. Cover tightly and cook on the lowest heat for 25 minutes, until the basmati rice is tender.",
  "Taste and adjust the salt. Pile onto a platter with the lamb under the basmati rice and the carrots on top.",
]

