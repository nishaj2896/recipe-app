[[recipe]]
id = "01a18c4a-5f6c-7ce6-a337-75ae717b09c9"
name = "Sri Lankan chicken curry"
serves = 4
prep_minutes = 20
cook_minutes = 45
ingredients = [
  { id = "chicken", amount = 1, unit = "kg" },
  { id = "onion", amount = 1, unit = "large" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "curry-leaves", amount = 2, unit = "sprig" },
  { id = "pandan-leaves", amount = 1, unit = "leaf" },
  { id = "cinnamon-sticks", amount = 1, unit = "piece" },
  { id = "green-cardamom", amount = 4, unit = "piece" },
  { id = "curry-powder", amount = 2, unit = "tbsp" },
  { id = "red-chilli-powder", amount = 1, unit = "tsp" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "tomato", amount = 1, unit = "medium" },
  { id = "coconut-milk", amount = 1.5, unit = "cup" },
  { id = "lime", amount = 0.5, unit = "medium" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use bone-in chicken pieces. Toss them with the curry powder, red chilli powder, turmeric and salt and leave for 20 minutes.",
  "Slice the onion, chop the garlic, ginger and tomato, and slit the green chillies.",
  "Heat the oil in a heavy pot over medium heat. Add the cinnamon sticks, green cardamom, curry leaves and pandan leaves and fry for 30 seconds, until fragrant.",
  "Add the onion and green chillies and fry for 8 minutes, until golden. Add the garlic and ginger for 1 minute.",
  "Add the chicken and stir for 5 minutes, until coated and lightly coloured. Add the tomato and cook for 3 minutes, until soft.",
  "Pour in the coconut milk, cover and simmer on low heat for 25 to 30 minutes, until the chicken is tender and the gravy is thick.",
  "Squeeze the lime juice in. Taste and adjust the salt, then serve hot.",
]

[[recipe]]
id = "01a18c4a-5f73-7aea-a8ab-569912f8df1b"
