  "Push everything aside, crack in the eggs and scramble for 1 minute.",
  "Add the paratha strips, the rest of the curry powder and the soy sauce. Toss and chop through with the edge of a metal spatula for 2 to 3 minutes, until everything is mixed and hot.",
  "Taste and adjust the salt. Serve hot.",
]

