steps = [
  "Finely chop the shallots and half the garlic. Mix them with a third of the fish sauce, a third of the sugar and the black pepper.",
  "Use minced pork and shape it into small flat patties about 5 cm across. Slice the pork belly thinly. Toss both with the marinade and leave for at least 30 minutes.",
  "For the dipping sauce, stir the rest of the sugar into the water until dissolved. Add the rest of the fish sauce, the lime juice, the rest of the garlic chopped and the bird's eye chillies sliced.",
  "Peel the carrot, slice it thinly and add it to the dipping sauce.",
  "Cook the rice vermicelli in boiling tap water as the packet says, rinse under the cold tap and drain well.",
  "Brush a griddle pan with the oil and heat until very hot. Grill the patties and pork belly for 3 to 4 minutes a side, until charred and cooked through.",
  "Taste the dipping sauce and adjust. Drop the hot pork into bowls of the sauce and serve with the noodles, lettuce, mint and coriander leaves to dip and wrap.",
