  { id = "garlic", amount = 3, unit = "clove" },
  { id = "shallot", amount = 2, unit = "piece" },
  { id = "kecap-manis", amount = 2, unit = "tbsp" },
  { id = "soy-sauce", amount = 1, unit = "tbsp" },
