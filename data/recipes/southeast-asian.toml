  "Hard-boil the eggs in a pan of boiling tap water for 9 minutes, cool and halve. Soak the rice vermicelli for 10 minutes, until soft, and drain. Slice the chicken thinly and cut the tofu into cubes. Peel and devein the prawns.",
  "Heat the oil in a pot over medium heat. Fry the paste for 6 to 8 minutes, stirring, until dark and fragrant and the oil separates.",
