[[recipe]]
id = "01a18c12-05c1-7817-a7a0-c3bcf90f7c81"
name = "Chicken satay (Malaysian)"
serves = 4
prep_minutes = 25
cook_minutes = 25
plan_ahead = { wait_minutes = 60, note = "marinate for 1 hour" }
ingredients = [
  { id = "chicken", amount = 600, unit = "g" },
  { id = "lemongrass", amount = 2, unit = "piece" },
  { id = "shallot", amount = 4, unit = "piece" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "turmeric", amount = 1, unit = "tsp" },
  { id = "coriander-powder", amount = 1, unit = "tsp" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "sugar", amount = 1, unit = "tbsp" },
  { id = "peanuts", amount = 1, unit = "cup" },
  { id = "dried-red-chillies", amount = 4, unit = "piece" },
  { id = "tamarind", amount = 1, unit = "tbsp" },
  { id = "palm-sugar", amount = 2, unit = "tbsp" },
  { id = "cucumber", amount = 1, unit = "small" },
  { id = "oil", amount = 4, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Use boneless chicken thighs and cut them into strips about 2 cm wide. Soak bamboo skewers for 30 minutes.",
  "Blend the tender inner part of the lemongrass with half the shallots, the garlic, turmeric, coriander powder, cumin powder, sugar, salt and a spoonful of the oil to a paste. Rub it into the chicken and leave for at least 1 hour, or overnight in the fridge.",
  "For the sauce, toast the peanuts in a dry pan over medium heat for 5 minutes, until golden, then grind coarsely. Soak the dried red chillies and tamarind in a little of the water, hot, for 10 minutes, then strain the tamarind and blend the chillies with the rest of the shallots.",
  "Heat the rest of the oil in a pan over medium heat. Fry the chilli paste for 5 minutes, until it darkens and the oil separates.",
  "Add the peanuts, the tamarind liquid, the palm sugar and the rest of the water and simmer for 8 to 10 minutes, stirring, until thick. Season with salt.",
  "Thread the chicken onto the skewers. Grill on a very hot griddle pan or barbecue for 8 to 10 minutes, turning and brushing with a little oil, until charred at the edges and cooked through.",
  "Cut the cucumber into chunks. Taste the sauce and adjust, then serve the satay hot with the sauce and cucumber.",
]

[[recipe]]
id = "01a18c12-05c3-70ea-8643-588ed0682229"
name = "Beef rendang"
serves = 6
prep_minutes = 30
cook_minutes = 180
image = { file = "01a18c12-05c3-70ea-8643-588ed0682229.webp", sha256 = "853ef77ed7c1ce8386300ded052a28b9d7a9ae19f39833e5d5127d4f3aa4dbb4", alt = "Dark, dry beef rendang" }
ingredients = [
  { id = "beef", amount = 1, unit = "kg" },
  { id = "coconut-milk", amount = 2, unit = "cup" },
  { id = "desiccated-coconut", amount = 0.5, unit = "cup" },
  { id = "lemongrass", amount = 3, unit = "piece" },
  { id = "galangal", amount = 1, unit = "piece" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "garlic", amount = 5, unit = "clove" },
  { id = "shallot", amount = 8, unit = "piece" },
  { id = "dried-red-chillies", amount = 10, unit = "piece" },
  { id = "turmeric", amount = 1, unit = "tsp" },
  { id = "makrut-lime-leaves", amount = 5, unit = "leaf" },
  { id = "cinnamon-sticks", amount = 1, unit = "piece" },
  { id = "star-anise", amount = 2, unit = "piece" },
  { id = "tamarind", amount = 1, unit = "tbsp" },
  { id = "palm-sugar", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 4, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1.5, unit = "cup" },
]
steps = [
  "Use beef chuck and cut it into chunks about 4 cm across. Soak the dried red chillies and tamarind in a little of the water, hot, for 15 minutes. Strain the tamarind.",
  "Blend the chillies, shallots, garlic, ginger, galangal, turmeric and the tender part of 2 lemongrass stalks with a splash of the water to a smooth paste. Bash the last stalk.",
  "Toast the desiccated coconut in a dry pan over medium-low heat for 6 to 8 minutes, stirring, until deep brown. Pound or grind it to an oily paste.",
  "Heat the oil in a heavy pot over medium heat. Fry the paste with the bashed lemongrass, cinnamon sticks and star anise for 8 to 10 minutes, stirring, until dark and fragrant and the oil separates.",
  "Add the beef and stir for 5 minutes to coat. Pour in the coconut milk, the rest of the water and the torn makrut lime leaves and bring to a boil.",
  "Simmer uncovered on low heat for 2 and a half hours, stirring every 15 minutes, until the beef is tender and the liquid has almost gone.",
  "Stir in the toasted desiccated coconut, tamarind liquid, palm sugar and salt. Keep cooking for 15 to 20 minutes, stirring often, until the sauce is thick and dark and clings to the beef.",
  "Taste and balance the salt and sweetness. Pick out the whole spices and serve.",
]

