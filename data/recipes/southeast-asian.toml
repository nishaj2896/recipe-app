[[recipe]]
id = "01a18c12-05bc-7ee2-a97d-f619d0729c98"
name = "Nasi goreng"
serves = 2
prep_minutes = 10
cook_minutes = 12
image = { file = "01a18c12-05bc-7ee2-a97d-f619d0729c98.webp", sha256 = "cde63b3195dbd222f7a040103043dab348de0939666e3d79f88cb55ebb63dc3f", alt = "Nasi goreng topped with two fried eggs, with sliced cucumber and tomato" }
ingredients = [
  { id = "rice", amount = 2, unit = "cup" },
  { id = "chicken", amount = 200, unit = "g" },
  { id = "shallot", amount = 3, unit = "piece" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "birds-eye-chillies", amount = 2, unit = "piece" },
  { id = "kecap-manis", amount = 2, unit = "tbsp" },
  { id = "soy-sauce", amount = 1, unit = "tsp" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "cucumber", amount = 0.5, unit = "small" },
  { id = "tomato", amount = 1, unit = "small" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use cold cooked rice from the day before. Slice the chicken thinly.",
  "Pound or blend the shallots, garlic and bird's eye chillies to a rough paste.",
  "Heat most of the oil in a wok over medium-high heat. Fry the paste for 2 minutes, until fragrant and starting to colour.",
  "Add the chicken and stir-fry for 3 minutes, until cooked through.",
  "Add the rice, kecap manis and soy sauce and toss for 3 to 4 minutes, pressing out clumps, until every grain is coated and hot.",
  "Fry the eggs in the rest of the oil for 2 to 3 minutes, until the edges are crisp and the yolks still runny. Slice the cucumber and tomato.",
  "Taste the rice for salt. Serve topped with the eggs, with the cucumber and tomato on the side.",
]

