[[recipe]]
id = "01a18c12-05c8-719e-9bef-f6d5dd1971d9"
name = "Hainanese chicken rice"
serves = 4
prep_minutes = 20
cook_minutes = 60
ingredients = [
  { id = "chicken", amount = 1.5, unit = "kg" },
  { id = "jasmine-rice", amount = 1.5, unit = "cup" },
  { id = "ginger", amount = 2, unit = "piece" },
  { id = "garlic", amount = 6, unit = "clove" },
  { id = "spring-onions", amount = 4, unit = "piece" },
  { id = "pandan-leaves", amount = 2, unit = "leaf" },
  { id = "birds-eye-chillies", amount = 4, unit = "piece" },
  { id = "lime", amount = 2, unit = "medium" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "cucumber", amount = 1, unit = "medium" },
  { id = "soy-sauce", amount = 2, unit = "tbsp" },
  { id = "toasted-sesame-oil", amount = 2, unit = "tsp" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 4, unit = "l" },
]
steps = [
  "Rub a whole chicken all over with salt, rinse and pat dry. Slice half the ginger and cut the spring onions into lengths, then stuff them inside the chicken.",
  "Bring the water to a boil in a large pot with a little salt. Lower in the chicken, bring back to a bare simmer, then cover and poach on the lowest heat for 35 to 40 minutes, until the juices at the thigh run clear.",
  "Lift the chicken into a bowl of iced tap water for 10 minutes so the skin turns firm and silky. Drain, rub with the toasted sesame oil and keep the poaching liquid.",
  "Rinse the jasmine rice and drain. Chop half the garlic and grate a little of the rest of the ginger. Heat the oil in a pan and fry them over medium heat for 1 minute, then add the jasmine rice and stir for 2 minutes, until glossy.",
  "Add enough of the poaching liquid to cover the jasmine rice by about 1 cm, the pandan leaves knotted, and salt. Cover and cook on low heat for 15 minutes, then rest covered for 10 minutes.",
  "For the dipping sauce, blend the bird's eye chillies with the rest of the garlic, a little of the rest of the ginger, the lime juice, sugar and a spoonful of the poaching liquid. Pound the rest of the ginger with a little salt for a ginger sauce.",
  "Season the rest of the poaching liquid with salt to drink as a soup. Slice the cucumber.",
  "Carve the chicken into pieces and drizzle with the soy sauce. Taste the sauces and adjust, then serve with the jasmine rice, cucumber, both sauces and a small bowl of the soup.",
]

[[recipe]]
id = "01a18c12-05ca-7255-a495-c8a66a5e3891"
