steps = [
  "Use beef brisket or shin, left whole, plus a small sirloin steak for slicing. Put the brisket in a pot of cold tap water, boil for 5 minutes, then drain and rinse.",
  "Char the unpeeled onions and ginger directly over a gas flame or under a hot grill for 8 to 10 minutes, turning, until blackened in places. Rinse off the burnt skin.",
  "Toast the star anise, cinnamon sticks, cloves and coriander seeds in a dry pan for 2 minutes, until fragrant.",
  "Put the brisket, onions, ginger, spices and the water in a large pot. Bring to a boil, then simmer uncovered on the lowest heat for 2 and a half hours, skimming often, until the brisket is tender.",
  "Lift out the brisket and slice it thinly. Strain the broth and season with the fish sauce, rock sugar and salt.",
  "Freeze the sirloin for 20 minutes, then slice it paper-thin. Soak the flat rice noodles as the packet says and blanch them for 30 seconds in boiling tap water.",
  "Divide the noodles between bowls and top with the brisket and raw sirloin. Ladle the boiling broth over so it cooks the sirloin.",
  "Taste the broth and adjust. Serve with the bean sprouts, thai basil, coriander leaves, lime wedges, sliced bird's eye chillies, sliced spring onions, hoisin sauce and sriracha at the table.",
]

