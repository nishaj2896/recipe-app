]
steps = [
  "Use bone-in chicken thighs and legs. Crush the garlic and lightly crack the black peppercorns.",
  "Heat the oil in a wide pan over medium-high heat. Brown the chicken skin side down for 5 to 6 minutes, until golden. Turn and brown for 2 minutes.",
  "Add the garlic for 1 minute, until fragrant.",
  "Pour in the soy sauce, cane vinegar and the water, add the bay leaves and black peppercorns and bring to a boil. Don't stir for the first few minutes, so the sharpness of the vinegar cooks off.",
