  { id = "onion", amount = 2, unit = "medium" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "star-anise", amount = 4, unit = "piece" },
  { id = "cinnamon-sticks", amount = 1, unit = "piece" },
  { id = "cloves", amount = 4, unit = "piece" },
  { id = "coriander-seeds", amount = 1, unit = "tbsp" },
