ingredients = [
  { id = "flat-rice-noodles", amount = 300, unit = "g" },
  { id = "prawns", amount = 150, unit = "g" },
  { id = "sausages", amount = 1, unit = "piece" },
  { id = "bean-sprouts", amount = 1, unit = "cup" },
  { id = "chives", amount = 0.5, unit = "cup" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "dark-soy-sauce", amount = 1, unit = "tbsp" },
  { id = "soy-sauce", amount = 1, unit = "tbsp" },
  { id = "oyster-sauce", amount = 1, unit = "tbsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "chilli-garlic-sauce", amount = 1, unit = "tbsp" },
  { id = "oil", amount = 3, unit = "tbsp" },
]
steps = [
  "Use fresh wide rice noodles and separate the strands gently. If using dried ones, soak them for 30 minutes, until soft, and drain.",
  "Use Chinese-style sweet sausages if you can and slice them thinly on the diagonal. Peel and devein the prawns, chop the garlic and cut the chives into lengths about 5 cm.",
  "Mix the dark soy sauce, soy sauce, oyster sauce, sugar and chilli garlic sauce.",
  "Heat the oil in a wok over the highest heat until smoking. Fry the garlic for 15 seconds, then the sausages and prawns for 1 minute, until the prawns turn pink.",
  "Add the noodles and sauce and toss for 1 to 2 minutes, letting them catch and char slightly.",
  "Push the noodles aside, crack in the eggs, scramble them for 30 seconds and toss through.",
  "Add the bean sprouts and chives for 30 seconds, until just wilted. Taste and serve straight away.",
]

[[recipe]]
id = "01a18c12-05cc-7f07-8dd1-2c174ad6bd82"
name = "Gado-gado"
serves = 4
prep_minutes = 25
cook_minutes = 25
ingredients = [
  { id = "potato", amount = 2, unit = "medium" },
  { id = "french-beans", amount = 150, unit = "g" },
  { id = "cabbage", amount = 2, unit = "cup" },
  { id = "bean-sprouts", amount = 1, unit = "cup" },
  { id = "egg", amount = 4, unit = "large" },
  { id = "tofu", amount = 200, unit = "g" },
  { id = "tempeh", amount = 150, unit = "g" },
  { id = "cucumber", amount = 1, unit = "medium" },
  { id = "peanuts", amount = 1, unit = "cup" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "birds-eye-chillies", amount = 2, unit = "piece" },
  { id = "palm-sugar", amount = 2, unit = "tbsp" },
  { id = "kecap-manis", amount = 1, unit = "tbsp" },
  { id = "tamarind", amount = 1, unit = "tbsp" },
  { id = "lime", amount = 1, unit = "medium" },
  { id = "oil", amount = 0.5, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Hard-boil the eggs in a pan of boiling tap water for 9 minutes, cool and halve. Boil the potatoes in their skins for 15 to 20 minutes, until tender, then peel and slice.",
  "Blanch the french beans for 3 minutes and the cabbage and bean sprouts for 1 minute, until just tender, then cool under the cold tap.",
  "Cut the tofu and tempeh into slices about 1 cm thick and pat dry. Fry them in the oil over medium heat for 3 to 4 minutes a side, until golden. Drain.",
  "Fry the peanuts in the same oil for 3 to 4 minutes, until golden. Lift out and blend with the garlic, bird's eye chillies, palm sugar and salt to a coarse paste.",
  "Soak the tamarind in a little of the water, hot, then squeeze and strain. Simmer the peanut paste with the tamarind liquid, kecap manis and the rest of the water for 5 minutes, stirring, until thick. Stir in the lime juice.",
  "Slice the cucumber. Arrange the vegetables, eggs, tofu and tempeh on a platter.",
  "Taste the peanut sauce and adjust, loosening with a splash of tap water if thick. Pour it over and serve at room temperature.",
]

[[recipe]]
id = "01a18c12-05ce-7e43-9ce5-fdc95ffd4fe0"
name = "Pho bo"
serves = 4
prep_minutes = 25
cook_minutes = 180
image = { file = "01a18c12-05ce-7e43-9ce5-fdc95ffd4fe0.webp", sha256 = "36dbb13e2f05037168784c30c2e47551b79afb85ba6ccfcac77015a6518a490f", alt = "Pho bo with beef, with bean sprouts, Thai basil, lime and chillies on the side" }
ingredients = [
