serves = 4
prep_minutes = 10
cook_minutes = 20
ingredients = [
  { id = "semolina", amount = 1, unit = "cup" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "carrot", amount = 1, unit = "small" },
  { id = "french-beans", amount = 50, unit = "g" },
  { id = "peas", amount = 0.25, unit = "cup" },
  { id = "mustard-seeds", amount = 1, unit = "tsp" },
  { id = "urad-dal", amount = 1, unit = "tsp" },
  { id = "chana-dal", amount = 1, unit = "tsp" },
  { id = "curry-leaves", amount = 10, unit = "leaf" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "ginger", amount = 10, unit = "g" },
