  { id = "salt", to_taste = true },
  { id = "water", amount = 2.5, unit = "cup" },
]
steps = [
  "Dry roast the semolina in a pan over medium heat for 5 minutes, stirring, until fragrant but not coloured. Tip it onto a plate.",
  "Finely chop the onion, green chillies and ginger. Dice the carrot and french beans. Bring the water to a boil in another pan.",
  "Heat the ghee in the first pan over medium heat. Add the mustard seeds, urad dal and chana dal and fry until the seeds pop and the dals turn golden.",
  "Add the curry leaves, green chillies, ginger and onion and cook for 3 minutes, until soft.",
