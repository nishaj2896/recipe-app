  { id = "cashews", amount = 10, unit = "piece" },
  { id = "chana-dal", amount = 1, unit = "tsp" },
  { id = "mustard-seeds", amount = 0.5, unit = "tsp" },
  { id = "curry-leaves", amount = 10, unit = "leaf" },
  { id = "ginger", amount = 10, unit = "g" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "carrot", amount = 1, unit = "small" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "baking-soda", amount = 0.25, unit = "tsp" },
  { id = "ghee", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Chop the ginger and green chillies and grate the carrot.",
  "Heat the ghee in a pan over medium heat. Add the mustard seeds and chana dal and fry until the seeds pop and the dal turns golden.",
  "Add the cashews, curry leaves, ginger and green chillies and stir for 30 seconds.",
  "Add the semolina and roast for 5 minutes, stirring, until fragrant but still pale. Let it cool.",
  "Mix in the curd, carrot, coriander leaves, salt and the water into a thick batter. Rest for 20 minutes.",
  "Grease the idli moulds and bring water to a boil in the steamer.",
  "Just before steaming, stir in the baking soda. Add a splash of the water if the batter has become too thick to pour.",
  "Fill the moulds and steam for 12 minutes, until a knife comes out clean. Rest for 2 minutes before unmoulding.",
]

[[recipe]]
id = "01a188e6-a842-793c-b480-e9e5cbe1d5f2"
name = "Masala dosa"
serves = 4
prep_minutes = 25
cook_minutes = 40
plan_ahead = { wait_minutes = 840, note = "soak and ferment overnight" }
image = { file = "01a188e6-a842-793c-b480-e9e5cbe1d5f2.webp", sha256 = "266acde34fd5d480e311ae73c87733d00fdefaec6e55d3b9a8a3d0aaf68d698e", alt = "Masala dosa folded over a potato filling, with curry leaves, on a dark plate" }
ingredients = [
  { id = "rice", amount = 1.5, unit = "cup" },
  { id = "urad-dal", amount = 0.5, unit = "cup" },
  { id = "chana-dal", amount = 2, unit = "tbsp" },
  { id = "fenugreek-seeds", amount = 0.5, unit = "tsp" },
  { id = "potato", amount = 4, unit = "medium" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "mustard-seeds", amount = 1, unit = "tsp" },
  { id = "curry-leaves", amount = 12, unit = "leaf" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "ginger", amount = 10, unit = "g" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "ghee", amount = 4, unit = "tbsp" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 2, unit = "cup" },
]
steps = [
  "Rinse the rice and soak it in plenty of water for 6 hours. In another bowl, soak the urad dal with half the chana dal and the fenugreek seeds.",
  "Grind each smooth with some of the water, mix them with salt and leave overnight in a warm place, until risen and bubbly.",
  "For the filling, boil the potatoes until tender. Peel and crush them roughly.",
  "Thinly slice the onions, slit the green chillies and grate the ginger.",
  "Heat the oil in a pan over medium heat. Add the mustard seeds and the rest of the chana dal and fry until the seeds pop and the dal turns golden.",
  "Add the curry leaves, onions, green chillies and ginger and cook for 5 minutes, until the onions are soft.",
  "Add the turmeric, potatoes, salt and a splash of the water and mix into a soft masala. Keep it warm.",
  "Heat a cast-iron griddle over medium-high heat. A sprinkle of water should sizzle away at once. Wipe it with a little oil.",
  "Pour a ladle of batter in the centre and spread it outward in a quick spiral with the back of the ladle into a thin round.",
  "Drizzle ghee around the edge and cook for 2 to 3 minutes, until golden and crisp underneath.",
  "Spoon some potato masala into the middle, fold the dosa over and serve straight away.",
]

