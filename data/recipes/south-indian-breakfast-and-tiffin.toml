[[recipe]]
id = "01a188e6-a882-7190-a8eb-a97911b36be6"
name = "Kothu parotta"
serves = 4
prep_minutes = 10
cook_minutes = 20
ingredients = [
  { id = "frozen-parathas", amount = 4, unit = "piece" },
  { id = "egg", amount = 3, unit = "piece" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "ginger-garlic-paste", amount = 1, unit = "tsp" },
  { id = "curry-leaves", amount = 10, unit = "leaf" },
  { id = "fennel-seeds", amount = 0.5, unit = "tsp" },
  { id = "red-chilli-powder", amount = 1, unit = "tsp" },
  { id = "garam-masala", amount = 0.5, unit = "tsp" },
  { id = "turmeric", amount = 0.25, unit = "tsp" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Cook the frozen parathas as the packet says. Cool slightly, then tear or chop them into small shreds.",
  "Thinly slice the onions, chop the tomatoes and slit the green chillies.",
  "Heat the oil on a griddle or wide pan over medium heat. Add the fennel seeds and curry leaves and let them sizzle.",
  "Add the onions and green chillies and cook for 5 minutes, until soft. Add the ginger garlic paste and stir for 1 minute.",
  "Add the tomatoes, turmeric, red chilli powder, garam masala and salt and cook for 4 minutes, until soft.",
  "Push the masala to one side, crack in the eggs and scramble them for 1 minute.",
  "Add the shredded parathas. Chop and toss everything together with 2 flat spatulas for 4 to 5 minutes, until well mixed and hot.",
  "Scatter the coriander leaves over and serve hot.",
]

[[recipe]]
id = "01a188e6-a884-71cb-8e87-cdbd3d356c9e"
name = "Malabar parotta"
serves = 4
prep_minutes = 40
cook_minutes = 30
plan_ahead = { wait_minutes = 120, note = "let the dough rest for 2 hours" }
ingredients = [
  { id = "all-purpose-flour", amount = 3, unit = "cup" },
  { id = "milk", amount = 0.5, unit = "cup" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "oil", amount = 0.5, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Mix the all-purpose flour with the sugar and salt. Add the milk and water and knead for 10 minutes into a very soft, smooth dough.",
  "Coat the dough with a little of the oil, cover and rest for 2 hours.",
  "Divide it into balls about 5 cm across. Coat each in oil and rest for 15 minutes more.",
  "On an oiled counter, flatten a ball and stretch it with oiled hands into a paper-thin sheet. Small tears are fine.",
  "Gather the sheet into pleats like a fan, then coil the pleated strip into a spiral and tuck the end underneath.",
  "Flatten each spiral with your palm into a round about 5 mm thick.",
  "Cook on a hot griddle over medium heat with a little oil for 2 minutes per side, until golden and flaky.",
  "While hot, stack a few and clap them between your palms to open the layers. Serve hot.",
]
