[[recipe]]
id = "01a15175-3c15-7017-9787-d9be73c0cb5f"
name = "Rava upma"
serves = 4
prep_minutes = 5
cook_minutes = 15
ingredients = [
  { id = "semolina", amount = 180, unit = "g" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "mustard-seeds", amount = 1, unit = "tsp" },
  { id = "curry-leaves", amount = 10, unit = "leaf" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "ginger", amount = 10, unit = "g" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 500, unit = "ml" },
]
steps = [
  "Dry roast the semolina in a pan over medium heat for 5 minutes, stirring, until it smells nutty but is still pale. Tip it onto a plate.",
  "Finely chop the onion and green chillies, and grate the ginger. Bring the water to a boil in a kettle or another pan.",
  "Heat the oil in the same pan over medium heat. Add the mustard seeds and wait until they pop.",
  "Add the curry leaves, green chillies and ginger and stir for 20 seconds.",
  "Add the onion and cook for 3 minutes, until soft.",
  "Pour in the hot water, add salt and bring back to a boil.",
  "Lower the heat and pour in the semolina in a thin stream with one hand, stirring constantly with the other so no lumps form.",
  "Cover and cook on low heat for 2 minutes, until the semolina has absorbed the water and looks fluffy. Fluff with a fork and serve hot.",
]

[[recipe]]
id = "01a188e6-a83e-78f1-a1ee-2349f5e25707"
name = "Idli"
serves = 6
prep_minutes = 15
cook_minutes = 15
plan_ahead = { wait_minutes = 840, note = "soak and ferment overnight" }
image = { file = "01a188e6-a83e-78f1-a1ee-2349f5e25707.webp", sha256 = "b5ddeb4734faaeb454bef7de088a4d720c83fff1f1286c70dc276072243ce268", alt = "Four steamed idlis on a dark plate" }
ingredients = [
  { id = "idli-rice", amount = 2, unit = "cup" },
  { id = "urad-dal", amount = 0.5, unit = "cup" },
  { id = "fenugreek-seeds", amount = 0.5, unit = "tsp" },
  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 2, unit = "cup" },
]
steps = [
  "Rinse the idli rice and soak it in plenty of water for 6 hours. In another bowl, rinse and soak the urad dal with the fenugreek seeds.",
  "Drain the urad dal and grind it, adding the water a little at a time, for 10 minutes, until light, fluffy and doubled in volume. A drop should float in a bowl of water.",
  "Drain the idli rice and grind it with the rest of the water to a batter that feels slightly grainy between your fingers.",
  "Mix both batters with the salt in a large bowl, stirring by hand for 1 minute.",
  "Cover and leave in a warm place for 8 to 12 hours, until it has risen, looks bubbly and smells pleasantly sour.",
  "Grease the idli moulds with the oil and bring water to a boil in the steamer.",
  "Without stirring the batter much, fill the moulds three-quarters full.",
  "Steam for 10 to 12 minutes, until a knife pushed into an idli comes out clean.",
  "Rest for 2 minutes, then lift them out with a wet spoon. Serve hot.",
]

[[recipe]]
id = "01a188e6-a840-7af6-83f9-144f64aa1b2a"
name = "Rava idli"
serves = 4
prep_minutes = 10
cook_minutes = 15
ingredients = [
