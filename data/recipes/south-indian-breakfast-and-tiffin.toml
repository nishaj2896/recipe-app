[[recipe]]
id = "01a188e6-a859-75ba-bfec-282fbe3f42b8"
name = "Appam"
serves = 4
prep_minutes = 15
cook_minutes = 25
plan_ahead = { wait_minutes = 600, note = "soak, then ferment for 6 hours" }
image = { file = "01a188e6-a859-75ba-bfec-282fbe3f42b8.webp", sha256 = "7536862bf072a586f861784e5b2bd9a499f2507b5e7f8b465387dd443c868a55", alt = "Appam with a lacy crisp edge and a soft, spongy centre" }
