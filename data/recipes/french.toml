[[recipe]]
id = "01a18c1a-e24e-7cc2-9c2e-67a17a5c8ba9"
name = "French omelette"
serves = 1
prep_minutes = 2
cook_minutes = 3
ingredients = [
  { id = "egg", amount = 3, unit = "large" },
  { id = "butter", amount = 1, unit = "tbsp" },
  { id = "chives", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Beat the eggs with a little salt until completely smooth, with no streaks of white.",
  "Finely chop the chives.",
  "Melt the butter in a non-stick pan about 20 cm across over medium heat until it foams but doesn't brown.",
  "Pour in the eggs and stir constantly with a spatula while shaking the pan, for 30 to 45 seconds, until small soft folds form and the eggs are mostly set but still glossy.",
  "Stop stirring and smooth the top. Leave for 10 seconds so the base sets.",
  "Tilt the pan, roll the omelette over itself towards the far edge and tip it onto a warm plate, seam side down. It should be pale with no browning.",
  "Taste, scatter the chives over and serve straight away.",
]

[[recipe]]
id = "01a18c1a-e250-74b1-966c-5ae1ee0ad31c"
name = "Croque monsieur"
serves = 2
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "white-bread", amount = 4, unit = "slice" },
  { id = "ham", amount = 4, unit = "slice" },
  { id = "gruyere", amount = 1, unit = "cup" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "all-purpose-flour", amount = 1, unit = "tbsp" },
  { id = "milk", amount = 0.5, unit = "cup" },
  { id = "dijon-mustard", amount = 2, unit = "tsp" },
  { id = "nutmeg", amount = 0.25, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Heat the grill to high. Grate the gruyere.",
  "Melt half the butter in a small pan over medium heat. Stir in the all-purpose flour for 1 minute, then whisk in the milk and simmer for 2 to 3 minutes, until thick. Season with the nutmeg and salt and stir in a third of the gruyere.",
  "Spread the white bread with the dijon mustard. Make sandwiches with the ham and half the rest of the gruyere.",
  "Melt the rest of the butter in a frying pan over medium heat. Toast the sandwiches for 2 to 3 minutes a side, until golden.",
  "Lay them on a tray, spread the sauce over the tops and scatter the rest of the gruyere on.",
  "Grill for 3 to 4 minutes, until bubbling and browned in spots.",
  "Taste the sauce and serve hot, with a knife and fork.",
]

[[recipe]]
id = "01a18c1a-e252-7f62-a590-359eefff3fae"
name = "Quiche Lorraine"
serves = 8
prep_minutes = 20
cook_minutes = 55
ingredients = [
  { id = "shortcrust-pastry", amount = 320, unit = "g" },
  { id = "bacon", amount = 200, unit = "g" },
  { id = "egg", amount = 4, unit = "large" },
  { id = "whipping-cream", amount = 1, unit = "cup" },
  { id = "milk", amount = 0.5, unit = "cup" },
  { id = "gruyere", amount = 1, unit = "cup" },
  { id = "nutmeg", amount = 0.25, unit = "tsp" },
  { id = "black-pepper", amount = 0.25, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Heat the oven to 200°C. Line a tart tin about 23 cm across with the shortcrust pastry, prick the base and chill for 15 minutes.",
  "Line the pastry with baking paper and baking beans. Bake for 15 minutes, remove the paper and beans and bake for 5 minutes more, until pale golden.",
  "Cut the bacon into strips and fry it in a dry pan over medium heat for 5 to 6 minutes, until golden. Drain on kitchen paper.",
  "Whisk the eggs, double cream, milk, nutmeg, black pepper and a little salt. The bacon is salty, so go easy.",
  "Lower the oven to 170°C. Scatter the bacon and grated gruyere over the pastry and pour in the egg mixture.",
  "Bake for 30 to 35 minutes, until just set with a slight wobble in the centre and golden on top.",
  "Rest for 15 minutes. Taste and serve warm or at room temperature.",
]

