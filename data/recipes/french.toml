[[recipe]]
id = "01a18c1a-e257-7ace-9f3e-2795b3093cb1"
name = "French onion soup"
serves = 4
prep_minutes = 15
cook_minutes = 80
ingredients = [
  { id = "onion", amount = 1, unit = "kg" },
  { id = "butter", amount = 3, unit = "tbsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "all-purpose-flour", amount = 1, unit = "tbsp" },
  { id = "white-wine", amount = 0.5, unit = "cup" },
  { id = "chicken-stock", amount = 5, unit = "cup" },
  { id = "thyme", amount = 3, unit = "sprig" },
  { id = "bay-leaves", amount = 1, unit = "piece" },
  { id = "baguette", amount = 1, unit = "piece" },
  { id = "gruyere", amount = 1.5, unit = "cup" },
  { id = "black-pepper", amount = 0.25, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Slice the onions thinly into half-moons.",
  "Melt the butter in a heavy pot over medium heat. Add the onions with a little salt, cover and cook for 10 minutes, until soft.",
