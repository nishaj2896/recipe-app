[[recipe]]
id = "01a18c1a-e259-7a4a-8d66-0e670d7dceaf"
name = "Coq au vin"
serves = 6
prep_minutes = 30
cook_minutes = 105
ingredients = [
  { id = "chicken", amount = 1.5, unit = "kg" },
  { id = "red-wine", amount = 3, unit = "cup" },
  { id = "bacon", amount = 150, unit = "g" },
  { id = "mushroom", amount = 250, unit = "g" },
  { id = "shallot", amount = 12, unit = "piece" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "carrot", amount = 2, unit = "medium" },
  { id = "thyme", amount = 4, unit = "sprig" },
  { id = "bay-leaves", amount = 2, unit = "piece" },
  { id = "all-purpose-flour", amount = 2, unit = "tbsp" },
  { id = "butter", amount = 3, unit = "tbsp" },
  { id = "brandy", amount = 3, unit = "tbsp" },
  { id = "chicken-stock", amount = 1, unit = "cup" },
  { id = "parsley", amount = 2, unit = "tbsp" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use bone-in chicken thighs and legs. Season with salt and the black pepper.",
  "Cut the bacon into short strips. Peel the shallots, leaving them whole. Halve the mushrooms, slice the carrots and crush the garlic.",
  "Fry the bacon in a heavy pot over medium heat for 5 minutes, until crisp. Lift it out. Brown the chicken in the fat for 4 to 5 minutes a side, in batches. Lift it out.",
  "Add the shallots and carrots and brown for 5 minutes. Add the garlic for 1 minute. Pour in the brandy and scrape up the brown bits.",
  "Sprinkle the all-purpose flour over and stir for 1 minute. Pour in the red wine and chicken stock, add the thyme and bay leaves and return the chicken and bacon.",
  "Cover and simmer on low heat for 1 hour, until the chicken is very tender.",
  "Fry the mushrooms in the butter over high heat for 5 minutes, until golden. Add them to the pot and simmer uncovered for 15 minutes, until the sauce is glossy and thick enough to coat a spoon.",
  "Taste and adjust. Pick out the herb stalks, scatter the chopped parsley over and serve hot.",
]

[[recipe]]
id = "01a18c1a-e25b-7270-91c1-4d56c0e87006"
name = "Chicken fricassee"
serves = 4
prep_minutes = 15
cook_minutes = 45
ingredients = [
  { id = "chicken", amount = 1.2, unit = "kg" },
  { id = "butter", amount = 3, unit = "tbsp" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "mushroom", amount = 250, unit = "g" },
  { id = "all-purpose-flour", amount = 2, unit = "tbsp" },
  { id = "white-wine", amount = 0.5, unit = "cup" },
  { id = "chicken-stock", amount = 1.5, unit = "cup" },
  { id = "creme-fraiche", amount = 0.5, unit = "cup" },
  { id = "egg", amount = 1, unit = "large" },
  { id = "lemon", amount = 0.5, unit = "medium" },
  { id = "thyme", amount = 3, unit = "sprig" },
  { id = "parsley", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
