  "Use bone-in chicken thighs and legs. Season with salt.",
  "Melt half the butter in a wide pan over medium heat. Cook the chicken for 4 minutes a side, until it firms up and turns golden only lightly. Lift it out.",
  "Chop the onion and quarter the mushrooms. Fry the onion in the same pan for 5 minutes, until soft but not brown.",
