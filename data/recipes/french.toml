  { id = "whipping-cream", amount = 2, unit = "cup" },
  { id = "egg", amount = 6, unit = "large" },
  { id = "sugar", amount = 0.5, unit = "cup" },
  { id = "vanilla-beans", amount = 1, unit = "piece" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "l" },
]
steps = [
  "Heat the oven to 150°C. Split the vanilla beans and scrape out the seeds.",
  "Heat the double cream with the vanilla beans and seeds until steaming. Take off the heat and leave for 15 minutes.",
  "Separate the eggs, using only the yolks. Whisk the yolks with half the sugar and a little salt until pale. Strain the warm double cream over, whisking.",
  "Pour into small ramekins set in a deep roasting tin. Pour the water, hot, into the tin to come halfway up the ramekins.",
  "Bake for 30 to 35 minutes, until set at the edges with a slight wobble in the centre. Cool, then chill for at least 4 hours.",
  "Sprinkle the rest of the sugar over in a thin even layer and caramelise with a kitchen torch, or under a very hot grill, for 1 to 2 minutes until deep amber.",
  "Leave for 2 minutes so the sugar hardens, taste one and serve.",
]

[[recipe]]
id = "01a18c1a-e274-71eb-abbf-f561ec0bfebe"
name = "Tarte tatin"
serves = 8
prep_minutes = 20
cook_minutes = 50
ingredients = [
  { id = "apple", amount = 6, unit = "medium" },
  { id = "sugar", amount = 0.75, unit = "cup" },
  { id = "butter", amount = 0.33, unit = "cup" },
  { id = "puff-pastry", amount = 320, unit = "g" },
  { id = "lemon", amount = 0.5, unit = "small" },
  { id = "creme-fraiche", amount = 0.5, unit = "cup" },
]
steps = [
  "Heat the oven to 200°C. Peel, quarter and core the apples and toss them in the lemon juice.",
  "Melt the sugar in an ovenproof frying pan about 24 cm across over medium heat for 6 to 8 minutes, without stirring but swirling, until deep amber. Stir in the butter.",
  "Pack the apples in tightly, rounded side down. Cook for 10 to 12 minutes, until the caramel bubbles up and the apples start to soften.",
  "Roll the puff pastry into a round a little larger than the pan. Lay it over the apples and tuck the edges down inside the pan.",
  "Bake for 25 to 30 minutes, until the pastry is puffed and deep golden.",
  "Rest for 5 minutes, then put a plate over the pan and flip it out carefully.",
  "Taste and serve warm with the creme fraiche.",
]

[[recipe]]
id = "01a18c1a-e276-70f6-9c90-7482fa8cd145"
name = "Clafoutis"
serves = 6
prep_minutes = 15
cook_minutes = 40
ingredients = [
  { id = "cherries", amount = 500, unit = "g" },
  { id = "egg", amount = 3, unit = "large" },
  { id = "sugar", amount = 0.33, unit = "cup" },
  { id = "all-purpose-flour", amount = 0.5, unit = "cup" },
  { id = "milk", amount = 1.25, unit = "cup" },
  { id = "butter", amount = 1, unit = "tbsp" },
  { id = "vanilla-extract", amount = 1, unit = "tsp" },
  { id = "icing-sugar", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Heat the oven to 180°C. Butter a baking dish about 23 cm across.",
  "Pit the cherries, or leave them whole for the traditional almond flavour, and spread them in the dish.",
  "Whisk the eggs and sugar until frothy. Whisk in the all-purpose flour and a little salt until smooth, then the milk and vanilla extract.",
  "Pour the batter over the cherries.",
  "Bake for 35 to 40 minutes, until puffed, golden and set in the centre.",
  "Cool for 15 minutes. Taste and dust with the icing sugar. Serve warm.",
]

[[recipe]]
id = "01a18c1a-e279-7e60-ab6c-6f57abcd4c82"
name = "Pain perdu"
serves = 2
prep_minutes = 5
cook_minutes = 10
ingredients = [
  { id = "white-bread", amount = 4, unit = "slice" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "milk", amount = 0.5, unit = "cup" },
  { id = "sugar", amount = 2, unit = "tbsp" },
  { id = "vanilla-extract", amount = 0.5, unit = "tsp" },
  { id = "ground-cinnamon", amount = 0.25, unit = "tsp" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "icing-sugar", amount = 1, unit = "tsp" },
]
steps = [
  "Use thick slices of day-old white bread.",
  "Whisk the eggs, milk, sugar, vanilla extract and ground cinnamon in a shallow dish.",
  "Soak the bread in the mixture for 30 seconds a side, until soaked through but not falling apart.",
  "Melt half the butter in a frying pan over medium heat. Fry the bread for 2 to 3 minutes a side, until golden and crisp.",
  "Add the rest of the butter for the second batch.",
  "Taste and dust with the icing sugar. Serve hot.",
