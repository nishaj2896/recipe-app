  "Whisk the all-purpose flour, a spoonful of the sugar and a little salt. Make a well, add the eggs and a little of the milk and whisk to a smooth paste.",
  "Gradually whisk in the rest of the milk until the batter is thin and pourable. Melt the butter and stir in half of it. Rest for 30 minutes.",
  "Heat a non-stick pan about 20 cm across over medium heat and brush it with a little of the rest of the butter.",
