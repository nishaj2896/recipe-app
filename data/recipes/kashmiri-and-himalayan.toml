steps = [
  "Thinly slice the onions. Whisk the buttermilk with the gram flour until no lumps remain.",
  "Heat the mustard oil in a heavy pan over medium-high heat until it just smokes, then lower the heat to medium. Fry the cumin seeds, bay leaves, green and black cardamom and cloves for 30 seconds.",
  "Add the onions and fry for 10 minutes, until golden brown. Add the ginger garlic paste and fry for 1 minute.",
  "Add the mutton, turmeric, red chilli powder, coriander powder and salt and sear for 8 minutes, stirring, until browned.",
  "Add the water, cover and simmer on low heat for 45 to 50 minutes, until the mutton is nearly tender.",
  "Lower the heat to its lowest and pour in the buttermilk mixture slowly, stirring constantly. Simmer for 8 to 10 minutes, stirring, until the gravy thickens and turns smooth.",
  "Stir in the garam masala, taste for salt and serve hot.",
]

[[recipe]]
id = "01a18bb1-05b8-798b-b1d6-b0df8a8844c7"
name = "Babru"
serves = 4
prep_minutes = 25
cook_minutes = 25
ingredients = [
  { id = "whole-wheat-flour", amount = 2, unit = "cup" },
  { id = "whole-urad", amount = 0.5, unit = "cup" },
  { id = "active-dry-yeast", amount = 1, unit = "tsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "red-chilli-powder", amount = 0.5, unit = "tsp" },
  { id = "oil", amount = 2, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.75, unit = "cup" },
]
steps = [
  "Rinse the whole urad and soak it in plenty of water overnight. Drain, rub off as many skins as come away and grind coarsely with the ginger and green chillies, without adding water.",
  "Warm the water until it feels just warm on your wrist. Stir in the sugar and dry yeast and leave for 10 minutes, until foamy.",
  "Knead the whole wheat flour with salt and the yeast water for 6 to 8 minutes into a soft dough. Cover and leave for 1 hour, until puffy.",
  "Mix the urad paste with the cumin seeds, red chilli powder and salt.",
  "Divide the dough into balls about 5 cm across. Flatten each one, put a spoonful of the urad filling in the middle, seal and roll gently into a round about 12 cm across.",
  "Heat the oil for deep frying over medium heat. Fry each babru for 1 to 2 minutes per side, pressing gently so it puffs, until golden brown. Drain.",
  "Serve hot.",
]
