[[recipe]]
id = "01a18bb1-05a1-73ca-961f-164794f6a53a"
name = "Modur pulao"
serves = 4
prep_minutes = 15
cook_minutes = 30
ingredients = [
  { id = "basmati-rice", amount = 1.5, unit = "cup" },
  { id = "milk", amount = 1, unit = "cup" },
  { id = "sugar", amount = 0.5, unit = "cup" },
  { id = "ghee", amount = 4, unit = "tbsp" },
  { id = "saffron", amount = 1, unit = "pinch" },
  { id = "green-cardamom", amount = 4, unit = "piece" },
  { id = "cloves", amount = 4, unit = "piece" },
  { id = "cinnamon-sticks", amount = 1, unit = "piece" },
  { id = "cashews", amount = 12, unit = "piece" },
  { id = "almonds", amount = 12, unit = "piece" },
  { id = "raisins", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 2, unit = "cup" },
]
steps = [
  "Rinse the basmati rice in several changes of water until the water runs clear, then soak it in plenty of water for 20 minutes. Drain.",
  "Warm a spoonful of the milk and soak the saffron in it. Slice the almonds.",
  "Heat the ghee in a heavy pan over medium heat. Fry the cashews, almonds and raisins for 1 to 2 minutes, until the nuts are golden and the raisins puff. Lift them out.",
  "Fry the cardamom, cloves and cinnamon in the ghee for 30 seconds, then add the basmati rice and stir gently for 2 minutes, until the grains turn opaque.",
  "Add the water, the rest of the milk and salt and bring to a boil. Cover and cook on the lowest heat for 10 minutes, until most of the liquid is absorbed.",
  "Scatter the sugar and saffron milk over without stirring. Cover again and cook for 8 to 10 minutes, until the sugar melts into the grains and they are tender.",
  "Fold in the nuts and raisins gently. Taste and serve warm.",
]

