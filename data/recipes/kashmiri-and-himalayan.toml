steps = [
  "Grind the fennel seeds to a fine powder. Peel the green cardamom and crush the seeds.",
  "Pound the lamb mince in a mortar or pulse it in a food processor with half the ghee, a little of the crushed cardamom and salt for 8 to 10 minutes, until it turns into a smooth, sticky paste.",
