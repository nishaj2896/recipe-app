[[recipe]]
id = "01a18bb1-05b1-7199-8baa-c57efd50eb5f"
name = "Siddu"
serves = 4
prep_minutes = 25
cook_minutes = 25
ingredients = [
  { id = "whole-wheat-flour", amount = 2, unit = "cup" },
  { id = "active-dry-yeast", amount = 1, unit = "tsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "walnuts", amount = 0.5, unit = "cup" },
  { id = "poppy-seeds", amount = 2, unit = "tbsp" },
  { id = "onion", amount = 1, unit = "small" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "ghee", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.75, unit = "cup" },
]
steps = [
  "Warm the water until it feels just warm on your wrist. Stir in the sugar and dry yeast and leave for 10 minutes, until foamy.",
  "Knead the whole wheat flour with salt and the yeast water for 8 minutes into a soft, smooth dough. Cover and leave in a warm place for 1 hour, until doubled.",
  "Dry-roast the walnuts and poppy seeds in a pan over low heat for 3 minutes, until fragrant. Grind them coarsely with the green chillies and salt, then mix in the finely chopped onion and coriander leaves.",
  "Divide the dough into balls about 6 cm across. Flatten each into a round about 12 cm across, put a spoonful of filling in the middle, gather the edges and seal. Flatten gently into an oval.",
