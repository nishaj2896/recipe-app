[[recipe]]
id = "01a18bb1-0599-7033-996a-0c33915b7e19"
name = "Mutton yakhni"
serves = 4
prep_minutes = 15
cook_minutes = 85
ingredients = [
  { id = "mutton", amount = 750, unit = "g" },
  { id = "curd", amount = 2, unit = "cup" },
  { id = "fennel-seeds", amount = 2, unit = "tsp" },
  { id = "dry-ginger-powder", amount = 1, unit = "tsp" },
  { id = "green-cardamom", amount = 4, unit = "piece" },
  { id = "black-cardamom", amount = 2, unit = "piece" },
  { id = "cloves", amount = 4, unit = "piece" },
  { id = "cinnamon-sticks", amount = 1, unit = "piece" },
  { id = "bay-leaves", amount = 2, unit = "leaf" },
  { id = "asafoetida", amount = 1, unit = "pinch" },
  { id = "dried-mint", amount = 1, unit = "tsp" },
  { id = "black-cumin", amount = 0.5, unit = "tsp" },
  { id = "mustard-oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 4, unit = "cup" },
]
steps = [
  "Grind the fennel seeds to a fine powder. Lightly crush the green and black cardamom.",
  "Put the mutton in a heavy pan with the water, the black cardamom, cloves, cinnamon, bay leaves and salt. Bring to a boil over medium heat, skim off the foam, then simmer covered on low heat for 55 to 60 minutes, until the mutton is tender.",
  "Whisk the curd in a separate heavy pan until completely smooth, then stir in a ladle of the mutton stock.",
  "Set the curd pan over low heat and bring it slowly to a simmer, stirring constantly in one direction for 8 to 10 minutes, so that it doesn't split, until it thickens slightly and turns glossy.",
  "Stir the ground fennel seeds and dry ginger powder into the curd, then add the mutton and as much stock as you need for a pouring gravy. Simmer for 10 minutes, until the gravy coats the mutton.",
  "Heat the mustard oil in a small pan over medium heat until it just smokes. Lower the heat, add the green cardamom, black cumin and asafoetida and fry for 20 seconds. Pour it over the yakhni.",
  "Crumble the dried mint over, taste for salt and serve hot.",
]

[[recipe]]
id = "01a18bb1-059b-75c8-9915-6cfb22b09272"
name = "Kashmiri rajma"
serves = 4
prep_minutes = 10
cook_minutes = 70
ingredients = [
  { id = "kidney-beans", amount = 1, unit = "cup" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "kashmiri-chilli-powder", amount = 2, unit = "tsp" },
  { id = "fennel-seeds", amount = 1.5, unit = "tsp" },
  { id = "dry-ginger-powder", amount = 1, unit = "tsp" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "asafoetida", amount = 1, unit = "pinch" },
  { id = "cloves", amount = 3, unit = "piece" },
  { id = "cinnamon-sticks", amount = 1, unit = "piece" },
  { id = "garam-masala", amount = 0.5, unit = "tsp" },
  { id = "turmeric", amount = 0.25, unit = "tsp" },
  { id = "mustard-oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 5, unit = "cup" },
]
steps = [
  "Rinse the kidney beans and soak them overnight in plenty of water. Drain.",
  "Simmer the kidney beans in the water with salt in a covered pan over medium-low heat for 50 to 60 minutes, until they crush easily between your fingers. Keep the cooking liquid.",
  "Grind the fennel seeds to a fine powder. Blend the tomatoes smooth.",
  "Heat the mustard oil in a heavy pan over medium-high heat until it just smokes, then lower the heat to medium. Fry the cumin seeds, cloves, cinnamon and asafoetida for 30 seconds.",
  "Take the pan off the heat, stir in the Kashmiri chilli powder and turmeric with a splash of the bean liquid so the chilli doesn't burn, then return to the heat and add the blended tomatoes. Cook for 6 minutes, until thick and the mustard oil separates.",
  "Add the kidney beans with their liquid, the ground fennel seeds and dry ginger powder. Simmer for 10 minutes, mashing a few beans against the pan, until the gravy is thick and deep red.",
  "Stir in the garam masala. Taste for salt and serve hot.",
]

