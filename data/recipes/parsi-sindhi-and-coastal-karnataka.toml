[[recipe]]
id = "01a18bba-7837-7a19-8c57-dc1766a2eb87"
name = "Dhansak"
serves = 6
prep_minutes = 20
cook_minutes = 100
ingredients = [
  { id = "mutton", amount = 750, unit = "g" },
  { id = "toor-dal", amount = 0.5, unit = "cup" },
  { id = "masoor-dal", amount = 0.25, unit = "cup" },
  { id = "moong-dal", amount = 0.25, unit = "cup" },
  { id = "pumpkin", amount = 200, unit = "g" },
  { id = "brinjal", amount = 1, unit = "small" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "fenugreek-leaves", amount = 0.5, unit = "cup" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "ginger-garlic-paste", amount = 2, unit = "tbsp" },
  { id = "green-chillies", amount = 3, unit = "piece" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "kashmiri-chilli-powder", amount = 2, unit = "tsp" },
  { id = "coriander-powder", amount = 2, unit = "tsp" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "garam-masala", amount = 1.5, unit = "tsp" },
  { id = "tamarind", amount = 1, unit = "tbsp" },
  { id = "jaggery", amount = 1, unit = "tbsp" },
  { id = "mint", amount = 2, unit = "tbsp" },
  { id = "coriander-leaves", amount = 3, unit = "tbsp" },
  { id = "ghee", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 7, unit = "cup" },
]
steps = [
  "Rinse the toor dal, masoor dal and moong dal together in several changes of water. Peel and cube the pumpkin, cube the brinjal and chop the tomatoes. Soak the tamarind in a little of the water for 10 minutes, squeeze and strain.",
  "Simmer the mutton with half the ginger garlic paste, salt and half the rest of the water in a covered pan over low heat for 50 to 60 minutes, until tender.",
  "Meanwhile, simmer the dals, pumpkin, brinjal, tomatoes, fenugreek leaves, green chillies and turmeric with the rest of the water in a covered pan for 35 to 40 minutes, until everything is very soft. Blend to a smooth purée.",
  "Thinly slice the onions. Heat the ghee in a heavy pan over medium heat and fry them for 10 minutes, until golden brown.",
  "Add the rest of the ginger garlic paste, the Kashmiri chilli powder, coriander powder, cumin powder and garam masala and fry for 1 minute, until fragrant.",
  "Add the blended dal, the mutton with its stock, the tamarind liquid and jaggery. Simmer for 15 minutes, stirring often, until thick and well blended.",
  "Stir in the mint and coriander leaves. Taste and balance the salt, sweet and sour. Serve hot with caramelised onion pulao and kachumber.",
]

[[recipe]]
id = "01a18bba-783a-7f89-9156-96d4c76b0195"
name = "Sali boti"
serves = 4
prep_minutes = 15
cook_minutes = 90
ingredients = [
  { id = "mutton", amount = 750, unit = "g" },
  { id = "onion", amount = 3, unit = "medium" },
  { id = "tomato", amount = 3, unit = "medium" },
  { id = "ginger-garlic-paste", amount = 1.5, unit = "tbsp" },
  { id = "kashmiri-chilli-powder", amount = 2, unit = "tsp" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "garam-masala", amount = 1, unit = "tsp" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "jaggery", amount = 1.5, unit = "tbsp" },
  { id = "white-vinegar", amount = 2, unit = "tbsp" },
  { id = "potato", amount = 2, unit = "large" },
  { id = "oil", amount = 2.5, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 2.5, unit = "cup" },
]
steps = [
  "Cut the mutton into small boneless cubes. Thinly slice the onions and chop the tomatoes.",
  "Heat a few spoonfuls of the oil in a heavy pan over medium heat. Fry the onions for 12 minutes, until deep golden.",
  "Add the ginger garlic paste for 1 minute, then the mutton, turmeric, Kashmiri chilli powder and salt. Sear for 8 minutes, until browned.",
  "Add the tomatoes and cook for 5 minutes, until soft. Add the water, cover and simmer on low heat for 50 to 60 minutes, until the mutton is tender.",
  "Stir in the jaggery, white vinegar, garam masala and cumin powder and simmer for 5 minutes, until the gravy is thick and glossy. Taste and balance the sweet and sour.",
  "For the sali, peel the potatoes and cut them into very thin matchsticks. Rinse in several changes of water and dry completely on a cloth.",
  "Heat the rest of the oil for deep frying over medium heat. Fry the potato sticks in batches for 3 to 4 minutes, until golden and crisp. Drain and salt them.",
  "Serve the mutton hot, piled high with the sali.",
]

