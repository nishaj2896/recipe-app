[[recipe]]
id = "01a18bba-7857-7483-a9b8-9ccc5aea5eb1"
name = "Goli baje"
serves = 4
prep_minutes = 15
cook_minutes = 20
plan_ahead = { wait_minutes = 120, note = "rest the batter for 2 hours" }
ingredients = [
  { id = "all-purpose-flour", amount = 1, unit = "cup" },
  { id = "rice-flour", amount = 2, unit = "tbsp" },
  { id = "curd", amount = 0.5, unit = "cup" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "curry-leaves", amount = 1, unit = "sprig" },
  { id = "coconut", amount = 2, unit = "tbsp" },
  { id = "cumin-seeds", amount = 0.5, unit = "tsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "baking-soda", amount = 0.25, unit = "tsp" },
  { id = "oil", amount = 2, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.25, unit = "cup" },
]
steps = [
  "Finely chop the ginger, green chillies and curry leaves. Cut the coconut into tiny pieces.",
  "Mix the all-purpose flour, rice flour, curd, sugar, salt and the water into a very thick, sticky batter. Beat hard for 3 minutes, until smooth and stretchy.",
  "Mix in the ginger, green chillies, curry leaves, coconut and cumin seeds. Rest for 2 hours.",
