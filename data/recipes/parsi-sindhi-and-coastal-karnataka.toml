serves = 6
prep_minutes = 15
cook_minutes = 90
plan_ahead = { wait_minutes = 180, note = "chill for 3 hours" }
ingredients = [
  { id = "milk", amount = 4, unit = "cup" },
  { id = "condensed-milk", amount = 0.5, unit = "cup" },
  { id = "egg", amount = 4, unit = "large" },
  { id = "sugar", amount = 0.25, unit = "cup" },
  { id = "nutmeg", amount = 0.25, unit = "tsp" },
  { id = "green-cardamom", amount = 3, unit = "piece" },
  { id = "vanilla-extract", amount = 1, unit = "tsp" },
  { id = "almonds", amount = 10, unit = "piece" },
  { id = "charoli", amount = 1, unit = "tbsp" },
  { id = "butter", amount = 1, unit = "tsp" },
  { id = "water", amount = 4, unit = "cup" },
]
steps = [
  "Simmer the milk in a heavy pan over medium heat for 30 to 35 minutes, stirring often, until reduced by about a third. Stir in the condensed milk and sugar and cool until lukewarm.",
  "Heat the oven to 160°C and grease a baking dish about 20 cm across with the butter.",
  "Beat the eggs lightly, then whisk them into the milk with the grated nutmeg, crushed cardamom seeds and vanilla extract. Strain into the dish.",
  "Slice the almonds and scatter them over the top with the charoli.",
  "Stand the dish in a deep roasting tin and pour the water, hot, into the tin to come halfway up the sides.",
  "Bake for 45 to 50 minutes, until the top is browned in spots and the custard is set with a slight wobble in the centre.",
  "Cool, then chill for a few hours before serving.",
