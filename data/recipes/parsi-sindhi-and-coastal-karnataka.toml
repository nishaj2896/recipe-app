[[recipe]]
id = "01a18bba-7855-73e1-b3e2-b6d27f8a973e"
name = "Bohri dabba gosht"
serves = 6
prep_minutes = 20
cook_minutes = 100
ingredients = [
  { id = "mutton", amount = 500, unit = "g" },
  { id = "pasta", amount = 150, unit = "g" },
  { id = "milk", amount = 2, unit = "cup" },
  { id = "egg", amount = 3, unit = "large" },
  { id = "all-purpose-flour", amount = 2, unit = "tbsp" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "ginger-garlic-paste", amount = 1, unit = "tbsp" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "black-pepper", amount = 1, unit = "tsp" },
