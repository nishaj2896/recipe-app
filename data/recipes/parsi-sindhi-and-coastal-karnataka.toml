[[recipe]]
id = "01a18bba-7859-7e71-9f86-28de38776ad3"
name = "Patrode"
serves = 4
prep_minutes = 40
cook_minutes = 50
plan_ahead = { wait_minutes = 180, note = "soak for 3 hours" }
ingredients = [
  { id = "colocasia-leaves", amount = 10, unit = "piece" },
  { id = "rice", amount = 1, unit = "cup" },
  { id = "coconut", amount = 0.5, unit = "cup" },
  { id = "dried-red-chillies", amount = 8, unit = "piece" },
  { id = "coriander-seeds", amount = 1, unit = "tbsp" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "tamarind", amount = 1, unit = "tbsp" },
  { id = "jaggery", amount = 2, unit = "tbsp" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "mustard-seeds", amount = 0.5, unit = "tsp" },
  { id = "curry-leaves", amount = 1, unit = "sprig" },
  { id = "coconut-oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1.5, unit = "cup" },
]
steps = [
  "Rinse the rice and soak it for 3 hours. Drain.",
  "Grind the rice with the coconut, dried red chillies, coriander seeds, cumin seeds, tamarind, jaggery, turmeric, salt and a little of the water to a thick, smooth paste.",
  "Wash the colocasia leaves and pat them dry. Shave off the thick veins on the back with a knife so the leaves lie flat.",
  "Lay a large leaf shiny side down and spread a thin layer of paste over it. Lay a smaller leaf on top and spread again. Repeat with a few leaves.",
  "Fold in the sides and roll up tightly from the stem end into a log. Repeat with the rest of the leaves and paste.",
  "Steam the rolls over the rest of the water, boiling, for 35 to 40 minutes, until a knife slides through easily. Cool and slice into rounds about 1.5 cm thick.",
  "Heat the coconut oil in a pan over medium heat. Fry the mustard seeds until they pop, then the curry leaves. Shallow-fry the slices for 2 minutes per side, until crisp. Taste one for salt and serve hot.",
]
