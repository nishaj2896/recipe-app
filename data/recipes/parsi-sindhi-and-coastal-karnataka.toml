  "Add the spice paste and fry for 3 minutes, until it darkens and smells toasty.",
  "Add the chicken and fry for 5 minutes. Add the rest of the water, cover and cook on low heat for 15 to 18 minutes, until the chicken is cooked through.",
  "Add the coconut and stir-fry uncovered on medium heat for 6 to 8 minutes, until the masala is dry and clings to the chicken.",
  "Taste for salt and serve hot with neer dosa or chapatis.",
]

