  "Rinse the moong dal and soak it in plenty of water for 2 hours. Drain and grind coarsely without water.",
  "Rub the ghee into the all-purpose flour with salt until it holds together when pressed. Knead with as little of the water as needed into a firm dough. Rest for 20 minutes.",
  "Coarsely crush the fennel seeds and coriander seeds. Heat a spoonful of the oil in a pan over low heat and fry them with the asafoetida for 30 seconds, then add the dal paste, red chilli powder, dry mango powder, garam masala and salt. Stir for 5 minutes, until dry and crumbly. Cool.",
  "Divide the dough into balls about 4 cm across. Flatten each, fill with a spoonful of dal filling, seal and press gently into a round about 7 cm across.",
  "Heat the frying oil over low heat. Fry the kachoris slowly for 12 to 15 minutes, turning, until they puff, turn deep golden and sound hollow when tapped. Drain.",
  "For the sabzi, boil the potatoes in their skins for 15 to 20 minutes, until tender, then peel and break them by hand. Blend the tomatoes, ginger and green chillies.",
  "Heat a spoonful of the oil in a pan over medium heat. Fry the cumin seeds for 30 seconds, then the tomato mixture, turmeric, coriander powder and salt for 5 minutes. Add the potatoes and the rest of the water and simmer for 8 minutes, until slightly thick.",
  "Taste for salt, scatter the coriander leaves over and serve the sabzi hot with the kachoris.",
]

[[recipe]]
id = "01a18bb7-fecb-7d67-9535-f5add0eb2f4e"
