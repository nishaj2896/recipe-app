[[recipe]]
id = "01a18bb7-fec4-7656-a6b2-1e578490c3c9"
name = "Chole bhature"
serves = 4
prep_minutes = 30
cook_minutes = 80
plan_ahead = { wait_minutes = 600, note = "soak overnight" }
image = { file = "01a18bb7-fec4-7656-a6b2-1e578490c3c9.webp", sha256 = "12653655000f8b667818e744a02316ed0b65b616f9ebb8f5b8464e7ba273f6b0", alt = "Chole in a small bowl with a puffed bhatura and sliced onion" }
ingredients = [
  { id = "chickpeas", amount = 1, unit = "cup" },
  { id = "black-tea", amount = 1, unit = "tbsp" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "ginger-garlic-paste", amount = 1, unit = "tbsp" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "chole-masala", amount = 2, unit = "tbsp" },
  { id = "red-chilli-powder", amount = 1, unit = "tsp" },
  { id = "dry-mango-powder", amount = 1, unit = "tsp" },
  { id = "bay-leaves", amount = 1, unit = "leaf" },
  { id = "all-purpose-flour", amount = 2, unit = "cup" },
  { id = "semolina", amount = 2, unit = "tbsp" },
  { id = "curd", amount = 0.5, unit = "cup" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "baking-soda", amount = 0.25, unit = "tsp" },
  { id = "oil", amount = 2.5, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 5, unit = "cup" },
]
steps = [
  "Rinse the chickpeas and soak them overnight in plenty of water. Drain.",
  "Tie the black tea in a square of muslin. Simmer the chickpeas with most of the water, the tea bundle, bay leaf and salt in a covered pan over medium-low heat for 50 to 60 minutes, until very soft and dark. Discard the tea bundle.",
  "For the bhature, mix the all-purpose flour, semolina, sugar, baking soda and salt. Add the curd and a spoonful of the oil and knead with as much of the rest of the water as needed into a soft, smooth dough. Cover and rest for 2 hours.",
  "Finely chop the onions and tomatoes. Heat a few spoonfuls of the oil in a heavy pan over medium heat and fry the onions for 8 minutes, until golden brown.",
  "Add the ginger garlic paste and green chillies for 1 minute, then the tomatoes, chole masala and red chilli powder and cook for 6 to 8 minutes, until the oil separates.",
  "Add the chickpeas with their liquid and simmer for 15 minutes, mashing a few, until thick and dark. Stir in the dry mango powder and taste for salt.",
  "Heat the rest of the oil for deep frying over medium-high heat. Roll balls of dough into ovals about 18 cm long and fry one at a time, pressing gently so it balloons, for 1 minute per side, until puffed and light golden.",
  "Serve the bhature straight away with the hot chole and sliced onion.",
]

