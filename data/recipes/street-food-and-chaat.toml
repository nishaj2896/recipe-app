[[recipe]]
id = "01a18bb5-de60-7c32-a24f-28041b37426d"
name = "Pani puri"
serves = 4
prep_minutes = 45
cook_minutes = 25
plan_ahead = { wait_minutes = 480, note = "soak overnight" }
image = { file = "01a18bb5-de60-7c32-a24f-28041b37426d.webp", sha256 = "2a268f29d86e01ef7663b630bac87f8b6b27219b2b0beacecc0fbfe8d8f84b48", alt = "Pani puri with potato and chickpea filling, beside a glass of spiced water" }
ingredients = [
  { id = "semolina", amount = 0.5, unit = "cup" },
  { id = "all-purpose-flour", amount = 2, unit = "tbsp" },
  { id = "potato", amount = 2, unit = "medium" },
  { id = "black-chickpeas", amount = 0.33, unit = "cup" },
  { id = "mint", amount = 1, unit = "cup" },
  { id = "coriander-leaves", amount = 0.5, unit = "cup" },
  { id = "green-chillies", amount = 3, unit = "piece" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "tamarind", amount = 1, unit = "tbsp" },
  { id = "cumin-powder", amount = 1.5, unit = "tsp" },
  { id = "black-salt", amount = 1, unit = "tsp" },
  { id = "chaat-masala", amount = 1, unit = "tsp" },
  { id = "red-chilli-powder", amount = 0.5, unit = "tsp" },
  { id = "tamarind-chutney", amount = 0.33, unit = "cup" },
  { id = "boondi", amount = 0.25, unit = "cup" },
  { id = "oil", amount = 2, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 5, unit = "cup" },
]
steps = [
  "Rinse the black chickpeas and soak them overnight in plenty of water. Drain.",
  "Knead the semolina and all-purpose flour with a little salt and just enough of the water into a stiff dough. Cover with a damp cloth and rest for 20 minutes.",
  "Roll the dough very thinly, about 1 mm thick, and cut into rounds about 5 cm across. Keep them covered.",
  "Heat the oil for deep frying over medium-high heat. Fry the rounds a few at a time, pressing each one gently with a slotted spoon until it puffs, then fry for 1 to 2 minutes, until crisp and golden. Drain and cool.",
  "Boil the potatoes in their skins and the black chickpeas in a separate pan for about 25 minutes, until both are tender. Peel and dice the potatoes and mix with the black chickpeas, red chilli powder, half the chaat masala and salt.",
  "Soak the tamarind in a little of the water for 10 minutes, squeeze and strain. Blend the mint, coriander leaves, green chillies and ginger with a little more of the water to a smooth paste.",
  "Stir the paste, tamarind liquid, cumin powder, black salt and the rest of the chaat masala into the rest of the water. Chill and taste; it should be sharp, spicy and tangy. Add the boondi.",
  "To serve, crack a hole in the top of each puri, fill with a little potato mixture and a dab of tamarind chutney, then dip in the spiced water and eat at once.",
]

