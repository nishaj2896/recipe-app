  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "For the filling, heat a spoonful of the ghee in a pan over medium heat. Toast the poppy seeds for 30 seconds.",
  "Add the grated coconut and jaggery and cook for 6 to 8 minutes, stirring, until the jaggery melts and the mixture turns sticky and comes together.",
  "Crush the cardamom and grind the seeds. Stir them in with the nutmeg and let the filling cool.",
  "For the dough, bring the water to a boil with the salt and a spoonful of the ghee.",
  "Turn the heat to low and add the rice flour all at once. Stir quickly until it absorbs the water, then cover and steam on low heat for 5 minutes.",
  "Tip the dough onto a plate. While it is still warm, knead it with greased hands until very smooth and soft.",
  "Take a ball of dough about 4 cm across and press it into a thin cup with your thumbs. Pinch the edges into pleats all round.",
  "Put a spoonful of filling in the centre and gather the pleats together to a point at the top. Seal well.",
  "Steam the modaks on a greased plate for 10 to 12 minutes, until they turn glossy and slightly translucent.",
  "Serve warm, with a little of the rest of the ghee poured over.",
]

