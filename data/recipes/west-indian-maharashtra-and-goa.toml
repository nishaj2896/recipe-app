[[recipe]]
id = "01a15175-3c14-7cfa-a4d1-5f700c77cb53"
name = "Kanda poha"
serves = 4
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "flattened-rice", amount = 200, unit = "g" },
  { id = "onion", amount = 1, unit = "large" },
  { id = "peanuts", amount = 30, unit = "g" },
  { id = "mustard-seeds", amount = 1, unit = "tsp" },
  { id = "curry-leaves", amount = 10, unit = "leaf" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "lemon", amount = 1, unit = "piece" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "salt", to_taste = true },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
]
steps = [
  "Put the flattened rice in a sieve and rinse it under the tap for 10 to 15 seconds, just until soft. Leave it to drain for 5 minutes.",
  "Toss the flattened rice gently with the salt and sugar.",
  "Finely chop the onion and green chillies.",
  "Heat the oil in a wide pan over medium heat. Fry the peanuts for 2 minutes, until crisp and golden.",
  "Add the mustard seeds and wait until they pop. Add the curry leaves and green chillies.",
  "Add the onion and cook for 3 minutes, until soft and translucent. Stir in the turmeric.",
  "Add the flattened rice and toss gently over low heat for 3 minutes, until hot and evenly yellow.",
  "Turn off the heat, squeeze over the lemon juice, scatter the coriander leaves over and serve straight away.",
]
