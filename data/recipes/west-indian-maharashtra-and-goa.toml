name = "Pithla bhakri"
serves = 4
prep_minutes = 15
cook_minutes = 30
ingredients = [
  { id = "gram-flour", amount = 0.5, unit = "cup" },
  { id = "sorghum-flour", amount = 2, unit = "cup" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "green-chillies", amount = 3, unit = "piece" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "mustard-seeds", amount = 1, unit = "tsp" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "turmeric", amount = 0.25, unit = "tsp" },
  { id = "curry-leaves", amount = 1, unit = "sprig" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 3, unit = "cup" },
]
steps = [
  "For the bhakri, put the sorghum flour in a bowl with some of the salt. Bring half the water to a boil, add it slowly and mix with a spoon, then knead into a smooth, soft dough.",
  "Take a ball of dough about 6 cm across. On a floured board, pat it out with your palm, turning, into a round about 5 mm thick.",
  "Cook it on a hot griddle over medium heat for 2 minutes. Brush the top with a little of the remaining hot liquid, flip and cook for 2 minutes more, then hold it over a flame for a few seconds, until it puffs in spots. Repeat with the rest.",
  "For the pithla, whisk the gram flour with the rest of the water and salt into a smooth, thin batter.",
  "Chop the onion, green chillies, garlic and coriander leaves.",
