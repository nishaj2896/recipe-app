steps = [
  "Peel and devein the prawns. Toss them with half the turmeric and salt.",
  "Grind the grated coconut with a splash of the water into a smooth paste. Chop the onions and tomatoes finely.",
  "Heat the oil in a pan over medium heat. Cook the onions for 6 to 8 minutes, until golden. Stir in the ginger garlic paste for 1 minute.",
  "Add the tomatoes, red chilli powder, coriander powder and the rest of the turmeric. Cook for 6 minutes, until the tomatoes are soft and the oil separates.",
  "Add the coconut paste and fry for 3 minutes.",
  "Pour in the rest of the water with the kokum and simmer for 3 minutes.",
  "Add the prawns and cook for 3 to 4 minutes, until they curl and turn pink. Don't overcook, or they turn rubbery.",
