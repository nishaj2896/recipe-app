serves = 12
prep_minutes = 40
cook_minutes = 30
ingredients = [
  { id = "rice-flour", amount = 1, unit = "cup" },
  { id = "coconut", amount = 1.5, unit = "cup" },
  { id = "jaggery", amount = 0.75, unit = "cup" },
