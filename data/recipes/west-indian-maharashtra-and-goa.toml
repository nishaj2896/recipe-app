[[recipe]]
id = "01a18b58-5311-7987-a318-a0a7e201d8e8"
name = "Puran poli"
serves = 8
prep_minutes = 30
cook_minutes = 60
ingredients = [
  { id = "chana-dal", amount = 1, unit = "cup" },
  { id = "jaggery", amount = 1, unit = "cup" },
  { id = "whole-wheat-flour", amount = 1, unit = "cup" },
  { id = "all-purpose-flour", amount = 0.5, unit = "cup" },
  { id = "green-cardamom", amount = 5, unit = "piece" },
  { id = "nutmeg", amount = 1, unit = "pinch" },
  { id = "turmeric", amount = 1, unit = "pinch" },
  { id = "ghee", amount = 0.33, unit = "cup" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 4, unit = "cup" },
]
steps = [
  "Rinse the chana dal and pressure cook it with most of the water for 4 whistles, until soft but not mushy. Drain well, keeping the liquid for a katachi amti if you like.",
  "Put the dal and jaggery in a heavy pan over medium heat. Cook for 15 to 20 minutes, stirring constantly, until the mixture thickens and a spoon stands upright in it.",
  "Crush the cardamom and grind the seeds. Stir them in with the nutmeg. Cool, then mash or grind the filling until smooth. This is the puran.",
  "For the dough, mix the whole wheat flour, all-purpose flour, turmeric and salt. Add the rest of the water slowly and knead into a very soft, stretchy dough. Knead in the oil and rest for 30 minutes.",
  "Divide the dough and the puran into balls, with each puran ball about twice the size of each dough ball.",
  "Flatten a dough ball into a small cup, put a puran ball in the centre, and pinch the edges together over it to seal.",
  "Dust with flour and roll out very gently into a thin round about 20 cm across, without letting the filling burst through.",
  "Cook on a hot griddle over medium heat for 1 to 2 minutes per side, until golden spots appear. Spread a little ghee on both sides.",
  "Serve warm, with a little more of the ghee on top.",
]

