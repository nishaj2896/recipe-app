[[recipe]]
id = "01a18b58-52db-7585-b481-44042529cb38"
name = "Sabudana khichdi"
serves = 3
prep_minutes = 10
cook_minutes = 15
plan_ahead = { wait_minutes = 360, note = "soak for 6 hours" }
ingredients = [
  { id = "sago", amount = 1, unit = "cup" },
  { id = "potato", amount = 1, unit = "medium" },
  { id = "peanuts", amount = 0.5, unit = "cup" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "cumin-seeds", amount = 1, unit = "tsp" },
  { id = "curry-leaves", amount = 1, unit = "sprig" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "lemon", amount = 1, unit = "small" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "ghee", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.75, unit = "cup" },
]
steps = [
  "Rinse the sago until the liquid runs clear. Soak it in the water, just enough to cover, for 6 hours or overnight, until each pearl is soft and swollen and presses flat between your fingers.",
  "Dry roast the peanuts over medium heat for 5 minutes, until they crackle. Cool, rub off the skins and crush them coarsely.",
  "Toss the sago with the crushed peanuts, salt and sugar.",
  "Peel the potato, boil it until tender and cut it into small cubes. Chop the green chillies.",
  "Heat the ghee in a wide pan over medium heat. Add the cumin seeds and let them sizzle, then the curry leaves and green chillies.",
  "Add the potato and fry for 2 minutes.",
  "Add the sago mixture and cook on low heat for 5 to 7 minutes, stirring gently, until the pearls turn translucent. Don't overcook, or it turns sticky.",
  "Squeeze over the lemon juice and scatter the coriander leaves over. Taste for salt and serve hot.",
]

