[[recipe]]
id = "01a15175-3c16-7eb1-a711-d43ee35c650f"
name = "Masala omelette"
serves = 2
prep_minutes = 5
cook_minutes = 5
ingredients = [
  { id = "egg", amount = 4, unit = "piece" },
  { id = "onion", amount = 1, unit = "small" },
  { id = "tomato", amount = 1, unit = "small" },
  { id = "green-chillies", amount = 1, unit = "piece" },
  { id = "coriander-leaves", amount = 1, unit = "tbsp" },
  { id = "red-chilli-powder", amount = 0.25, unit = "tsp" },
  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Finely chop the onion, tomato, green chilli and coriander leaves.",
  "Beat the eggs in a bowl with the red chilli powder and salt until frothy.",
  "Stir in the chopped vegetables and herbs.",
  "Heat half the oil in a frying pan over medium heat. Pour in half the egg mixture and tilt the pan to spread it evenly.",
  "Cook for 2 minutes, until the underside is golden and the top is almost set.",
  "Flip and cook for 1 minute more.",
  "Repeat with the rest of the oil and egg mixture. Serve hot with toast.",
]

[[recipe]]
id = "01a15175-3c18-79cf-a283-c1a2dae07776"
name = "Egg bhurji"
serves = 2
prep_minutes = 5
cook_minutes = 10
ingredients = [
  { id = "egg", amount = 4, unit = "piece" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "tomato", amount = 1, unit = "medium" },
  { id = "green-chillies", amount = 1, unit = "piece" },
  { id = "turmeric", amount = 0.25, unit = "tsp" },
  { id = "butter", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "coriander-leaves", amount = 1, unit = "tbsp" },
]
steps = [
  "Finely chop the onion, tomato and green chilli.",
  "Melt the butter in a pan over medium heat. Add the onion and green chilli and cook for 3 minutes, until soft.",
  "Add the tomato, turmeric and salt and cook for 2 minutes, until the tomato softens.",
  "Beat the eggs and pour them into the pan.",
  "Lower the heat and stir slowly for 2 to 3 minutes, until the eggs set into soft, creamy lumps.",
  "Take the pan off the heat while the eggs still look slightly moist; they keep cooking.",
  "Scatter the coriander leaves over and serve with toast.",
]
