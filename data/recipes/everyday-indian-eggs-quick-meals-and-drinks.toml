  { id = "ghee", amount = 3, unit = "tbsp" },
  { id = "milk", amount = 1, unit = "cup" },
  { id = "green-cardamom", amount = 3, unit = "piece" },
  { id = "cashews", amount = 8, unit = "piece" },
]
steps = [
  "Heat the ghee in a pan over medium heat. Fry the cashews for 1 minute, until golden. Lift them out.",
  "Roast the semolina in the ghee on low heat for 5 minutes, until fragrant.",
  "Warm the milk and add it slowly, stirring. Cook for 2 minutes, until thick.",
  "Add the sugar and the banana, mashed with a fork, and stir for 3 minutes, until glossy.",
  "Crush the cardamom seeds, stir them in with the cashews, and serve warm.",
]

[[recipe]]
id = "01a18bae-8f3d-714c-aeef-3a819014d2ed"
name = "Sweet lassi"
serves = 2
prep_minutes = 5
cook_minutes = 0
ingredients = [
  { id = "curd", amount = 2, unit = "cup" },
  { id = "sugar", amount = 3, unit = "tbsp" },
  { id = "green-cardamom", amount = 2, unit = "piece" },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Peel the cardamom pods and crush the seeds finely.",
  "Whisk the curd, sugar and crushed cardamom in a jug for 1 to 2 minutes, until the sugar dissolves and the curd is smooth and frothy.",
  "Whisk in the water a little at a time, until the lassi is thick but pourable.",
  "Taste and add more sugar if you like. Serve cold in tall glasses.",
]

[[recipe]]
id = "01a18bae-8f40-7662-8237-31e6885aeeff"
name = "Ginger lemon tea"
serves = 2
prep_minutes = 5
cook_minutes = 6
ingredients = [
  { id = "water", amount = 2, unit = "cup" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "black-tea", amount = 1.5, unit = "tsp" },
  { id = "lemon", amount = 1, unit = "small" },
  { id = "honey", amount = 2, unit = "tsp" },
]
steps = [
  "Peel the ginger and crush it lightly with the flat of a knife.",
  "Bring the water and ginger to a boil in a small pan over medium-high heat, then simmer for 3 to 4 minutes, until the water smells strongly of ginger.",
  "Add the black tea, take the pan off the heat and steep for 2 minutes, until amber.",
  "Strain into cups. Squeeze in the lemon juice and stir in the honey.",
  "Taste and add more honey or lemon. Serve hot.",
]

[[recipe]]
id = "01a18bae-8f42-72fb-a65a-1d1bbd822900"
name = "Haldi doodh"
serves = 2
prep_minutes = 5
cook_minutes = 8
ingredients = [
  { id = "milk", amount = 2, unit = "cup" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "ginger", amount = 1, unit = "piece" },
  { id = "black-pepper", amount = 0.25, unit = "tsp" },
  { id = "ground-cinnamon", amount = 0.25, unit = "tsp" },
  { id = "jaggery", amount = 1, unit = "tbsp" },
]
steps = [
  "Peel and finely grate the ginger.",
  "Warm the milk in a small pan over medium heat for 3 to 4 minutes, until it steams.",
  "Whisk in the turmeric, ginger, black pepper and ground cinnamon and simmer gently for 3 minutes, stirring, until golden and fragrant. Do not let it boil over.",
  "Take it off the heat and stir in the jaggery until it melts.",
  "Taste for sweetness, strain into mugs and serve warm.",
]

[[recipe]]
id = "01a18bae-8f44-7c2a-a430-1b91b02ba245"
name = "Kokum sharbat"
serves = 4
prep_minutes = 5
cook_minutes = 10
ingredients = [
