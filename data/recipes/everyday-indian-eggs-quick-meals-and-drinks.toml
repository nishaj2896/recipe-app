  { id = "salt", to_taste = true },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Mix the semolina with the curd, the water, grated ginger, chopped green chillies and salt into a thick batter. Rest for 15 minutes.",
  "Bring a steamer to a boil and grease a tin about 20 cm across.",
  "Stir the fruit salt into the batter and pour it into the tin at once.",
  "Steam for 12 to 15 minutes, until a knife comes out clean. Cut into squares.",
