[[recipe]]
id = "01a18bae-8f4f-7453-8b00-7f116896f065"
name = "Kesar pista milk"
serves = 3
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "milk", amount = 3, unit = "cup" },
  { id = "saffron", amount = 1, unit = "pinch" },
  { id = "pistachios", amount = 20, unit = "piece" },
  { id = "sugar", amount = 3, unit = "tbsp" },
  { id = "green-cardamom", amount = 3, unit = "piece" },
]
steps = [
  "Soak the saffron in a spoonful of the milk, warmed. Finely chop the pistachios and crush the cardamom seeds.",
  "Bring the rest of the milk to a boil in a heavy pan over medium heat, then simmer for 10 minutes, stirring often, until slightly thick.",
  "Stir in the saffron milk, sugar, cardamom and most of the pistachios and simmer for 3 minutes, until pale yellow.",
  "Taste for sweetness, pour into glasses and scatter the rest of the pistachios over. Serve warm or chilled.",
]
