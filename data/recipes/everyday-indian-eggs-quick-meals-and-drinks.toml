[[recipe]]
id = "01a15175-3c16-7eb1-a711-d43ee35c650f"
name = "Masala omelette"
serves = 2
prep_minutes = 5
cook_minutes = 5
ingredients = [
  { id = "egg", amount = 4, unit = "piece" },
  { id = "onion", amount = 1, unit = "small" },
  { id = "tomato", amount = 1, unit = "small" },
  { id = "green-chillies", amount = 1, unit = "piece" },
  { id = "coriander-leaves", amount = 1, unit = "tbsp" },
  { id = "red-chilli-powder", amount = 0.25, unit = "tsp" },
  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Finely chop the onion, tomato, green chillies and coriander leaves.",
  "Beat the egg in a bowl with the red chilli powder and salt, then stir in the chopped vegetables and herbs.",
