  { id = "sugar", amount = 0.5, unit = "cup" },
  { id = "cumin-powder", amount = 0.5, unit = "tsp" },
  { id = "black-salt", amount = 0.25, unit = "tsp" },
  { id = "water", amount = 3, unit = "cup" },
]
steps = [
  "Rinse the kokum under the tap.",
  "Simmer the kokum with the sugar and a third of the water in a pan over medium heat for 8 to 10 minutes, until the liquid is deep purple and syrupy.",
  "Leave it to cool, then press the kokum hard against a sieve to squeeze out its juice, and discard the kokum.",
  "Stir in the rest of the water, the cumin powder and black salt.",
  "Taste and balance the sweetness and sourness. Serve chilled.",
]

[[recipe]]
id = "01a18bae-8f46-7c2c-aa69-2bad3cac75d8"
name = "Aam panna"
serves = 4
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "raw-mango", amount = 2, unit = "medium" },
  { id = "sugar", amount = 0.5, unit = "cup" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "black-salt", amount = 0.5, unit = "tsp" },
  { id = "mint", amount = 2, unit = "tbsp" },
  { id = "water", amount = 4, unit = "cup" },
]
steps = [
  "Wash the raw mangoes and put them in a pan with half the water.",
  "Boil over medium heat for 12 to 15 minutes, until the skins turn pale and the flesh is completely soft when pressed.",
  "Lift the raw mangoes out and let them cool, then peel them and scrape all the raw mango pulp off the stones.",
  "Blend the raw mango pulp with the sugar, cumin powder, black salt, mint and the rest of the water until smooth.",
  "Taste and balance the sweet and sour. Strain and serve chilled.",
]

[[recipe]]
id = "01a18bae-8f48-771d-ba43-a7befdb8f067"
