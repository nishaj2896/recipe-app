[[recipe]]
id = "01a18bae-8f4b-7469-a05d-6c23cca2edf1"
name = "Badam milk"
serves = 3
prep_minutes = 10
cook_minutes = 15
ingredients = [
  { id = "almonds", amount = 20, unit = "piece" },
  { id = "milk", amount = 3, unit = "cup" },
  { id = "sugar", amount = 3, unit = "tbsp" },
  { id = "saffron", amount = 1, unit = "pinch" },
  { id = "green-cardamom", amount = 3, unit = "piece" },
  { id = "water", amount = 0.5, unit = "cup" },
]
steps = [
  "Bring the water to a boil, pour it over the almonds and leave for 20 minutes, until the skins wrinkle. Slip off the skins.",
  "Grind the almonds with a little of the milk to a fine paste.",
  "Simmer the rest of the milk in a heavy pan over medium heat for 8 minutes, stirring often, until slightly reduced.",
  "Stir in the blended almond mixture, sugar, saffron and the cardamom seeds, crushed, and simmer for 5 minutes, until creamy and pale gold.",
  "Taste for sweetness and serve warm.",
]

