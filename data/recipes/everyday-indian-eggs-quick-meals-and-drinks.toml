  "Spread with green chutney, add the paneer filling, sprinkle chaat masala and the rest of the lemon juice, and roll up. Serve hot.",
]

[[recipe]]
id = "01a18ba9-fdee-7581-95ec-b06f1bf9bfde"
name = "Rava dhokla"
