  { id = "lemon", amount = 1, unit = "medium" },
  { id = "olive-oil", amount = 2, unit = "tbsp" },
  { id = "coriander-leaves", amount = 0.25, unit = "cup" },
  { id = "salt", to_taste = true },
]
steps = [
  "Peel the sweet potato and cut it into cubes about 2 cm across. Chop the onion and grate the garlic and ginger.",
  "Heat the olive oil in a heavy pan over medium heat. Fry the onion for 8 minutes, until soft.",
  "Add the garlic, ginger, cumin powder and harissa and stir for 1 minute.",
  "Add the sweet potato, drained chickpeas, canned tomatoes and vegetable stock. Season with salt. Cover and simmer on low heat for 20 to 25 minutes, until the sweet potato is tender.",
  "Stir in the spinach for 2 minutes, until wilted. Add the lemon juice.",
  "Taste and adjust the heat and salt. Scatter the chopped coriander leaves over and serve hot.",
]

[[recipe]]
id = "01a18c16-b219-77ad-9f5a-e63ffafc19de"
name = "Couscous with vegetables"
serves = 4
prep_minutes = 20
cook_minutes = 40
ingredients = [
  { id = "couscous", amount = 1.5, unit = "cup" },
  { id = "vegetable-stock", amount = 4, unit = "cup" },
  { id = "carrot", amount = 2, unit = "medium" },
  { id = "zucchini", amount = 1, unit = "medium" },
  { id = "turnip", amount = 1, unit = "medium" },
  { id = "chickpeas", amount = 1, unit = "can" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "raisins", amount = 0.25, unit = "cup" },
  { id = "ras-el-hanout", amount = 2, unit = "tsp" },
  { id = "tomato-paste", amount = 1, unit = "tbsp" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "olive-oil", amount = 2, unit = "tbsp" },
  { id = "coriander-leaves", amount = 0.25, unit = "cup" },
  { id = "salt", to_taste = true },
]
steps = [
  "Peel the carrots and turnip and cut them into chunks about 4 cm long. Cut the zucchini the same size and chop the onion.",
  "Heat the olive oil in a pot over medium heat. Fry the onion for 6 minutes, then stir in the ras el hanout and tomato paste for 1 minute.",
  "Add the carrots, turnip and most of the vegetable stock. Season with salt and simmer for 15 minutes.",
  "Add the zucchini, drained chickpeas and raisins and simmer for 10 to 12 minutes, until all the vegetables are tender.",
  "Bring the rest of the vegetable stock to a boil and pour it over the couscous with the butter and a little salt. Cover for 5 minutes, then fluff with a fork.",
  "Taste the vegetable broth and adjust. Mound the couscous on a platter, arrange the vegetables on top, spoon over plenty of broth and scatter the chopped coriander leaves over.",
