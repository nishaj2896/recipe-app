  { id = "salt", to_taste = true },
]
steps = [
  "Toast the walnuts in a dry pan over medium heat for 4 to 5 minutes, until fragrant. Set aside a few for the top.",
  "Drain the roasted red peppers well and pat them dry.",
  "Pulse the peppers, the rest of the walnuts, the breadcrumbs, garlic, cumin powder, chilli flakes, pomegranate molasses and lemon juice until thick and slightly coarse.",
  "With the motor running, pour in most of the extra-virgin olive oil. Season with salt.",
