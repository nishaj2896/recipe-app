[[recipe]]
id = "01a18c16-b21b-72d4-8743-b45d91b056e2"
name = "Harira"
serves = 6
prep_minutes = 20
cook_minutes = 90
ingredients = [
  { id = "lamb", amount = 300, unit = "g" },
  { id = "green-lentils", amount = 0.5, unit = "cup" },
  { id = "chickpeas", amount = 1, unit = "can" },
  { id = "canned-tomatoes", amount = 1, unit = "can" },
  { id = "tomato-paste", amount = 1, unit = "tbsp" },
  { id = "onion", amount = 1, unit = "large" },
  { id = "celery", amount = 2, unit = "piece" },
  { id = "coriander-leaves", amount = 0.5, unit = "cup" },
  { id = "parsley", amount = 0.5, unit = "cup" },
  { id = "dry-ginger-powder", amount = 1, unit = "tsp" },
  { id = "turmeric", amount = 1, unit = "tsp" },
