[[recipe]]
id = "01a15175-3c2d-7620-b329-81eec06563fc"
name = "Shakshuka"
serves = 4
prep_minutes = 10
cook_minutes = 20
ingredients = [
  { id = "egg", amount = 6, unit = "piece" },
  { id = "bell-pepper", amount = 1, unit = "large" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "tomato", amount = 6, unit = "medium" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "paprika", amount = 2, unit = "tsp" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Thinly slice the onion and bell pepper. Finely chop the garlic and the tomatoes.",
  "Heat the oil in a wide pan over medium heat. Add the onion and bell pepper and cook for 8 minutes, until soft and sweet.",
  "Add the garlic and paprika and stir for 30 seconds, until fragrant.",
  "Add the tomatoes and salt and simmer for 10 minutes, stirring now and then, until thick and saucy.",
  "Make hollows in the sauce with the back of a spoon and crack an egg into each.",
  "Cover and cook on low heat for 5 to 7 minutes, until the whites are set and the yolks are still soft.",
  "Serve straight from the pan with crusty bread.",
]

[[recipe]]
id = "01a18c16-b1f7-7efc-a15b-2215d35ab4bd"
name = "Hummus"
serves = 6
prep_minutes = 10
cook_minutes = 0
ingredients = [
  { id = "chickpeas", amount = 2, unit = "can" },
  { id = "tahini", amount = 0.33, unit = "cup" },
  { id = "lemon", amount = 1, unit = "large" },
  { id = "garlic", amount = 1, unit = "clove" },
  { id = "cumin-powder", amount = 0.5, unit = "tsp" },
  { id = "extra-virgin-olive-oil", amount = 2, unit = "tbsp" },
  { id = "paprika", amount = 0.25, unit = "tsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.25, unit = "cup" },
]
steps = [
  "Drain the chickpeas. For the smoothest hummus, pinch off the skins.",
  "Blend the tahini with the lemon juice and garlic for 1 minute, until thick and pale.",
  "Add the chickpeas, cumin powder and salt and blend for 2 minutes, scraping down the sides.",
  "With the motor running, add the iced water a splash at a time and blend for 2 to 3 minutes more, until very smooth and fluffy.",
  "Taste and adjust the lemon, garlic and salt.",
  "Spread in a shallow bowl, make a swirl with the back of a spoon, drizzle with the extra-virgin olive oil and dust with the paprika.",
]

[[recipe]]
id = "01a18c16-b1f9-7734-b05c-1bd32e66ce7e"
name = "Baba ganoush"
serves = 4
prep_minutes = 10
cook_minutes = 35
ingredients = [
  { id = "brinjal", amount = 2, unit = "large" },
  { id = "tahini", amount = 3, unit = "tbsp" },
  { id = "lemon", amount = 1, unit = "medium" },
  { id = "garlic", amount = 1, unit = "clove" },
  { id = "extra-virgin-olive-oil", amount = 2, unit = "tbsp" },
  { id = "parsley", amount = 2, unit = "tbsp" },
  { id = "dried-pomegranate-seeds", amount = 1, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Prick the brinjals all over. Char them directly over a gas flame or under a very hot grill for 20 to 30 minutes, turning, until the skin is blackened and the flesh collapses.",
  "Leave them in a covered bowl for 10 minutes, then peel off the skin and drain the flesh in a sieve for 10 minutes.",
  "Grate the garlic. Chop the flesh roughly with a knife.",
  "Mix it with the tahini, lemon juice, garlic and salt until creamy but still a little chunky.",
  "Taste and adjust the lemon and salt.",
  "Spread in a bowl, drizzle with the extra-virgin olive oil and scatter the chopped parsley and the dried pomegranate seeds over.",
]

[[recipe]]
id = "01a18c16-b1fb-7119-aad6-b093cf759ea7"
name = "Falafel"
serves = 4
prep_minutes = 25
cook_minutes = 15
plan_ahead = { wait_minutes = 720, note = "soak for 12 hours" }
ingredients = [
  { id = "chickpeas", amount = 1.5, unit = "cup" },
  { id = "parsley", amount = 1, unit = "cup" },
  { id = "coriander-leaves", amount = 0.5, unit = "cup" },
  { id = "onion", amount = 1, unit = "small" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "cumin-powder", amount = 1.5, unit = "tsp" },
  { id = "coriander-powder", amount = 1, unit = "tsp" },
  { id = "baking-soda", amount = 0.5, unit = "tsp" },
  { id = "oil", amount = 4, unit = "cup" },
  { id = "tahini", amount = 0.33, unit = "cup" },
  { id = "lemon", amount = 1, unit = "medium" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 0.33, unit = "cup" },
]
steps = [
  "Use dried chickpeas, never canned. Soak them for at least 12 hours, until doubled in size. Drain and dry well.",
  "Pulse the chickpeas, parsley, coriander leaves, onion and garlic in a food processor until finely chopped, like coarse sand, but not a paste.",
  "Mix in the cumin powder, coriander powder, baking soda and salt. Chill for 30 minutes.",
  "Whisk the tahini with the lemon juice, a little salt and the water until smooth and pourable.",
  "Shape the mixture into balls about 4 cm across and flatten them slightly.",
  "Heat the oil in a deep pan to 175°C. Fry in batches for 3 to 4 minutes, until deep brown and crisp outside and green and fluffy inside. Drain.",
  "Taste one and adjust the sauce. Serve hot with the tahini sauce.",
]

[[recipe]]
