]
steps = [
  "Peel the potatoes and cut them into cubes about 2 cm across. Rinse and dry them well.",
  "Heat the oven to 220°C. Toss the potatoes with most of the olive oil and salt on a large tray in a single layer.",
  "Roast for 30 to 35 minutes, turning once, until golden and crisp.",
  "Meanwhile, crush the garlic and chop the coriander leaves.",
