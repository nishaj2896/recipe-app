steps = [
  "Cut the lamb into small cubes about 1.5 cm across. Chop the onion and celery and finely chop the coriander leaves and parsley.",
  "Heat the olive oil in a large pot over medium heat. Brown the lamb for 5 minutes, then add the onion and celery for 5 minutes.",
