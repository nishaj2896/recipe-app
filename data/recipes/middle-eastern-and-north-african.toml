[[recipe]]
id = "01a18c16-b228-79f2-aae6-a01b03825bb0"
name = "Chicken freekeh"
serves = 4
prep_minutes = 15
cook_minutes = 60
ingredients = [
  { id = "chicken", amount = 1.2, unit = "kg" },
  { id = "freekeh", amount = 1.5, unit = "cup" },
  { id = "onion", amount = 1, unit = "large" },
  { id = "olive-oil", amount = 2, unit = "tbsp" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "allspice", amount = 1, unit = "tsp" },
  { id = "ground-cinnamon", amount = 0.5, unit = "tsp" },
  { id = "chicken-stock", amount = 4, unit = "cup" },
  { id = "almond-flakes", amount = 0.33, unit = "cup" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "parsley", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use bone-in chicken thighs. Season with half the allspice, the ground cinnamon, black pepper and salt.",
  "Rinse the freekeh well and drain. Chop the onion.",
  "Heat the olive oil in a heavy pot over medium-high heat. Brown the chicken for 4 minutes a side and lift it out.",
  "Lower the heat, add half the butter and fry the onion for 8 minutes, until soft and golden. Stir in the freekeh and the rest of the allspice for 2 minutes.",
  "Add the chicken stock and season with salt. Nestle the chicken back in, bring to a boil, then cover and simmer on low heat for 35 to 40 minutes, until the freekeh is tender and the chicken is cooked through.",
  "Fry the almond flakes in the rest of the butter for 2 minutes, until golden.",
  "Taste the freekeh and adjust the salt. Serve with the almond flakes and chopped parsley scattered over.",
