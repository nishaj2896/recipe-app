steps = [
  "Cut the tops off the bell peppers and keep them as lids. Scoop out the seeds.",
  "Rinse the rice. Finely chop the onion and parsley.",
  "Heat half the olive oil in a pan over medium heat and fry the onion for 6 minutes, until soft. Stir in half the tomato paste for 1 minute.",
  "Mix the onion with the lamb mince, rice, parsley, dried mint, allspice and salt.",
