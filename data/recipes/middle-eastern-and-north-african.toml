  { id = "extra-virgin-olive-oil", amount = 0.25, unit = "cup" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use fine bulgur. Rinse it, then soak it in the lemon juice for 15 minutes, until softened.",
  "Pick the parsley and mint leaves and chop them finely with a sharp knife. Don't use a food processor, which bruises them.",
  "Dice the tomatoes very small and finely slice the spring onions.",
  "Mix the herbs, tomatoes, spring onions and bulgur with the lemon juice it soaked in.",
  "Stir in the extra-virgin olive oil and salt.",
  "Taste and add more lemon or salt. It should be bright and sharp. Serve straight away.",
]

[[recipe]]
