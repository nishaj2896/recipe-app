[[recipe]]
id = "01a18c16-b222-7e60-9fe2-ea84a41abf4b"
name = "Manakish"
serves = 4
prep_minutes = 20
cook_minutes = 15
plan_ahead = { wait_minutes = 60, note = "let the dough rise for 1 hour" }
ingredients = [
  { id = "all-purpose-flour", amount = 2.5, unit = "cup" },
  { id = "active-dry-yeast", amount = 1.5, unit = "tsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "olive-oil", amount = 0.5, unit = "cup" },
  { id = "zaatar", amount = 0.33, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Stir the dry yeast and sugar into the warm water and leave for 5 minutes, until foamy.",
  "Mix the all-purpose flour and salt, add the yeast mixture and a spoonful of the olive oil and knead for 8 minutes into a smooth, soft dough. Cover and leave for 1 hour, until doubled.",
  "Heat the oven to its highest setting, at least 250°C, with a heavy tray inside.",
  "Mix the za'atar with the rest of the olive oil into a loose paste.",
  "Divide the dough into 6 and roll each into a round about 5 mm thick. Make dimples all over with your fingertips and spread the za'atar paste over, leaving a thin rim.",
  "Bake on the hot tray for 7 to 9 minutes, until the edges are golden and the base is crisp.",
  "Taste one and serve warm, folded or flat.",
]

[[recipe]]
id = "01a18c16-b224-7f04-92ee-74edc53f2d1e"
