cook_minutes = 5
ingredients = [
  { id = "roasted-red-peppers", amount = 1.5, unit = "cup" },
  { id = "walnuts", amount = 1, unit = "cup" },
  { id = "breadcrumbs", amount = 0.33, unit = "cup" },
