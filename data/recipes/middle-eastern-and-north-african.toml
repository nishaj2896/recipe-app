[[recipe]]
id = "01a18c16-b209-7d99-9c42-bc6502136fb5"
name = "Mujadara"
serves = 4
prep_minutes = 15
cook_minutes = 45
ingredients = [
  { id = "green-lentils", amount = 1, unit = "cup" },
  { id = "basmati-rice", amount = 0.75, unit = "cup" },
  { id = "onion", amount = 3, unit = "large" },
  { id = "olive-oil", amount = 0.33, unit = "cup" },
  { id = "cumin-powder", amount = 1.5, unit = "tsp" },
  { id = "curd", amount = 0.5, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 4, unit = "cup" },
]
steps = [
  "Rinse the green lentils and simmer them in the water for 15 minutes, until just starting to soften. Rinse and drain the basmati rice.",
  "Slice the onions thinly into half-moons. Heat the olive oil in a wide pan over medium-high heat and fry the onions for 20 to 25 minutes, stirring often, until deep brown and crisp in places.",
  "Lift out half the onions and drain them on kitchen paper. Salt them lightly.",
  "Stir the cumin powder into the onions left in the pan for 30 seconds. Add the basmati rice and stir for 1 minute.",
  "Add the lentils with their cooking liquid and salt. Cover and cook on the lowest heat for 18 to 20 minutes, until the basmati rice and lentils are tender. Rest covered for 5 minutes.",
  "Taste and adjust the salt. Fluff with a fork, top with the rest of the onions and serve with the yogurt.",
]

