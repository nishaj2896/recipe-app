[[recipe]]
id = "01a15175-3c2d-7620-b329-81eec06563fc"
name = "Shakshuka"
serves = 4
prep_minutes = 10
cook_minutes = 20
ingredients = [
  { id = "egg", amount = 6, unit = "piece" },
  { id = "bell-pepper", amount = 1, unit = "large" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "tomato", amount = 6, unit = "medium" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "paprika", amount = 2, unit = "tsp" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Thinly slice the onion and bell pepper. Finely chop the garlic and the tomatoes.",
  "Heat the oil in a wide pan over medium heat. Add the onion and bell pepper and cook for 8 minutes, until soft and sweet.",
  "Add the garlic and paprika and stir for 30 seconds, until fragrant.",
  "Add the tomatoes and salt and simmer for 10 minutes, stirring now and then, until thick and saucy.",
  "Make hollows in the sauce with the back of a spoon and crack an egg into each.",
  "Cover and cook on low heat for 5 to 7 minutes, until the whites are set and the yolks are still soft.",
  "Serve straight from the pan with crusty bread.",
]
