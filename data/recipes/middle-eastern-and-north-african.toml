[[recipe]]
id = "01a18c16-b22b-739b-a58e-a4dedab71efc"
name = "Kunafa"
serves = 8
prep_minutes = 25
cook_minutes = 40
ingredients = [
  { id = "kataifi-pastry", amount = 400, unit = "g" },
  { id = "butter", amount = 0.75, unit = "cup" },
  { id = "mozzarella", amount = 1.5, unit = "cup" },
  { id = "ricotta", amount = 1, unit = "cup" },
  { id = "sugar", amount = 1, unit = "cup" },
  { id = "lemon", amount = 0.5, unit = "medium" },
  { id = "orange-blossom-water", amount = 1, unit = "tsp" },
  { id = "pistachios", amount = 0.25, unit = "cup" },
  { id = "water", amount = 0.75, unit = "cup" },
]
steps = [
  "For the syrup, simmer the sugar and the water for 8 to 10 minutes, until slightly thick. Stir in the lemon juice and orange blossom water and leave to cool.",
  "Heat the oven to 190°C. Melt the butter.",
  "Pull the kataifi pastry apart into short strands and toss with the melted butter until every strand is coated.",
  "Press half the pastry firmly into a round baking tin about 25 cm across.",
  "Mix the grated mozzarella and ricotta and spread it over, leaving a thin rim. Cover with the rest of the pastry and press down.",
  "Bake for 35 to 40 minutes, until deep golden and crisp.",
  "Pour the cool syrup over the hot kunafa straight away. Leave for 5 minutes, then turn it out.",
  "Taste and scatter the chopped pistachios over. Serve warm, while the cheese is still stretchy.",
]
