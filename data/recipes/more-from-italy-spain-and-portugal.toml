[[recipe]]
id = "01a18c1a-e27b-7abc-a096-d47ecb92b51e"
name = "Spaghetti alle vongole"
serves = 2
prep_minutes = 15
cook_minutes = 15
ingredients = [
  { id = "pasta", amount = 200, unit = "g" },
  { id = "clams", amount = 750, unit = "g" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "chilli-flakes", amount = 0.25, unit = "tsp" },
  { id = "white-wine", amount = 0.5, unit = "cup" },
  { id = "parsley", amount = 0.25, unit = "cup" },
  { id = "extra-virgin-olive-oil", amount = 0.25, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 3, unit = "l" },
]
steps = [
  "Scrub the clams and soak them in cold salted tap water for 20 minutes so they spit out any sand. Throw away any that are broken or stay open when tapped.",
  "Bring the water to a boil with plenty of salt. Cook the spaghetti for 2 minutes less than the packet says.",
  "Meanwhile, slice the garlic and chop the parsley. Warm most of the extra-virgin olive oil in a large pan over medium heat and fry the garlic and chilli flakes for 1 minute, until pale golden.",
  "Add the clams and white wine, cover and cook over high heat for 3 to 4 minutes, until the clams open. Throw away any that stay closed.",
  "Drain the pasta, keeping some of the cooking water. Add the pasta to the clams with a splash of the cooking water and toss for 2 minutes, until the sauce clings.",
  "Taste and adjust. Toss in the parsley, drizzle with the rest of the extra-virgin olive oil and serve straight away.",
]

[[recipe]]
id = "01a18c1a-e27d-7fe4-943a-9d732b234229"
name = "Pasta puttanesca"
serves = 4
prep_minutes = 10
cook_minutes = 20
ingredients = [
  { id = "pasta", amount = 400, unit = "g" },
  { id = "canned-tomatoes", amount = 1, unit = "can" },
  { id = "olives", amount = 0.5, unit = "cup" },
  { id = "capers", amount = 2, unit = "tbsp" },
  { id = "anchovies", amount = 4, unit = "piece" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "chilli-flakes", amount = 0.5, unit = "tsp" },
  { id = "parsley", amount = 0.25, unit = "cup" },
  { id = "extra-virgin-olive-oil", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 4, unit = "l" },
]
steps = [
  "Bring the water to a boil with salt. Cook the spaghetti as the packet says, until just tender.",
  "Meanwhile, slice the garlic, halve the olives and rinse the capers.",
  "Warm the extra-virgin olive oil in a large pan over medium heat. Add the anchovies, garlic and chilli flakes and stir for 2 minutes, until the anchovies melt.",
  "Add the canned tomatoes, olives and capers and simmer for 10 to 12 minutes, until thick.",
  "Drain the pasta, keeping some of the cooking water. Toss it into the sauce with a splash of the cooking water for 1 minute.",
  "Taste and adjust the salt. Scatter the chopped parsley over and serve hot.",
]

[[recipe]]
id = "01a18c1a-e27f-7967-be9d-dbd985fefd84"
name = "Penne with sausage and peppers"
serves = 4
prep_minutes = 15
cook_minutes = 25
ingredients = [
  { id = "pasta", amount = 400, unit = "g" },
  { id = "sausages", amount = 400, unit = "g" },
  { id = "bell-pepper", amount = 2, unit = "medium" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "canned-tomatoes", amount = 1, unit = "can" },
  { id = "chilli-flakes", amount = 0.25, unit = "tsp" },
  { id = "parmesan", amount = 0.5, unit = "cup" },
  { id = "basil", amount = 0.25, unit = "cup" },
  { id = "olive-oil", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 4, unit = "l" },
]
steps = [
  "Squeeze the sausages out of their skins and break them into small pieces. Slice the bell peppers and onion and chop the garlic.",
  "Heat the olive oil in a large pan over medium-high heat. Brown the sausage for 5 to 6 minutes, breaking it up.",
  "Add the peppers and onion and cook for 6 to 8 minutes, until soft. Add the garlic and chilli flakes for 1 minute.",
  "Add the canned tomatoes and simmer for 10 minutes, until thick.",
  "Meanwhile, bring the water to a boil with salt and cook the penne as the packet says. Drain, keeping some of the cooking water.",
  "Toss the penne into the sauce with half the grated parmesan and a splash of the cooking water.",
  "Taste and adjust. Serve with the rest of the parmesan and the basil torn over.",
]

[[recipe]]
