[[recipe]]
id = "01a18bb7-ff1a-7300-9ab2-90a0e2f9f85f"
name = "Anarsa"
serves = 8
prep_minutes = 40
cook_minutes = 25
plan_ahead = { wait_minutes = 4800, note = "soak the rice for 3 days" }
ingredients = [
  { id = "rice", amount = 1, unit = "cup" },
  { id = "jaggery", amount = 0.5, unit = "cup" },
  { id = "poppy-seeds", amount = 3, unit = "tbsp" },
  { id = "ghee", amount = 2, unit = "cup" },
  { id = "water", amount = 6, unit = "cup" },
]
steps = [
  "Rinse the rice and soak it in a third of the water for 3 days, draining it and adding another third of the water each day. Drain and spread it on a cloth for 1 hour, until damp but not wet.",
  "Grind the rice to a fine powder and sift it.",
  "Grate the jaggery and knead it into the ground rice with a spoonful of the ghee into a stiff dough. Cover and rest overnight.",
  "Roll balls of dough about 3 cm across in the poppy seeds and flatten them into rounds about 5 mm thick, poppy seeds facing out.",
  "Heat the ghee over low heat. Fry the anarsa poppy-seed side up, spooning ghee over, for 3 to 4 minutes, until they puff and the edges are golden. Don't turn them.",
  "Drain upright so the extra ghee runs off, and cool before serving.",
]

[[recipe]]
id = "01a18bb7-ff1c-7ef7-ba69-b20292551f62"
name = "Peanut chikki"
serves = 8
prep_minutes = 5
cook_minutes = 20
ingredients = [
  { id = "peanuts", amount = 1, unit = "cup" },
  { id = "jaggery", amount = 0.75, unit = "cup" },
  { id = "ghee", amount = 1, unit = "tbsp" },
]
steps = [
  "Grease a tray and a rolling pin with a little of the ghee.",
  "Dry-roast the peanuts in a pan over medium-low heat for 6 to 8 minutes, until browned in spots. Rub off the skins and split them.",
  "Melt the jaggery with the rest of the ghee in a heavy pan over low heat for 6 to 8 minutes, stirring, until it froths and a drop on a cold plate sets hard and snaps.",
  "Stir in the peanuts quickly until coated.",
  "Tip onto the tray and roll out to about 5 mm thick while hot. Mark into squares with a knife.",
  "Cool for 10 minutes, then break along the marks and serve.",
]

[[recipe]]
