  "Grind the sugar fine. Mix it into the khoa with the desiccated coconut, chopped almonds, raisins and crushed cardamom seeds.",
  "Roll balls of dough into thin rounds about 10 cm across. Put a spoonful of filling on one half, wet the edge, fold over and press to seal. Crimp the edge with a fork.",
  "Heat the oil for deep frying over low-medium heat. Fry a few gujiyas at a time for 5 to 6 minutes, turning, until golden and crisp.",
  "Drain and cool before serving.",
]

[[recipe]]
