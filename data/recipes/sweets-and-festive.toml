[[recipe]]
id = "01a18bb7-ff28-73bb-801b-781947b78900"
name = "Aval payasam"
serves = 4
prep_minutes = 5
cook_minutes = 25
ingredients = [
  { id = "flattened-rice", amount = 0.5, unit = "cup" },
  { id = "milk", amount = 4, unit = "cup" },
  { id = "jaggery", amount = 0.5, unit = "cup" },
  { id = "ghee", amount = 2, unit = "tbsp" },
  { id = "green-cardamom", amount = 3, unit = "piece" },
  { id = "cashews", amount = 10, unit = "piece" },
  { id = "raisins", amount = 1, unit = "tbsp" },
]
steps = [
  "Heat the ghee in a heavy pan over medium heat. Fry the cashews and raisins for 1 minute, until golden. Lift them out.",
