image = { file = "01a18bbd-3cf2-72f3-97ac-b70d056785cb.webp", sha256 = "11b91d83031773b0405936b92b677c27024b44ea8f48257a029a5e32a82bba5e", alt = "Margherita pizza with blistered crust, mozzarella and basil" }
ingredients = [
