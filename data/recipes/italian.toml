[[recipe]]
id = "01a18bbd-3d13-795f-9d7c-3923bf77eb23"
name = "Pasta e fagioli"
serves = 6
prep_minutes = 15
cook_minutes = 40
ingredients = [
  { id = "borlotti-beans", amount = 2, unit = "can" },
  { id = "pasta", amount = 200, unit = "g" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "carrot", amount = 1, unit = "medium" },
  { id = "celery", amount = 2, unit = "piece" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "canned-tomatoes", amount = 1, unit = "can" },
  { id = "rosemary", amount = 2, unit = "sprig" },
  { id = "vegetable-stock", amount = 5, unit = "cup" },
  { id = "olive-oil", amount = 3, unit = "tbsp" },
  { id = "parmesan", amount = 40, unit = "g" },
  { id = "chilli-flakes", amount = 0.25, unit = "tsp" },
  { id = "salt", to_taste = true },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
]
steps = [
  "Finely chop the onion, carrot, celery and garlic. Drain and rinse the borlotti beans.",
  "Heat the olive oil in a large pan over medium heat. Cook the onion, carrot and celery for 8 to 10 minutes, until soft. Add the garlic, rosemary and chilli flakes for 1 minute.",
  "Add the canned tomatoes and cook for 3 minutes. Add the beans and vegetable stock and simmer for 10 minutes.",
  "Lift out the rosemary sprigs. Blend about a third of the soup until smooth and stir it back in.",
  "Add the ditalini and simmer for 10 to 12 minutes, stirring often so it doesn't stick, until the pasta is tender and the soup is thick.",
  "Taste for salt and black pepper. Serve hot with the parmesan grated over.",
]

[[recipe]]
id = "01a18bbd-3d16-72e1-a27e-155012bb9ff1"
name = "Shrimp scampi"
serves = 4
prep_minutes = 15
cook_minutes = 15
ingredients = [
  { id = "prawns", amount = 500, unit = "g" },
  { id = "pasta", amount = 400, unit = "g" },
  { id = "garlic", amount = 6, unit = "clove" },
  { id = "butter", amount = 4, unit = "tbsp" },
  { id = "olive-oil", amount = 2, unit = "tbsp" },
  { id = "white-wine", amount = 0.5, unit = "cup" },
  { id = "lemon", amount = 1, unit = "medium" },
  { id = "chilli-flakes", amount = 0.5, unit = "tsp" },
  { id = "parsley", amount = 3, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "black-pepper", amount = 0.25, unit = "tsp" },
  { id = "water", amount = 4, unit = "l" },
]
steps = [
  "Peel and devein the prawns, pat them dry and season with salt and black pepper. Thinly slice the garlic and chop the parsley.",
  "Bring the water to a rolling boil with plenty of salt and cook the linguine until al dente. Scoop out a mugful of the cooking water and drain.",
  "Meanwhile, heat the olive oil and half the butter in a wide pan over medium-high heat. Cook the prawns for 1 minute per side, until just pink. Lift them out.",
  "Lower the heat to medium. Cook the garlic and chilli flakes for 1 minute, until fragrant and pale golden.",
  "Add the white wine and lemon juice and simmer for 2 minutes, until reduced by half. Swirl in the rest of the butter.",
  "Add the linguine, prawns and a splash of the cooking water and toss for 1 minute, until glossy.",
  "Taste for salt, toss in the parsley and serve straight away.",
]
