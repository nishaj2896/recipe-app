steps = [
  "Very finely chop the onion, carrot, celery and garlic.",
  "Heat the olive oil in a heavy pan over medium-low heat. Cook the vegetables for 10 minutes, until soft. Raise the heat, add the beef mince and cook for 8 to 10 minutes, breaking it up, until browned.",
  "Add the red wine and simmer for 3 minutes. Add the canned tomatoes, tomato paste, the water, salt and black pepper. Simmer gently with the lid ajar for 1 hour, stirring now and then, until thick.",
  "For the white sauce, melt the butter in a pan over medium heat, stir in the all-purpose flour for 1 minute, then whisk in the milk a little at a time. Simmer for 5 minutes, whisking, until it coats a spoon. Season with salt and grated nutmeg.",
