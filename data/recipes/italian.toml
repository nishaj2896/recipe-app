  "Bring the water to a rolling boil and add plenty of salt.",
  "Cut the bacon into strips about 1 cm wide. Finely grate the pecorino and parmesan. Whisk the eggs with most of the cheese and plenty of the black pepper.",
  "Cook the spaghetti in the water until al dente, still slightly firm in the centre.",
  "Meanwhile, fry the bacon in a large dry pan over medium heat for 6 to 8 minutes, until the fat runs and the edges are crisp. Take the pan off the heat.",
