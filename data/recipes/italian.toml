[[recipe]]
id = "01a18bbd-3ce9-71d9-a100-997abd112da6"
name = "Mushroom risotto"
serves = 4
prep_minutes = 15
cook_minutes = 35
image = { file = "01a18bbd-3ce9-71d9-a100-997abd112da6.webp", sha256 = "ce182cf43153d716648db5aa4bc31c7265821e3e76d69b5f16044e65a17e8390", alt = "Creamy mushroom risotto topped with sliced mushrooms, thyme and parmesan" }
ingredients = [
  { id = "arborio-rice", amount = 1.5, unit = "cup" },
  { id = "mushroom", amount = 400, unit = "g" },
  { id = "dried-mushrooms", amount = 15, unit = "g" },
  { id = "onion", amount = 1, unit = "small" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "white-wine", amount = 0.5, unit = "cup" },
  { id = "vegetable-stock", amount = 5, unit = "cup" },
  { id = "butter", amount = 4, unit = "tbsp" },
  { id = "olive-oil", amount = 2, unit = "tbsp" },
  { id = "parmesan", amount = 60, unit = "g" },
  { id = "thyme", amount = 3, unit = "sprig" },
  { id = "salt", to_taste = true },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
]
steps = [
  "Soak the dried mushrooms in a little of the stock, warmed, for 20 minutes. Lift them out, chop them and strain the liquid back into the rest of the vegetable stock. Keep the stock hot in a pan.",
  "Slice the fresh mushrooms. Finely chop the onion and garlic and grate the parmesan.",
  "Heat the olive oil and half the butter in a wide pan over medium-high heat. Fry the fresh mushrooms for 6 to 8 minutes, until golden. Add the garlic, soaked mushrooms and thyme leaves for 1 minute. Lift them out.",
