[[recipe]]
id = "01a18bbd-3ce2-7a5b-b957-059ee79f0139"
name = "Lasagne"
serves = 8
prep_minutes = 40
cook_minutes = 165
ingredients = [
  { id = "lasagne-sheets", amount = 250, unit = "g" },
  { id = "beef-mince", amount = 750, unit = "g" },
  { id = "onion", amount = 1, unit = "large" },
  { id = "carrot", amount = 1, unit = "medium" },
  { id = "celery", amount = 2, unit = "piece" },
  { id = "garlic", amount = 3, unit = "clove" },
  { id = "canned-tomatoes", amount = 2, unit = "can" },
  { id = "tomato-paste", amount = 2, unit = "tbsp" },
  { id = "red-wine", amount = 0.5, unit = "cup" },
  { id = "olive-oil", amount = 2, unit = "tbsp" },
  { id = "milk", amount = 4, unit = "cup" },
  { id = "butter", amount = 4, unit = "tbsp" },
  { id = "all-purpose-flour", amount = 0.33, unit = "cup" },
