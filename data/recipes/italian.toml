  { id = "water", amount = 1.5, unit = "cup" },
]
steps = [
  "Bring the water to a boil, stir in the instant coffee and leave it to cool completely.",
  "Separate the eggs. Whisk the yolks with the sugar for 3 to 4 minutes, until pale and thick. Beat in the mascarpone until smooth.",
  "Whisk the whites in a clean bowl until they hold stiff peaks. Fold them gently into the mascarpone mixture in batches.",
  "Dip each ladyfinger very briefly in the coffee, a second on each side, and lay them in a single layer in a dish about 25 by 20 cm.",
  "Spread half the mascarpone mixture over. Repeat with the rest of the ladyfingers and the rest of the mascarpone mixture.",
  "Cover and chill for at least 6 hours, ideally overnight, until set.",
  "Sift the cocoa powder over just before serving. Cut into squares and serve cold.",
]

[[recipe]]
id = "01a18bbd-3d0f-719d-adfe-4066b95cc763"
name = "Panna cotta"
serves = 6
prep_minutes = 10
cook_minutes = 10
plan_ahead = { wait_minutes = 240, note = "chill for 4 hours" }
ingredients = [
  { id = "whipping-cream", amount = 2, unit = "cup" },
  { id = "milk", amount = 1, unit = "cup" },
  { id = "sugar", amount = 0.33, unit = "cup" },
  { id = "gelatin", amount = 2, unit = "tsp" },
  { id = "vanilla-extract", amount = 1, unit = "tsp" },
  { id = "strawberries", amount = 1, unit = "cup" },
  { id = "water", amount = 3, unit = "tbsp" },
]
steps = [
  "Sprinkle the gelatin over the water in a small bowl and leave for 5 minutes, until spongy.",
  "Heat the whipping cream, milk and half the sugar in a pan over medium heat for 4 to 5 minutes, stirring, until steaming and the sugar dissolves. Don't let it boil.",
  "Take it off the heat and stir in the gelatin until fully dissolved. Stir in the vanilla extract.",
  "Pour into small glasses or moulds and cool, then chill for at least 4 hours, until set with a gentle wobble.",
  "Hull and slice the strawberries and toss them with the rest of the sugar. Leave for 15 minutes, until juicy.",
  "Serve the panna cotta cold, topped with the strawberries and their juice.",
]

