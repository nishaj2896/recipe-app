[[recipe]]
id = "01a15175-3c20-7774-8764-e8cf6dcf654a"
name = "Pasta aglio e olio"
serves = 4
prep_minutes = 5
cook_minutes = 15
ingredients = [
  { id = "pasta", amount = 400, unit = "g" },
  { id = "garlic", amount = 6, unit = "clove" },
  { id = "olive-oil", amount = 0.333, unit = "cup" },
  { id = "chilli-flakes", amount = 1, unit = "tsp" },
  { id = "parsley", amount = 0.5, unit = "bunch" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 4, unit = "l" },
]
steps = [
  "Bring the water to a rolling boil and add plenty of salt.",
  "Cook the pasta until al dente, still slightly firm in the centre.",
  "Meanwhile, slice the garlic thinly and chop the parsley.",
  "Warm the olive oil and garlic in a large pan over low heat for 3 to 4 minutes, until the garlic is pale golden. Don't let it brown, or it turns bitter.",
  "Add the chilli flakes and stir for 10 seconds.",
  "Scoop out a mugful of the pasta cooking water, then drain the pasta.",
  "Add the pasta and a splash of the cooking water to the pan. Toss hard over medium heat for 1 minute, until a glossy sauce clings to the pasta.",
