  "Thinly slice the onions, slice the garlic and chop the tomatoes and parsley.",
  "In the rest of the olive oil, fry the onions for 12 minutes, until very soft. Add the garlic for 2 minutes, then the tomatoes, sugar and salt for 5 minutes. Stir in the parsley.",
