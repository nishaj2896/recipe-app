[[recipe]]
id = "01a18c4f-8e51-78cf-94a3-56308cf794c4"
name = "Shish tawook"
serves = 4
prep_minutes = 20
cook_minutes = 15
ingredients = [
  { id = "chicken", amount = 750, unit = "g" },
  { id = "curd", amount = 0.5, unit = "cup" },
  { id = "garlic", amount = 4, unit = "clove" },
  { id = "lemon", amount = 1, unit = "medium" },
  { id = "tomato-paste", amount = 1, unit = "tbsp" },
  { id = "paprika", amount = 1, unit = "tsp" },
  { id = "dried-oregano", amount = 1, unit = "tsp" },
  { id = "olive-oil", amount = 3, unit = "tbsp" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "salt", to_taste = true },
  { id = "pita-bread", amount = 4, unit = "piece" },
]
steps = [
  "Use boneless chicken breast. Cut it into cubes about 3 cm across. Grate the garlic and juice the lemon.",
  "Mix the yogurt, garlic, lemon juice, tomato paste, paprika, dried oregano, olive oil, salt and black pepper. Toss the chicken in it and leave in the fridge for at least 2 hours.",
  "Thread the chicken onto skewers, leaving small gaps between the pieces.",
  "Heat a grill pan over high heat. Cook the skewers for 10 to 12 minutes, turning, until charred at the edges and cooked through.",
  "Warm the pita bread in the pan for 30 seconds a side.",
  "Taste and adjust the salt. Serve the chicken in the warm pita bread.",
]

[[recipe]]
id = "01a18c4f-8e53-7495-8f63-15b7f7108ae9"
name = "Kibbeh"
serves = 6
prep_minutes = 40
cook_minutes = 55
ingredients = [
  { id = "bulgur", amount = 1, unit = "cup" },
  { id = "lamb-mince", amount = 750, unit = "g" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "pine-nuts", amount = 0.33, unit = "cup" },
  { id = "allspice", amount = 1, unit = "tsp" },
  { id = "ground-cinnamon", amount = 0.5, unit = "tsp" },
  { id = "cumin-powder", amount = 1, unit = "tsp" },
  { id = "olive-oil", amount = 0.33, unit = "cup" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Rinse the bulgur, cover it with the water and soak for 20 minutes. Drain and squeeze dry.",
  "Grate one of the onions and finely chop the other.",
  "For the shell, knead most of the lamb mince with the bulgur, grated onion, half the allspice, the cumin powder, salt and black pepper for 5 minutes, until smooth and paste-like.",
  "For the filling, heat a little of the olive oil in a pan over medium heat. Toast the pine nuts for 2 minutes, until golden, and lift them out. Fry the chopped onion for 6 minutes, then the rest of the lamb mince for 6 to 8 minutes, until browned. Stir in the rest of the allspice, the ground cinnamon, salt and the pine nuts.",
  "Heat the oven to 190°C. Brush a baking dish with some of the olive oil.",
  "Press half the shell mixture into the dish. Spread the filling over, then cover with the rest of the shell mixture, smoothing it with wet hands.",
  "Score into diamonds with a knife and pour the rest of the olive oil over.",
  "Bake for 35 to 40 minutes, until deep brown and crisp at the edges.",
  "Rest for 10 minutes. Taste and adjust the salt at the table, then serve warm, cut into diamonds.",
]

[[recipe]]
