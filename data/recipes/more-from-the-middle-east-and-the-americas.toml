steps = [
  "Peel the pumpkin, cut it into chunks and steam for 20 to 25 minutes, until very soft. Drain well and blend to a smooth puree. Leave to cool.",
  "Heat the oven to 200°C. Roll out the shortcrust pastry and line a deep pie tin. Prick the base, line with baking paper weighed down with pie weights and bake for 15 minutes.",
  "Lift out the paper and weights and bake for 5 minutes more, until dry. Lower the oven to 180°C.",
  "Whisk the pumpkin puree with the brown sugar, eggs, evaporated milk, ground cinnamon, ground ginger, nutmeg, ground cloves and salt until smooth.",
  "Pour into the pastry case and bake for 40 to 50 minutes, until set at the edges with a slight wobble in the centre.",
  "Cool completely on a rack. Taste and serve in wedges, at room temperature or chilled.",
]
