[[recipe]]
id = "01a18c4f-8e65-79bf-90f1-c901a3d60b0c"
name = "Philly cheesesteak"
serves = 4
prep_minutes = 15
cook_minutes = 20
ingredients = [
  { id = "beef", amount = 600, unit = "g" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "bell-pepper", amount = 1, unit = "medium" },
  { id = "processed-cheese", amount = 8, unit = "slice" },
  { id = "hot-dog-buns", amount = 4, unit = "piece" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "butter", amount = 1, unit = "tbsp" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use boneless ribeye. Freeze the beef for 30 minutes, then slice it as thinly as you can. Season with salt and black pepper.",
  "Thinly slice the onions and bell pepper.",
  "Heat half the oil in a wide pan over medium heat and fry the onions and bell pepper for 10 minutes, until soft and lightly browned. Push them to one side.",
  "Turn the heat to high, add the rest of the oil and the beef, and cook for 2 to 3 minutes, chopping with a spatula, until just browned. Mix with the onions.",
