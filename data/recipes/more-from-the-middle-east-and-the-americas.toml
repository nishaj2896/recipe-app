[[recipe]]
id = "01a18c4f-8e5f-7dc6-8f18-c542dcd5f7ae"
name = "Lahmacun"
serves = 4
prep_minutes = 40
cook_minutes = 30
ingredients = [
  { id = "all-purpose-flour", amount = 3, unit = "cup" },
  { id = "active-dry-yeast", amount = 1, unit = "tsp" },
  { id = "sugar", amount = 1, unit = "tsp" },
  { id = "water", amount = 1, unit = "cup" },
  { id = "olive-oil", amount = 2, unit = "tbsp" },
  { id = "lamb-mince", amount = 300, unit = "g" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "bell-pepper", amount = 1, unit = "medium" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "parsley", amount = 0.5, unit = "cup" },
  { id = "tomato-paste", amount = 2, unit = "tbsp" },
  { id = "red-chilli-powder", amount = 1, unit = "tsp" },
  { id = "cumin-powder", amount = 0.5, unit = "tsp" },
