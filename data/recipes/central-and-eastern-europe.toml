[[recipe]]
id = "01a18c4f-8e48-703e-851e-ecff58525a98"
name = "Swedish meatballs"
serves = 4
prep_minutes = 25
cook_minutes = 30
ingredients = [
  { id = "beef-mince", amount = 500, unit = "g" },
  { id = "breadcrumbs", amount = 0.5, unit = "cup" },
  { id = "milk", amount = 0.33, unit = "cup" },
  { id = "onion", amount = 1, unit = "small" },
  { id = "egg", amount = 1, unit = "large" },
  { id = "allspice", amount = 0.25, unit = "tsp" },
  { id = "nutmeg", amount = 0.25, unit = "tsp" },
  { id = "butter", amount = 3, unit = "tbsp" },
  { id = "all-purpose-flour", amount = 2, unit = "tbsp" },
  { id = "chicken-stock", amount = 2, unit = "cup" },
  { id = "cream", amount = 0.5, unit = "cup" },
  { id = "soy-sauce", amount = 1, unit = "tsp" },
