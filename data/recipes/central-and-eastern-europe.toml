[[recipe]]
id = "01a18c4f-8e4a-7da0-a168-9785b5513199"
name = "Kasespatzle"
serves = 4
prep_minutes = 15
cook_minutes = 40
ingredients = [
  { id = "all-purpose-flour", amount = 2.5, unit = "cup" },
  { id = "egg", amount = 4, unit = "large" },
  { id = "milk", amount = 0.5, unit = "cup" },
  { id = "nutmeg", amount = 0.25, unit = "tsp" },
  { id = "emmental", amount = 150, unit = "g" },
  { id = "gruyere", amount = 150, unit = "g" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "butter", amount = 3, unit = "tbsp" },
  { id = "chives", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 3, unit = "l" },
]
steps = [
  "Beat the eggs with the milk, nutmeg and salt. Stir in the all-purpose flour and beat with a wooden spoon for 5 minutes, until the batter is thick, smooth and bubbly. Rest for 15 minutes.",
  "Thinly slice the onions. Melt the butter in a pan over medium heat and fry the onions for 15 to 20 minutes, stirring, until deep brown and crisp.",
  "Heat the oven to 180°C. Grate the emmental and gruyere and mix them together.",
  "Bring the water to a boil in a large pot with salt. Press the batter through a colander with large holes into the water. Cook for 2 minutes, until the spaetzle float.",
  "Lift out the spaetzle with a slotted spoon. Layer them in a baking dish with the grated emmental and gruyere, finishing with a layer of both.",
  "Bake for 10 minutes, until melted and bubbling.",
  "Chop the chives. Taste and adjust the salt, then serve hot with the fried onions and chives on top.",
]

[[recipe]]
id = "01a18c4f-8e4c-79fd-8fd8-bd6a304b9f44"
name = "Cabbage rolls"
serves = 6
prep_minutes = 40
cook_minutes = 80
ingredients = [
  { id = "cabbage", amount = 1, unit = "small-head" },
  { id = "beef-mince", amount = 500, unit = "g" },
  { id = "rice", amount = 0.5, unit = "cup" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "garlic", amount = 2, unit = "clove" },
  { id = "paprika", amount = 1, unit = "tsp" },
  { id = "passata", amount = 2, unit = "cup" },
  { id = "tomato-paste", amount = 1, unit = "tbsp" },
  { id = "sour-cream", amount = 0.5, unit = "cup" },
  { id = "dill", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Cut out the core of the cabbage. Lower it into a large pot of boiling salted tap water for 3 to 5 minutes, peeling off the outer leaves as they soften. Drain the leaves and shave down the thick ribs.",
  "Rinse the rice. Finely chop the onions and garlic.",
  "Heat half the oil in a pan over medium heat and fry half the onions for 6 minutes, until soft. Add the garlic for 1 minute and leave to cool.",
  "Mix the beef mince with the rice, the fried onions, paprika, salt and black pepper.",
  "Put a spoonful of filling at the base of each leaf, fold in the sides and roll up tightly.",
  "Heat the rest of the oil in a heavy pot and fry the rest of the onions for 5 minutes. Stir in the tomato paste, passata and the water and season with salt.",
  "Lay the rolls seam side down in the sauce, packed tightly. Cover and simmer on low heat for 60 minutes, until the cabbage is tender and the rice is cooked.",
  "Chop the dill. Taste the sauce and adjust, then serve hot with the sour cream and dill.",
]

[[recipe]]
id = "01a18c4f-8e4f-7cd9-b9c2-69653c3ea757"
name = "Apple strudel"
serves = 8
prep_minutes = 40
cook_minutes = 45
ingredients = [
  { id = "filo-pastry", amount = 250, unit = "g" },
  { id = "apple", amount = 5, unit = "medium" },
  { id = "sugar", amount = 0.33, unit = "cup" },
  { id = "ground-cinnamon", amount = 1, unit = "tsp" },
  { id = "raisins", amount = 0.33, unit = "cup" },
  { id = "walnuts", amount = 0.5, unit = "cup" },
  { id = "lemon", amount = 1, unit = "small" },
  { id = "breadcrumbs", amount = 0.5, unit = "cup" },
  { id = "butter", amount = 0.5, unit = "cup" },
  { id = "icing-sugar", amount = 1, unit = "tbsp" },
]
steps = [
  "Heat the oven to 190°C. Melt the butter. Toast the breadcrumbs in some of the butter in a pan over medium heat for 3 to 4 minutes, until golden.",
  "Peel, core and thinly slice the apples. Chop the walnuts. Mix the apples with the sugar, ground cinnamon, raisins, walnuts and the zest and juice of the lemon.",
  "Lay the filo pastry on a cloth, overlapping the sheets into a large rectangle and brushing each layer with the rest of the butter. Save a little butter for the top.",
  "Scatter the breadcrumbs along the long edge nearest you, then spread the apple filling over them.",
  "Using the cloth, roll it up tightly, tuck in the ends and lift onto a lined tray seam side down. Brush with the saved butter.",
  "Bake for 35 to 40 minutes, until deep golden and crisp.",
  "Cool for 15 minutes. Taste the filling for sweetness, dust with the icing sugar, cut into thick slices and serve warm.",
]
