  { id = "salt", to_taste = true },
]
steps = [
  "Peel and coarsely grate the potatoes and onion.",
  "Squeeze them hard in a clean cloth to remove as much liquid as you can.",
  "Mix with the eggs, all-purpose flour, salt and black pepper.",
  "Heat the oil in a wide pan over medium-high heat.",
