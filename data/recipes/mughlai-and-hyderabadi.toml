ingredients = [
  { id = "mutton", amount = 500, unit = "g" },
  { id = "raw-papaya", amount = 2, unit = "tbsp" },
  { id = "ginger-garlic-paste", amount = 1.5, unit = "tbsp" },
  { id = "black-pepper", amount = 1.5, unit = "tsp" },
  { id = "garam-masala", amount = 1, unit = "tsp" },
  { id = "red-chilli-powder", amount = 1, unit = "tsp" },
  { id = "green-chillies", amount = 2, unit = "piece" },
  { id = "lemon", amount = 1, unit = "small" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "ghee", amount = 3, unit = "tbsp" },
  { id = "coriander-leaves", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use boneless mutton from the leg. Slice it against the grain into thin strips about 1 cm thick and pound each one between sheets of cling film until about 5 mm thick.",
  "Peel the raw papaya and grate it to a paste. Finely chop the green chillies.",
  "Rub the mutton with the raw papaya, ginger garlic paste, black pepper, garam masala, red chilli powder, green chillies, lemon juice, salt and a spoonful of the ghee. Marinate in the fridge for 4 hours.",
  "Heat a heavy cast-iron griddle over medium-high heat for 5 minutes, until very hot. Brush it with ghee.",
  "Lay the mutton strips on it in a single layer and cook for 3 to 4 minutes per side, brushing with more ghee, until browned with charred spots and cooked through. Work in batches.",
  "Slice the onion into thin rings and fry them on the griddle for 2 minutes, until lightly charred.",
  "Pile the mutton with the onion on a plate, scatter the coriander leaves over and serve hot.",
]

[[recipe]]
