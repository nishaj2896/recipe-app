steps = [
  "Warm the milk and soak the saffron in it for 15 minutes. Roughly chop the onions.",
  "Simmer the onions and cashews with half the water for 10 minutes, until soft. Blend to a very smooth, pale paste.",
  "Heat the ghee in a heavy pan over medium heat. Fry the cardamom for 30 seconds, then the ginger garlic paste for 1 minute.",
