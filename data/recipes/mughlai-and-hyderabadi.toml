[[recipe]]
id = "01a18bb5-de5b-797a-97c6-04313ac35d9e"
name = "Chicken shahi korma"
serves = 4
prep_minutes = 20
cook_minutes = 45
ingredients = [
  { id = "chicken", amount = 1, unit = "kg" },
  { id = "onion", amount = 3, unit = "medium" },
  { id = "curd", amount = 0.75, unit = "cup" },
  { id = "cashews", amount = 15, unit = "piece" },
  { id = "almonds", amount = 10, unit = "piece" },
  { id = "cream", amount = 0.25, unit = "cup" },
  { id = "ginger-garlic-paste", amount = 1.5, unit = "tbsp" },
  { id = "green-cardamom", amount = 5, unit = "piece" },
  { id = "cloves", amount = 4, unit = "piece" },
  { id = "cinnamon-sticks", amount = 1, unit = "piece" },
  { id = "bay-leaves", amount = 2, unit = "leaf" },
  { id = "white-pepper", amount = 0.5, unit = "tsp" },
  { id = "kashmiri-chilli-powder", amount = 1, unit = "tsp" },
  { id = "coriander-powder", amount = 1.5, unit = "tsp" },
  { id = "garam-masala", amount = 1, unit = "tsp" },
  { id = "kewra-water", amount = 0.5, unit = "tsp" },
  { id = "ghee", amount = 0.25, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1.5, unit = "cup" },
]
steps = [
  "Thinly slice the onions. Heat the ghee in a heavy pan over medium heat and fry them for 12 to 15 minutes, until golden brown. Lift them out.",
  "Grind the fried onions, cashews and almonds with the curd and a little of the water to a very smooth paste.",
  "Fry the cardamom, cloves, cinnamon and bay leaves in the same ghee for 30 seconds. Add the ginger garlic paste and fry for 1 minute.",
  "Add the chicken and fry for 6 minutes, until it turns opaque.",
  "Add the onion paste, Kashmiri chilli powder, coriander powder, white pepper and salt and cook on medium-low heat for 6 to 8 minutes, stirring, until the ghee starts to separate.",
  "Add the rest of the water, cover and simmer for 18 to 20 minutes, until the chicken is tender and the gravy is thick and creamy.",
  "Stir in the cream, garam masala and kewra water and simmer for 2 minutes. Taste for salt and serve hot with sheermal or rotis.",
]

[[recipe]]
id = "01a18bb5-de5d-742b-be6a-c8b6652134ac"
name = "Murgh zafrani"
serves = 4
prep_minutes = 20
cook_minutes = 40
ingredients = [
  { id = "chicken", amount = 1, unit = "kg" },
  { id = "saffron", amount = 2, unit = "pinch" },
  { id = "milk", amount = 0.25, unit = "cup" },
  { id = "onion", amount = 2, unit = "medium" },
  { id = "cashews", amount = 20, unit = "piece" },
  { id = "curd", amount = 0.5, unit = "cup" },
  { id = "cream", amount = 0.33, unit = "cup" },
  { id = "ginger-garlic-paste", amount = 1.5, unit = "tbsp" },
  { id = "green-cardamom", amount = 5, unit = "piece" },
  { id = "white-pepper", amount = 0.5, unit = "tsp" },
  { id = "garam-masala", amount = 0.5, unit = "tsp" },
