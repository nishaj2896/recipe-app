[[recipe]]
id = "01a18bb5-de40-7910-9565-67c1cca06b59"
name = "Haleem"
serves = 6
prep_minutes = 30
cook_minutes = 150
plan_ahead = { wait_minutes = 180, note = "soak for 3 hours" }
ingredients = [
  { id = "mutton", amount = 750, unit = "g" },
  { id = "broken-wheat", amount = 0.75, unit = "cup" },
  { id = "chana-dal", amount = 2, unit = "tbsp" },
  { id = "masoor-dal", amount = 2, unit = "tbsp" },
  { id = "moong-dal", amount = 2, unit = "tbsp" },
  { id = "urad-dal", amount = 2, unit = "tbsp" },
  { id = "onion", amount = 4, unit = "medium" },
  { id = "ginger-garlic-paste", amount = 2, unit = "tbsp" },
  { id = "green-chillies", amount = 4, unit = "piece" },
  { id = "curd", amount = 0.5, unit = "cup" },
  { id = "garam-masala", amount = 1.5, unit = "tsp" },
  { id = "red-chilli-powder", amount = 1.5, unit = "tsp" },
  { id = "turmeric", amount = 0.5, unit = "tsp" },
  { id = "mint", amount = 0.5, unit = "cup" },
  { id = "coriander-leaves", amount = 0.5, unit = "cup" },
  { id = "cashews", amount = 12, unit = "piece" },
  { id = "lemon", amount = 2, unit = "small" },
  { id = "ghee", amount = 0.5, unit = "cup" },
  { id = "oil", amount = 0.5, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 10, unit = "cup" },
]
steps = [
  "Rinse the broken wheat, chana dal, masoor dal, moong dal and urad dal together in several changes of water and soak them in plenty of water for 3 hours. Drain.",
  "Thinly slice the onions. Heat the oil in a heavy pan over medium heat and fry them for 15 to 18 minutes, stirring often, until deep brown and crisp. Lift them out and drain. Fry the cashews in the same oil for 1 minute, until golden.",
  "In the same oil, fry the ginger garlic paste and green chillies for 1 minute. Add the mutton, turmeric, red chilli powder and salt and sear for 8 minutes.",
  "Stir in the curd, half the fried onions, half the garam masala and half the mint and coriander leaves. Add half the water, cover and simmer on low heat for 60 minutes, until the mutton falls off the bone.",
  "Meanwhile, simmer the soaked wheat and dals with the rest of the water and salt in a covered pan over low heat for 45 to 50 minutes, until completely soft. Blend or mash to a smooth paste.",
  "Lift the bones out of the mutton and shred the meat finely. Stir the meat and its gravy into the wheat paste.",
  "Cook on low heat for 25 to 30 minutes, beating hard with a wooden spoon or masher every few minutes, until the haleem turns sticky, stretchy and smooth.",
  "Stir in the ghee and the rest of the garam masala. Taste for salt and serve hot, topped with the rest of the fried onions, mint and coriander leaves, the cashews and lemon wedges.",
]

