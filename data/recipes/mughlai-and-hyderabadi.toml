steps = [
  "Pit the dates and cut them into thin slivers. Slice the almonds, pistachios and cashews.",
  "Heat the ghee in a heavy pan over medium heat. Fry the nuts, dates and raisins for 2 minutes, until the nuts are golden. Lift them out.",
  "Fry the Indian vermicelli in the same ghee for 2 to 3 minutes, until golden brown.",
  "Pour in the milk and bring it to a boil, stirring. Simmer on low heat for 15 minutes, stirring often, until the milk thickens slightly.",
