steps = [
  "Cut the chicken into large pieces. Thinly slice the onions.",
  "Heat the oil in a heavy pan over medium heat and fry the onions for 15 minutes, until deep brown and crisp. Drain, keeping the oil.",
  "Dry-roast the cashews and almonds for 3 minutes, until lightly golden, then grind them with the fried onions and a little of the curd to a smooth paste.",
  "Mix the chicken with the nut and onion paste, the rest of the curd, the ginger garlic paste, slit green chillies, garam masala, red chilli powder, mint, coriander leaves, lemon juice and salt. Marinate for 2 hours.",
  "Heat a spoonful of the onion oil and the ghee in a heavy pan with a tight lid over medium heat. Add the chicken and its marinade and cook for 5 minutes, stirring, until it starts to bubble.",
