[[recipe]]
id = "01a18c1e-2c62-7dfa-8781-22ef6d936677"
name = "Sticky toffee pudding"
serves = 8
prep_minutes = 20
cook_minutes = 40
ingredients = [
  { id = "dates", amount = 1, unit = "cup" },
  { id = "baking-soda", amount = 1, unit = "tsp" },
  { id = "butter", amount = 0.75, unit = "cup" },
  { id = "muscovado-sugar", amount = 1, unit = "cup" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "self-raising-flour", amount = 1.25, unit = "cup" },
  { id = "vanilla-extract", amount = 1, unit = "tsp" },
  { id = "whipping-cream", amount = 1, unit = "cup" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Heat the oven to 180°C and butter a baking dish about 20 by 20 cm.",
  "Chop the dates and pour the water, boiling, over them. Stir in the baking soda and leave for 10 minutes.",
  "Beat a third of the butter with half the muscovado sugar until creamy. Beat in the eggs and vanilla extract.",
  "Fold in the self-raising flour, then the dates and their liquid, to a loose batter.",
  "Pour into the dish and bake for 30 to 35 minutes, until risen and a skewer comes out clean.",
  "For the toffee sauce, melt the rest of the butter with the rest of the muscovado sugar and half the double cream over medium heat. Simmer for 3 minutes, stirring, until glossy. Add a little salt.",
  "Taste the sauce. Prick the warm pudding all over, pour half the sauce over and serve in squares with the rest of the sauce and the rest of the double cream.",
]
