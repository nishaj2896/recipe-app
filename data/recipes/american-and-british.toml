[[recipe]]
id = "01a18c1e-2c40-75e0-8eba-f1c31a55564e"
name = "Clam chowder"
serves = 4
prep_minutes = 20
cook_minutes = 40
ingredients = [
  { id = "clams", amount = 1, unit = "kg" },
  { id = "bacon", amount = 4, unit = "slice" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "celery", amount = 2, unit = "piece" },
  { id = "potato", amount = 500, unit = "g" },
  { id = "all-purpose-flour", amount = 2, unit = "tbsp" },
  { id = "milk", amount = 2, unit = "cup" },
  { id = "cream", amount = 0.5, unit = "cup" },
  { id = "butter", amount = 1, unit = "tbsp" },
  { id = "dried-thyme", amount = 0.5, unit = "tsp" },
  { id = "bay-leaves", amount = 1, unit = "piece" },
  { id = "black-pepper", amount = 0.25, unit = "tsp" },
  { id = "salt", to_taste = true },
  { id = "water", amount = 1, unit = "cup" },
]
steps = [
  "Scrub the clams. Bring the water to a boil in a large pot, add the clams, cover and steam for 5 to 6 minutes, until they open. Throw away any that stay closed.",
  "Lift out the clams, pull out the meat and chop it roughly. Strain the cooking liquid through a fine sieve to remove grit.",
  "Cut the bacon into strips and cook it in the butter in a pot over medium heat for 5 minutes, until crisp. Dice the onion and celery and cook them in the fat for 6 minutes.",
  "Stir in the all-purpose flour for 1 minute. Whisk in the clam liquid and milk.",
  "Add the diced potatoes, dried thyme and bay leaves. Simmer on low heat for 15 to 18 minutes, until the potatoes are tender.",
  "Stir in the clams and cream and warm through for 2 minutes without boiling. Season with salt and the black pepper.",
  "Taste and adjust, pick out the bay leaves and serve hot.",
]

