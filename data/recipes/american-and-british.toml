[[recipe]]
id = "01a18c1e-2c26-7602-b476-32b344331bf7"
name = "Fried chicken"
serves = 4
prep_minutes = 20
cook_minutes = 30
plan_ahead = { wait_minutes = 240, note = "marinate for 4 hours" }
ingredients = [
  { id = "chicken", amount = 1.5, unit = "kg" },
  { id = "buttermilk", amount = 2, unit = "cup" },
