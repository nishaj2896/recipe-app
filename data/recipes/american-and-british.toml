id = "01a18c1e-2c37-7643-ad0f-a16fdffaaf04"
name = "Full English breakfast"
serves = 2
prep_minutes = 10
cook_minutes = 25
ingredients = [
  { id = "sausages", amount = 4, unit = "piece" },
  { id = "bacon", amount = 4, unit = "slice" },
  { id = "egg", amount = 2, unit = "large" },
  { id = "mushroom", amount = 150, unit = "g" },
  { id = "tomato", amount = 2, unit = "medium" },
  { id = "baked-beans", amount = 1, unit = "can" },
  { id = "white-bread", amount = 2, unit = "slice" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "oil", amount = 2, unit = "tbsp" },
  { id = "black-pepper", amount = 0.25, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Heat the oven to 100°C to keep things warm as they cook.",
  "Heat half the oil in a large frying pan over medium-low heat. Cook the sausages for 15 to 18 minutes, turning, until browned and cooked through. Move them to the oven.",
  "Fry the bacon in the same pan for 4 to 5 minutes, until crisp. Halve the tomatoes and fry them cut side down for 3 minutes. Move them to the oven.",
  "Add half the butter, then the halved mushrooms, and fry for 5 minutes, until golden. Season with salt and the black pepper.",
  "Warm the baked beans in a small pan. Toast the white bread and butter it with the rest of the butter.",
  "Fry the eggs in the rest of the oil for 2 to 3 minutes, until the whites are set and the yolks still runny.",
  "Taste and season, then serve everything on warm plates.",
]

