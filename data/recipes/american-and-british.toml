  "Heat the oven to 220°C. Use chicken wings split at the joints and pat them very dry.",
  "Toss the chicken with the baking powder and salt. This helps the skin crisp.",
  "Lay them on a rack set over a lined tray. Roast for 45 to 50 minutes, turning once, until deep golden and crisp.",
  "Meanwhile, crumble the blue cheese and mash it with the sour cream, mayonnaise and lemon juice for a dip.",
