  { id = "salt", to_taste = true },
]
steps = [
  "Use bone-in chicken thighs and legs. Stir plenty of salt into the buttermilk, add the chicken and chill for at least 4 hours, or overnight.",
  "Whisk the all-purpose flour with the paprika, garlic powder, onion powder, cayenne, black pepper and salt.",
