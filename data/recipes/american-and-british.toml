  "Whisk the sugar and eggs for 3 to 4 minutes, until pale and thick. Whisk in the chocolate and vanilla extract.",
  "Sift in the all-purpose flour, cocoa powder and a little salt and fold until just combined.",
  "Spread in the tin and bake for 25 to 30 minutes, until the top is shiny and cracked and a skewer comes out with moist crumbs.",
  "Cool completely in the tin, then cut into squares. Taste one and serve.",
]

