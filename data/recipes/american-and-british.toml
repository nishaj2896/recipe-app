[[recipe]]
id = "01a15175-3c22-7b07-abf6-87ad9705c184"
name = "Macaroni and cheese"
serves = 4
prep_minutes = 5
cook_minutes = 20
ingredients = [
  { id = "pasta", amount = 300, unit = "g" },
  { id = "cheddar", amount = 200, unit = "g" },
  { id = "milk", amount = 500, unit = "ml" },
  { id = "butter", amount = 2, unit = "tbsp" },
  { id = "salt", to_taste = true },
  { id = "black-pepper", to_taste = true },
  { id = "water", amount = 3, unit = "l" },
]
steps = [
  "Bring the water to a rolling boil and add a good handful of salt.",
  "Add the pasta and cook, stirring now and then, until just tender with a slight bite, about 1 minute less than the packet says. Drain.",
  "Grate the cheddar.",
  "In the same pot, melt the butter over medium heat. Pour in the milk and heat until small bubbles appear at the edge, without letting it boil.",
  "Take the pot off the heat and stir in the cheddar a handful at a time, until it melts into a smooth sauce.",
  "Return the pasta to the pot and stir over low heat for 1 minute, until every piece is coated and the sauce is creamy.",
  "Season with salt and black pepper and serve hot.",
]

[[recipe]]
id = "01a18c1e-2c18-7153-810a-f7fcdbe62089"
name = "Classic cheeseburger"
serves = 4
prep_minutes = 15
cook_minutes = 10
ingredients = [
  { id = "beef-mince", amount = 600, unit = "g" },
  { id = "burger-buns", amount = 4, unit = "piece" },
  { id = "cheddar", amount = 4, unit = "slice" },
  { id = "lettuce", amount = 4, unit = "leaf" },
  { id = "tomato", amount = 1, unit = "large" },
  { id = "onion", amount = 1, unit = "small" },
  { id = "gherkins", amount = 4, unit = "piece" },
  { id = "ketchup", amount = 2, unit = "tbsp" },
  { id = "yellow-mustard", amount = 1, unit = "tbsp" },
  { id = "mayonnaise", amount = 2, unit = "tbsp" },
  { id = "butter", amount = 1, unit = "tbsp" },
  { id = "oil", amount = 1, unit = "tbsp" },
  { id = "black-pepper", amount = 0.5, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Use beef mince with about 20 percent fat. Divide it into 4 and shape loosely into patties about 2 cm thick and a little wider than the burger buns. Press a shallow dip in the centre of each.",
  "Slice the tomato, onion and gherkins thinly. Wash and dry the lettuce.",
  "Split the burger buns, spread the cut sides with the butter and toast them in a hot pan for 1 minute, until golden.",
  "Heat the oil in a heavy frying pan over high heat until very hot. Season the patties well with salt and the black pepper just before cooking.",
  "Cook for 3 to 4 minutes, without pressing, until a dark crust forms. Flip, lay the cheddar on top and cook for 2 to 3 minutes more, covering the pan for the last minute so the cheese melts.",
  "Spread the bottom buns with the mayonnaise, and the tops with the ketchup and yellow mustard.",
  "Taste a corner of a patty for salt. Build the burgers with the lettuce, tomato, patty, onion and gherkins and serve straight away.",
]

[[recipe]]
