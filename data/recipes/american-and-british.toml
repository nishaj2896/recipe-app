[[recipe]]
id = "01a18c1e-2c2c-712e-adff-f0ebcb7aebfe"
name = "Chicken pot pie"
serves = 6
prep_minutes = 25
cook_minutes = 55
ingredients = [
  { id = "chicken", amount = 600, unit = "g" },
  { id = "puff-pastry", amount = 320, unit = "g" },
  { id = "onion", amount = 1, unit = "medium" },
  { id = "carrot", amount = 2, unit = "medium" },
  { id = "celery", amount = 2, unit = "piece" },
  { id = "peas", amount = 0.75, unit = "cup" },
  { id = "butter", amount = 4, unit = "tbsp" },
