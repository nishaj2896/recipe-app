  { id = "milk", amount = 2, unit = "cup" },
  { id = "black-pepper", amount = 1, unit = "tsp" },
  { id = "salt", to_taste = true },
]
steps = [
  "Heat the oven to 220°C. Whisk most of the all-purpose flour with the baking powder, baking soda and salt.",
  "Grate the cold butter into the flour and rub it in quickly until it looks like coarse crumbs with some larger flakes.",
  "Stir in the cold buttermilk until just combined. Pat into a rectangle about 2 cm thick, fold in half, pat out again and cut into rounds about 6 cm across.",
