[[recipe]]
id = "01a18c1e-2c23-72f6-82d2-c21de41d22ab"
name = "Buffalo chicken wings"
serves = 4
prep_minutes = 15
cook_minutes = 50
ingredients = [
  { id = "chicken", amount = 1, unit = "kg" },
  { id = "baking-powder", amount = 1, unit = "tbsp" },
  { id = "hot-sauce", amount = 0.33, unit = "cup" },
  { id = "butter", amount = 3, unit = "tbsp" },
  { id = "blue-cheese", amount = 75, unit = "g" },
  { id = "sour-cream", amount = 0.33, unit = "cup" },
  { id = "mayonnaise", amount = 2, unit = "tbsp" },
  { id = "lemon", amount = 0.5, unit = "small" },
  { id = "celery", amount = 3, unit = "piece" },
  { id = "carrot", amount = 2, unit = "medium" },
  { id = "salt", to_taste = true },
]
