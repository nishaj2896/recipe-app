name = "Biscuits and gravy"
serves = 4
prep_minutes = 20
cook_minutes = 30
ingredients = [
  { id = "all-purpose-flour", amount = 2.25, unit = "cup" },
  { id = "baking-powder", amount = 1, unit = "tbsp" },
  { id = "baking-soda", amount = 0.25, unit = "tsp" },
  { id = "butter", amount = 0.5, unit = "cup" },
  { id = "buttermilk", amount = 0.75, unit = "cup" },
