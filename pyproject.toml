[project]
name = "recipe-app"
version = "0.1.0"
description = "Pantry to plate app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
recipe-app = "recipe_app:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "N",
    "S",
    "ASYNC",
    "PT",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]


[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true


[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false


[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = [
    "error"
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",

]


[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
